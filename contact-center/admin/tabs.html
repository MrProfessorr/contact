<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <title>Back Office SC 🏢</title>

  <link
    rel="stylesheet"
    href="./admin.css"
  >

  <link
    rel="stylesheet"
    href="./shared-ui.css"
  >

</head>

<body>


<!-- =====================================================
     ADMIN NAV
===================================================== -->

<header class="admin-nav">
  <div class="admin-nav-inner">
    <div class="admin-brand">
      <h1>
        Support Admin
      </h1>
    </div>
  </div>
</header>


<!-- =====================================================
     PAGE
===================================================== -->

<main class="admin-container">
  <div class="page-title">
    <div>
    </div>
  </div>


  <div class="tabs-admin-layout">


    <!-- =================================================
         LEFT SETTINGS
    ================================================== -->

    <div>


      <!-- SIDEBAR SETTINGS -->

      <section class="card tabs-settings-card">

        <h3>
          Sidebar Settings
        </h3>


        <div class="form-group">

          <div class="tabs-switch-row">

            <div>

              <label>
                Customer Sidebar
              </label>

              <div class="help-text">
                Show or hide the sidebar menu.
              </div>

            </div>


            <label class="switch">

              <input
                id="sidebarEnabled"
                type="checkbox"
                checked
              >

              <span class="slider"></span>

            </label>

          </div>

        </div>
        
        <div class="form-group">

          <label>
            Sidebar Icon
          </label>


          <div class="tabs-icon-preview-wrap">

            <div
              id="sidebarIconPreview"
              class="tabs-icon-preview"
            >
              ☰
            </div>

          </div>


          <input
            id="sidebarIconFile"
            type="file"
            accept="image/*"
            hidden
          >


          <button
            id="sidebarIconUploadBtn"
            class="btn btn-dark"
            type="button"
          >
            Upload Icon
          </button>

        </div>


        <div class="form-group">

          <label>
            Or Emoji
          </label>

          <input
            id="sidebarIconEmoji"
            class="shared-input"
            type="text"
            maxlength="10"
            autocomplete="off"
            placeholder="☰"
          >

        </div>


        <button
          id="saveSidebarBtn"
          class="btn btn-primary full"
          type="button"
        >
          Save Sidebar
        </button>

<div class="tabs-settings-divider"></div>
<!-- FOOTER NAVIGATION SETTINGS -->
  <h3>
    Footer Navigation Background
  </h3>


  <div class="form-group">

    <label>
      Background Color
    </label>

<input
  id="footerNavColor"
  class="tabs-footer-color-input"
  type="color"
  value="#171717"
>

    <div class="help-text">
      Used when no background image is uploaded.
    </div>

  </div>


  <div class="form-group">

    <label>
      Background Image
    </label>


<div
  id="footerNavBackgroundPreview"
  class="tabs-footer-background-preview"
></div>

    <input
      id="footerNavBackgroundFile"
      type="file"
      accept="image/*"
      hidden
    >


    <div class="tabs-form-actions">

      <button
        id="footerNavBackgroundUploadBtn"
        class="btn btn-dark"
        type="button"
      >
        Upload Background
      </button>

      <button
        id="footerNavBackgroundRemoveBtn"
        class="btn btn-dark"
        type="button"
      >
        Remove Image
      </button>

    </div>

  </div>


  <button
    id="saveFooterNavBtn"
    class="btn btn-primary full"
    type="button"
  >
    Save Footer Background
  </button>

      <!-- ADD TAB -->
<section class="card tabs-settings-card">
        <h3 id="tabFormTitle">
          Add Tab
        </h3>


        <input
          id="editingTabId"
          type="hidden"
        >


        <div class="form-group">

          <label for="tabName">
            Tab Name
          </label>

          <input
            id="tabName"
            class="shared-input"
            type="text"
            autocomplete="off"
            placeholder="Example: Home"
          >

        </div>


        <div class="form-group">

          <label for="tabUrl">
            Link / URL
          </label>

          <input
            id="tabUrl"
            class="shared-input"
            type="url"
            autocomplete="off"
            placeholder="https://..."
          >

        </div>


        <div class="form-group">

          <label>
            Tab Icon
          </label>


          <div class="tabs-icon-preview-wrap">

            <div
              id="tabIconPreview"
              class="tabs-icon-preview"
            >
              🔗
            </div>

          </div>


          <input
            id="tabIconFile"
            type="file"
            accept="image/*"
            hidden
          >


          <button
            id="tabIconUploadBtn"
            class="btn btn-dark"
            type="button"
          >
            Upload Icon
          </button>

        </div>


        <div class="form-group">

          <label for="tabIconEmoji">
            Or Emoji
          </label>

          <input
            id="tabIconEmoji"
            class="shared-input"
            type="text"
            maxlength="10"
            autocomplete="off"
            placeholder="🏠"
          >

        </div>

<div class="form-group">

  <label>
    Footer Text Image
  </label>

  <div class="tabs-icon-preview-wrap">

    <div
      id="footerTextImagePreview"
      class="tabs-footer-text-preview"
    >
      No Image
    </div>

  </div>

  <input
    id="footerTextImageFile"
    type="file"
    accept="image/*"
    hidden
  >

  <div class="tabs-form-actions">

    <button
      id="footerTextImageUploadBtn"
      class="btn btn-dark"
      type="button"
    >
      Upload Text Image
    </button>

    <button
      id="footerTextImageRemoveBtn"
      class="btn btn-dark"
      type="button"
    >
      Remove
    </button>

  </div>

</div>
        <div class="form-group">

          <label for="tabSort">
            Sort Position
          </label>

          <input
            id="tabSort"
            class="shared-input"
            type="number"
            min="1"
            step="1"
            value="1"
          >

        </div>


        <div class="tabs-switch-row">

          <span>
            Active
          </span>

          <label class="switch">

            <input
              id="tabEnabled"
              type="checkbox"
              checked
            >

            <span class="slider"></span>

          </label>

        </div>


        <div class="tabs-switch-row">

          <span>
            Show In Sidebar
          </span>

          <label class="switch">

            <input
              id="tabSidebar"
              type="checkbox"
              checked
            >

            <span class="slider"></span>

          </label>

        </div>


        <div class="tabs-switch-row">

          <span>
            Show In Footer
          </span>

          <label class="switch">

            <input
              id="tabFooter"
              type="checkbox"
              checked
            >

            <span class="slider"></span>

          </label>

        </div>


        <div class="tabs-form-actions">

          <button
            id="saveTabBtn"
            class="btn btn-primary"
            type="button"
          >
            Save Tab
          </button>


          <button
            id="cancelEditTabBtn"
            class="btn btn-dark hidden"
            type="button"
          >
            Cancel
          </button>

        </div>


        <div
          id="tabsSaveMessage"
          class="help-text"
        ></div>

      </section>

    </div>


    <!-- =================================================
         RIGHT LIST
    ================================================== -->

    <section class="card">

      <h3>
        Current Tabs
      </h3>

      <div
        id="tabsList"
        class="tabs-admin-list"
      >

        <div class="help-text">
          Loading tabs...
        </div>

      </div>

    </section>


  </div>

</main>


<script src="./shared-ui.js"></script>

<script
  type="module"
  src="./tabs.js"
></script>


</body>
</html>
