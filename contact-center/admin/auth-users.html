<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Authentication Users</title>

  <link rel="stylesheet" href="./shared-ui.css">
  <link rel="stylesheet" href="./admin.css">

  <style>
    * {
      box-sizing: border-box;
    }

    .auth-users-page {
      width: 100%;
    }

    .auth-users-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

.auth-search-control {
  width: 300px;
  height: 32px;
  flex: 0 0 300px;
  display: flex;
  align-items: stretch;
}


.auth-search-control input {
  width: calc(100% - 34px);
  min-width: 0;
  height: 32px;

  padding: 4px 11px;

  border: 1px solid var(--input-line);
  border-right: none;

  border-radius: 6px 0 0 6px;

  background: var(--input);
  color: var(--text);

  outline: none;
}


.auth-search-control button {
  width: 32px;
  min-width: 32px;
  height: 32px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  border: 1px solid var(--input-line);

  border-radius: 0 6px 6px 0;

  background: var(--input);

  color: var(--text2);

  cursor: pointer;

  transition:
    border-color .2s ease,
    color .2s ease,
    background .2s ease;
}


.auth-search-control:hover input,
.auth-search-control:hover button {
  border-color:
    var(--input-line-hover);
}


.auth-search-control:focus-within input,
.auth-search-control:focus-within button {
  border-color:
    var(--input-line-focus);
}


.auth-search-control button:hover {
  color:
    rgba(255,255,255,.85);
}


.auth-search-icon {
  width: 14px;
  height: 14px;

  display: block;

  transform-origin: center;
}


.auth-search-spinner {
  width: 14px;
  height: 14px;

  display: none;

  transform-origin: center;
}


.auth-search-control.is-syncing
.auth-search-icon {
  display: none;
}


.auth-search-control.is-syncing
.auth-search-spinner {
  display: block;

  animation:
    authSpin .75s linear infinite;
}


@keyframes authSpin {

  from {
    transform:
      rotate(0deg);
  }

  to {
    transform:
      rotate(360deg);
  }

}

    .auth-btn {
      min-height: 32px;
      border: 1px solid #383838;
      border-radius: 7px;
      background: #1d1d1d;
      color: #fff;
      padding: 6px 12px;
      cursor: pointer;
      font: inherit;
    }

    .auth-btn:hover {
      background: #282828;
    }

    .auth-btn-primary {
      background: #1677ff;
      border-color: #1677ff;
    }

    .auth-btn-primary:hover {
      background: #2b84ff;
    }

    .auth-btn-danger {
      color: #ff6b6b;
    }

    .auth-table-wrap {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid #333;
      border-radius: 8px;

      scrollbar-width: thin;
      scrollbar-color:
        rgba(255,255,255,.22)
        transparent;
    }

    .auth-table-wrap::-webkit-scrollbar {
      height: 6px;
    }

    .auth-table-wrap::-webkit-scrollbar-track {
      background: transparent;
    }

    .auth-table-wrap::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.22);
      border-radius: 999px;
    }

    .auth-table-wrap::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,.35);
    }

    .auth-table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
    }

    .auth-table th,
    .auth-table td {
      padding: 11px 12px;
      text-align: left;
      border-bottom: 1px solid #292929;
      white-space: nowrap;
      font-size: 13px;
    }

    .auth-table th {
      color: #aaa;
      font-weight: 600;
      background: #171717;
    }

    .auth-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .auth-uid {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .auth-uid code {
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #aaa;
    }

    .auth-copy-btn {
      border: 0;
      background: transparent;
      color: #7eb6ff;
      cursor: pointer;
      padding: 2px 4px;
    }

    .auth-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .auth-status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #777;
    }

    .auth-status.active {
      color: #68d391;
    }

    .auth-status.active::before {
      background: #68d391;
    }

    .auth-status.inactive {
      color: #aaa;
    }

    .auth-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .auth-empty {
      min-height: 180px;
      display: grid;
      place-items: center;
    }

.auth-pagination {
  width: 100%;

  display: grid;

  grid-template-columns:
    minmax(150px, 1fr)
    auto
    minmax(150px, 1fr);

  align-items: center;

  gap: 12px;

  padding-top: 14px;

  font-size: 12px;

  color: var(--muted);
}


.auth-pagination > #authPageInfo {
  justify-self: start;
}


.auth-pagination-nav {
  justify-self: center;

  display: flex;

  align-items: center;

  gap: 5px;
}


.auth-page-size {
  position: relative;

  justify-self: end;

  width: 105px;
}
.auth-page-size-control {
  width: 100%;
  height: 30px;

  display: flex;

  align-items: stretch;
}


.auth-page-size-input {
  width: calc(100% - 28px);
  min-width: 0;
  height: 30px;

  padding: 0 8px;

  border:
    1px solid var(--input-line);

  border-right: none;

  border-radius:
    6px 0 0 6px;

  background:
    var(--input);

  color:
    var(--text);

  outline: none;

  cursor: pointer;

  font-size: 12px;
}


.auth-page-size-arrow-btn {
  width: 28px;
  min-width: 28px;
  height: 30px;

  border:
    1px solid var(--input-line);

  border-radius:
    0 6px 6px 0;

  background:
    var(--input);

  color:
    var(--text2);

  cursor: pointer;

  font-size: 10px;
}


.auth-page-size-control:hover
.auth-page-size-input,

.auth-page-size-control:hover
.auth-page-size-arrow-btn {
  border-color:
    var(--input-line-hover);
}


.auth-page-size-menu {
  position: absolute;

  right: 0;
  bottom: calc(100% + 5px);

  z-index: 100;

  width: 105px;

  padding: 4px;

  border:
    1px solid var(--line);

  border-radius: 7px;

  background:
    var(--panel);

  box-shadow:
    0 10px 30px rgba(0,0,0,.35);
}


.auth-page-size-menu.hidden {
  display: none;
}


.auth-page-size-menu button {
  width: 100%;

  display: block;

  padding: 6px 8px;

  border: 0;

  border-radius: 5px;

  background: transparent;

  color: var(--text2);

  text-align: left;

  cursor: pointer;

  font-size: 12px;
}


.auth-page-size-menu button:hover {
  background:
    rgba(255,255,255,.07);

  color:
    var(--text);
}
    .auth-pagination-nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .auth-page-btn {
      min-width: 30px;
      height: 30px;
      border: 1px solid #333;
      background: #181818;
      color: #ccc;
      border-radius: 6px;
      cursor: pointer;
    }

    .auth-page-btn.active {
      background: #1677ff;
      border-color: #1677ff;
      color: #fff;
    }

    .auth-page-btn:disabled {
      opacity: .4;
      cursor: default;
    }

    .auth-page-size {
      width: 105px;
    }

    /* MODAL */

    .auth-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,.72);
      display: none;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 15px;
    }

    .auth-modal-backdrop.open {
      display: flex;
    }

    .auth-modal {
      width: min(680px, 100%);
      max-height: calc(100vh - 30px);
      overflow-y: auto;
      background: #151515;
      border: 1px solid #343434;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .auth-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 17px;
      border-bottom: 1px solid #292929;
    }

    .auth-modal-head h3 {
      margin: 0;
      font-size: 16px;
    }

    .auth-modal-close {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      font-size: 22px;
    }

    .auth-modal-body {
      padding: 17px;
    }

    .auth-form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .auth-field {
      min-width: 0;
    }

    .auth-field.full {
      grid-column: 1 / -1;
    }

    .auth-field > label {
      display: block;
      margin-bottom: 7px;
      color: #aaa;
      font-size: 12px;
    }

    .auth-input {
      width: 100%;
      height: 36px;
      border: 1px solid #373737;
      border-radius: 7px;
      background: #111;
      color: #fff;
      outline: 0;
      padding: 0 10px;
    }

    .auth-input:focus {
      border-color: #1677ff;
    }

    .auth-help {
      margin-top: 5px;
      color: #777;
      font-size: 11px;
    }

    .auth-modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    /* STATUS SWITCH */

    .auth-status-switch {
      display: inline-block;
      position: relative;
      cursor: pointer;
    }

    .auth-status-switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .auth-status-slider {
      position: relative;
      display: flex;
      align-items: center;
      width: 86px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: #444;
      transition: .2s;
    }

    .auth-status-slider::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: .2s;
    }

    .auth-status-text {
      width: 100%;
      padding-left: 18px;
      color: #fff;
      font-size: 10px;
      text-align: center;
    }

    .auth-status-text::before {
      content: "Inactive";
    }

    .auth-status-switch
      input:checked +
      .auth-status-slider {
      background: #1677ff;
    }

    .auth-status-switch
      input:checked +
      .auth-status-slider::before {
      transform: translateX(64px);
    }

    .auth-status-switch
      input:checked +
      .auth-status-slider
      .auth-status-text {
      padding-left: 0;
      padding-right: 18px;
    }

    .auth-status-switch
      input:checked +
      .auth-status-slider
      .auth-status-text::before {
      content: "Active";
    }

    .auth-manage-info {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      background: #111;
      margin-bottom: 15px;
    }

    .auth-manage-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 10px;
      font-size: 12px;
    }

    .auth-manage-row span:first-child {
      color: #777;
    }

    @media (max-width: 650px) {
      .auth-users-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .auth-search-control {
        width: 100%;
      }

      .auth-form-grid {
        grid-template-columns: 1fr;
      }

      .auth-field.full {
        grid-column: auto;
      }

      .auth-pagination {
        justify-content: center;
      }
    }
  </style>
</head>

<body>

<nav class="admin-nav">

    <div class="admin-brand"></div>

<main class="admin-main">

                  <th>Status</th>
                  <th>Date Created</th>

                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="authTableBody"></tbody>

            </table>

            <div
              id="authEmpty"
              class="auth-empty"
              hidden

          </div>


<div class="auth-pagination">

  <span id="authPageInfo">
    0-0 of 0 items
  </span>


  <div class="auth-pagination-nav">

    <button
      id="authPrevPage"
      class="auth-page-btn"
      type="button"
      aria-label="Previous page"
    >
      ‹
    </button>


    <div
      id="authPageNumbers"
      class="auth-page-numbers"
    ></div>


    <button
      id="authNextPage"
      class="auth-page-btn"
      type="button"
      aria-label="Next page"
    >
      ›
    </button>

  </div>


  <div class="auth-page-size">

    <div
      id="authPageSizeControl"
      class="auth-page-size-control"
    >

      <input
        id="authPageSizeInput"
        class="auth-page-size-input"
        type="text"
        value="10 / page"
        autocomplete="off"
        inputmode="numeric"

        class="auth-page-size-arrow-btn"

</div>

  </div>


  <!-- CREATE USER -->

  <div
    id="createAuthModal"
    class="auth-modal-backdrop"
  >

    <div class="auth-modal">

      <div class="auth-modal-head">

        <h3>Create Username</h3>

        <button
          id="closeCreateAuthModal"
          class="auth-modal-close"
          type="button"
        >
          ×
        </button>

      </div>

      <div class="auth-modal-body">

        <div class="auth-form-grid">

          <div class="auth-field">
            <label>Username</label>

            <input
              id="createUsername"
              class="auth-input"
              type="text"
              autocomplete="off"
              placeholder="Enter username"
            >

            <div class="auth-help">
              Login automatically uses
              @5g88.local.
            </div>
          </div>


          <div class="auth-field">
            <label>Password</label>

            <input
              id="createPassword"
              class="auth-input"
              type="password"
              autocomplete="new-password"
              placeholder="Enter password"
            >
          </div>


          <div class="auth-field">
            <label>2nd Password</label>

            <input
              id="createSecondPassword"
              class="auth-input"
              type="password"
              inputmode="numeric"
              maxlength="6"
              autocomplete="off"
              placeholder="6 digits"
            >
          </div>


          <div class="auth-field">

            <label>Status</label>

            <label class="auth-status-switch">

              <input
                id="createEnabled"
                type="checkbox"
                checked

            </label>

          </div>

        </div>

            id="cancelCreateAuth"
            class="auth-btn"
            type="button"

            Cancel
          </button>

          <button
            id="submitCreateAuth"

            Create Username
          </button>

        </div>

      </div>

    </div>

  <!-- MANAGE USER -->

            Cancel

          <button

            class="auth-btn auth-btn-primary"
            type="button"
          >
            Save Changes
          </button>

        </div>

      </div>

    </div>

  </div>

    function formatDate(value) {

      if (!value) {
        return "-";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "-";
      }

      return date.toLocaleString(
        "en-MY",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }


    function openModal(modal) {

      modal?.classList.add(
        "open"
      );

    }


    function closeModal(modal) {

      modal?.classList.remove(
        "open"
      );

    }


    function filteredUsers() {

      const keyword =
        authSearch.value
          .trim()
          .toLowerCase();

      if (!keyword) {
        return allAuthUsers;
      }

      return allAuthUsers.filter(
        user => {

          return (
            String(
              user.username || ""
            )
              .toLowerCase()
              .includes(keyword) ||

            String(
              user.uid || ""
            )
              .toLowerCase()
              .includes(keyword)
          );

        }
      );
    }


    function renderUsers() {

      const users =
        filteredUsers();

      const total =
        users.length;

      const totalPages =
        Math.max(
          1,
          Math.ceil(
            total / pageSize
          )
        );

      if (
        currentPage >
        totalPages
      ) {
        currentPage =
          totalPages;
      }

      const start =
        (currentPage - 1) *
        pageSize;

      const end =
        Math.min(
          start + pageSize,
          total
        );

      const pageUsers =
        users.slice(
          start,
          end
        );


      authTableBody.innerHTML = "";

      authEmpty.hidden = true;


      if (!pageUsers.length) {

        authEmpty.hidden = false;

        if (
          window.showEmptyState
        ) {

          window.showEmptyState(
            authEmpty,
            "No data",
            "",
            "center"
          );

        }
        else {

          authEmpty.textContent =
            "No data";

        }

      }


      pageUsers.forEach(
        user => {

          const tr =
            document.createElement(
              "tr"
            );

          tr.innerHTML = `

            <td>
              <strong>
                ${safe(
                  user.username ||
                  "-"
                )}
              </strong>
            </td>

            <td>
              <div class="auth-uid">

                <code>
                  ${safe(
                    user.uid ||
                    "-"
                  )}
                </code>

                <button
                  class="auth-copy-btn"
                  type="button"
                  data-action="copy"
                  data-uid="${safe(
                    user.uid
                  )}"
                >
                  Copy
                </button>

              </div>
            </td>

            <td>

              <span
                class="
                  auth-status
                  ${
                    user.enabled
                      ? "active"
                      : "inactive"
                  }
                "
              >
                ${
                  user.enabled
                    ? "Active"
                    : "Inactive"
                }
              </span>

            </td>

            <td>
              ${safe(
                formatDate(
                  user.createdAt
                )
              )}
            </td>

            <td>
              ${safe(
                formatDate(
                  user.updatedAt
                )
              )}
            </td>

            <td>

              <div class="auth-actions">

                <button
                  class="auth-btn"
                  type="button"
                  data-action="manage"
                  data-uid="${safe(
                    user.uid
                  )}"
                >
                  Manage
                </button>

              </div>

            </td>
          `;

          authTableBody
            .appendChild(tr);

        }
      );


      authPageInfo.textContent =
        total
          ? `${start + 1}-${end} of ${total} items`
          : "0-0 of 0 items";


authPageNumbers.innerHTML = "";

for (let page = 1; page <= totalPages; page++) {

function closeAuthPageSizeMenu() {

  authPageSizeMenu
    ?.classList
    .add("hidden");

  authPageSizeToggle
    ?.setAttribute(
      "aria-expanded",
      "false"
    );

}


function openAuthPageSizeMenu() {

  authPageSizeMenu
    ?.classList
    .remove("hidden");

  authPageSizeToggle
    ?.setAttribute(
      "aria-expanded",
      "true"
    );

}


function toggleAuthPageSizeMenu() {

  if (
    authPageSizeMenu
      ?.classList
      .contains("hidden")
  ) {

    openAuthPageSizeMenu();

  }
  else {

    closeAuthPageSizeMenu();

  }

}


function setupPageSize() {

  if (
    !authPageSizeInput ||
    !authPageSizeToggle ||
    !authPageSizeMenu
  ) {
    return;
  }


  authPageSizeInput.value =
    `${pageSize} / page`;


  authPageSizeToggle
    .addEventListener(
      "click",
      event => {

        event.stopPropagation();

        toggleAuthPageSizeMenu();

      }
    );


  authPageSizeInput
    .addEventListener(
      "click",
      event => {

        event.stopPropagation();

        toggleAuthPageSizeMenu();

      }
    );


  authPageSizeMenu
    .querySelectorAll(
      "[data-page-size]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const value =
              Number(
                button.dataset.pageSize
              );


            if (
              !Number.isFinite(value) ||
              value <= 0
            ) {
              return;
            }


            pageSize = value;

            currentPage = 1;


            authPageSizeInput.value =
              `${pageSize} / page`;


            closeAuthPageSizeMenu();

            renderUsers();

          }
        );

      }
    );


  document.addEventListener(
    "click",
    event => {

      if (
        !event.target.closest(
          ".auth-page-size"
        )
      ) {

        closeAuthPageSizeMenu();

      }

    }
  );

}

/* =========================
   AUTH USERS BACKEND API
========================= */

const AUTH_API_BASE =
  "https://fiveg88-admin-backend.onrender.com";


async function callAuthBackend(
  path,
  options = {}
) {

  const user =
    auth.currentUser;

  if (!user) {
    throw new Error(
      "NO_AUTH_USER"
    );
  }


  /*
    Ambil Firebase ID Token
    daripada superadmin yang
    sedang login.
  */

  const idToken =
    await user.getIdToken();


  const response =
    await fetch(
      `${AUTH_API_BASE}${path}`,
      {
        ...options,

        headers: {
          "Content-Type":
            "application/json",

          Authorization:
            `Bearer ${idToken}`,

          ...(options.headers || {})
        }
      }
    );


  let result = null;

  try {
    result =
      await response.json();
  } catch {
    result = null;
  }


  if (!response.ok) {

    throw new Error(
      result?.message ||
      `HTTP_${response.status}`
    );

  }


  return result;
}

allAuthUsers =

   renderUsers();

    );


   allAuthUsers = [];

    renderUsers();


    window.showToast?.(
      error?.message ||
      "Failed to load usernames.",
      "error",
      5000
    );

  }

}

/*
  CREATE AUTH USER
*/

document
  .getElementById(
    "submitCreateAuth"
  )
  .addEventListener(
    "click",
    async () => {

      const submitBtn =
        document.getElementById(
          "submitCreateAuth"
        );

      const username =
        document
          .getElementById(
            "createUsername"
          )
          .value
          .trim()
          .toLowerCase();

      const password =
        document
          .getElementById(
            "createPassword"
          )
          .value;

      const secondPassword =
        document
          .getElementById(
            "createSecondPassword"
          )
          .value
          .trim();

      const enabled =
        document
          .getElementById(
            "createEnabled"
          )
          .checked;


      if (!username) {

        window.showToast?.(
          "Please enter username.",
          "warning",
          3000
        );

        return;
      }


      if (
        !/^[a-z0-9._-]{3,40}$/
          .test(username)
      ) {

        window.showToast?.(
          "Username must be 3-40 characters and only use letters, numbers, dot, underscore or dash.",
          "warning",
          5000
        );

        return;
      }


      if (
        password.length < 6
      ) {

        window.showToast?.(
          "Password must be at least 6 characters.",
          "warning",
          4000
        );

        return;
      }


      if (
        !/^\d{6}$/
          .test(secondPassword)
      ) {

        window.showToast?.(
          "2nd Password must be exactly 6 digits.",
          "warning",
          4000
        );

        return;
      }


      const oldText =
        submitBtn.textContent;

      submitBtn.disabled = true;
      submitBtn.textContent =
        "Creating...";


      try {

        const result =
          await callAuthBackend(
            "/api/admin-users",
            {
              method: "POST",

              body: JSON.stringify({
                username,
                password,
                secondPassword,
                enabled
              })
            }
          );


        closeModal(
          createAuthModal
        );


        window.showToast?.(
          `Username ${result?.username || username} created successfully.`,
          "success",
          4000
        );


        currentPage = 1;

        await loadAuthUsers();

      }
      catch (error) {

        console.error(
          "Create auth user failed:",
          error
        );


        window.showToast?.(
          error?.message ||
          "Failed to create username.",
          "error",
          5000
        );

      }
      finally {

        submitBtn.disabled = false;
        submitBtn.textContent =
          oldText;

      }

    }
  );


/*
  MANAGE AUTH USER
*/

document
  .getElementById(
    "saveManageAuth"
  )
  .addEventListener(
    "click",
    async () => {

      if (!selectedAuthUser?.uid) {

        window.showToast?.(
          "No username selected.",
          "warning",
          3000
        );

        return;
      }


      const saveBtn =
        document.getElementById(
          "saveManageAuth"
        );


      const password =
        document
          .getElementById(
            "managePassword"
          )
          .value;


      const secondPassword =
        document
          .getElementById(
            "manageSecondPassword"
          )
          .value
          .trim();


      const enabled =
        document
          .getElementById(
            "manageEnabled"
          )
          .checked;


      /*
        Validate Firebase password
        hanya jika diisi.
      */

      if (
        password &&
        password.length < 6
      ) {

        window.showToast?.(
          "New Password must be at least 6 characters.",
          "warning",
          4000
        );

        return;
      }


      /*
        Validate 2nd Password
        hanya jika diisi.
      */

      if (
        secondPassword &&
        !/^\d{6}$/.test(
          secondPassword
        )
      ) {

        window.showToast?.(
          "New 2nd Password must be exactly 6 digits.",
          "warning",
          4000
        );

        return;
      }


      const payload = {
        enabled
      };


      if (password) {
        payload.password =
          password;
      }


      if (secondPassword) {
        payload.secondPassword =
          secondPassword;
      }


      const oldText =
        saveBtn.textContent;


      saveBtn.disabled = true;

      saveBtn.textContent =
        "Saving...";


      try {

        await callAuthBackend(
          `/api/admin-users/${
            encodeURIComponent(
              selectedAuthUser.uid
            )
          }`,
          {
            method: "PATCH",

            body: JSON.stringify(
              payload
            )
          }
        );


        closeModal(
          manageAuthModal
        );


        window.showToast?.(
          `Username ${
            selectedAuthUser.username ||
            ""
          } updated successfully.`,
          "success",
          4000
        );


        selectedAuthUser = null;


        await loadAuthUsers();

      }
      catch (error) {

        console.error(
          "Update auth user failed:",
          error
        );


        window.showToast?.(
          error?.message ||
          "Failed to update username.",
          "error",
          5000
        );

      }
      finally {

        saveBtn.disabled =
          false;

        saveBtn.textContent =
          oldText;

      }

    }
  );
