    .login-loading{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.25);
  z-index:999999;
}

.loading-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  pointer-events:none;
}

.loading-dots{
  width:32px;
  height:32px;
  position:relative;
  margin:0 auto;
  animation:loadingRotate 1s linear infinite;
}

.loading-dots span{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  opacity:.25;
  animation:dotPulse 1s linear infinite;
}

.loading-dots span:nth-child(1){
  top:0;
  left:50%;
  transform:translateX(-50%);
  animation-delay:0s;
}

.loading-dots span:nth-child(2){
  right:0;
  top:50%;
  transform:translateY(-50%);
  animation-delay:.25s;
}

.loading-dots span:nth-child(3){
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  animation-delay:.5s;
}

.loading-dots span:nth-child(4){
  left:0;
  top:50%;
  transform:translateY(-50%);
  animation-delay:.75s;
}

@keyframes dotPulse{
  0%{ opacity:.2; }
  25%{ opacity:1; }
  50%{ opacity:.4; }
  100%{ opacity:.2; }
}

@keyframes loadingRotate{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}

.loading-text{
  color:#fff;
  font-size:14px;
  font-weight:400;
  text-align:center;
}

function hasSkinPermission(
  action
) {

  const profile =
    window.getCurrentAdminProfile?.();

  if (!profile) {
    return false;
  }

  if (
    profile.role ===
    "superadmin"
  ) {
    return true;
  }

  return (
    profile
      ?.permissions
      ?.skin
      ?.[action] === true
  );

}

/* =====================================================
   CLOUDINARY
===================================================== */

const CLOUDINARY_CLOUD_NAME =
  "dqctvbenv";


const CLOUDINARY_UPLOAD_PRESET =
  "support_center";



async function uploadSkinImage(
  file,
  folder
) {

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    CLOUDINARY_UPLOAD_PRESET
  );


  formData.append(
    "folder",
    `support-center/skin/${folder}`
  );


  const response =
    await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      {
        method: "POST",
        body: formData
      }
    );


  const result =
    await response.json();


  if (
    !response.ok ||
    !result.secure_url
  ) {

    throw new Error(
      result?.error?.message ||
      "Image upload failed."
    );

  }


  return result.secure_url;

}

function syncSkinPermissionUI() {

  const canEdit =
    hasSkinPermission(
      "edit"
    );


  [
    skinEnabled,
    headerColor,
    headerTextColor,
    bodyColor,
    bodyTextColor,
    footerColor,
    footerTextColor
  ].forEach(
    element => {

      if (element) {
        element.disabled =
          !canEdit;
      }

    }
  );


  [
    "uploadHeaderImageBtn",
    "removeHeaderImageBtn",
    "uploadBodyImageBtn",
    "removeBodyImageBtn",
    "uploadFooterImageBtn",
    "removeFooterImageBtn"
  ].forEach(
    id => {

      const button =
        document.getElementById(
          id
        );

      if (!button) {
        return;
      }

      button.disabled =
        !canEdit;

      button.style.display =
        canEdit
          ? ""
          : "none";

    }
  );


  if (resetSkinBtn) {

    resetSkinBtn.disabled =
      !canEdit;

    resetSkinBtn.style.display =
      canEdit
        ? ""
        : "none";

  }


  if (saveSkinBtn) {

    saveSkinBtn.disabled =
      !canEdit;

    saveSkinBtn.style.display =
      canEdit
        ? ""
        : "none";

  }

}

function backgroundImage(

) {

previewHeader.style.color =

/* =====================================================
   UPLOAD PICKER
===================================================== */

function setupUpload(
  buttonId,
  input,
  previewId,
  previewImageId,
  fileNameId,
  removeId,
  hiddenUrl,
  getObjectUrl,
  setObjectUrl
) {

  const button =
    document.getElementById(
      buttonId
    );

  const preview =
    document.getElementById(
      previewId
    );

  const previewImage =
    document.getElementById(
      previewImageId
    );

  const fileName =
    document.getElementById(
      fileNameId
    );

  const removeButton =
    document.getElementById(
      removeId
    );


button.addEventListener(
  "click",
  () => {

    if (
      !hasSkinPermission(
        "edit"
      )
    ) {
      return;
    }

    input.click();

  }
);


  input.addEventListener(
    "change",
    () => {

      const file =
        input.files[0];


      if (!file) {
        return;
      }

if (
  !file.type.startsWith(
    "image/"
  )
) {

  window.showToast(
    "Please select a valid image.",
    "warning"
  );

  input.value = "";

  return;
}
      const oldUrl =
        getObjectUrl();


      if (oldUrl) {

        URL.revokeObjectURL(
          oldUrl
        );

      }


      const objectUrl =
        URL.createObjectURL(
          file
        );


      setObjectUrl(
        objectUrl
      );


      previewImage.src =
        objectUrl;


      fileName.textContent =
        file.name;


      preview.classList.remove(
        "hidden"
      );


      updatePreview();

    }
  );


  removeButton.addEventListener(
    "click",
    () => {
if (
  !hasSkinPermission(
    "edit"
  )
) {
  return;
}
      input.value =
        "";


      hiddenUrl.value =
        "";


      const oldUrl =
        getObjectUrl();


      if (oldUrl) {

        URL.revokeObjectURL(
          oldUrl
        );

      }


      setObjectUrl(
        ""
      );


      previewImage.src =
        "";


      preview.classList.add(
        "hidden"
      );


      updatePreview();

    }
  );

}

function loadSkinSettingsForSite(
  siteId
) {
if (
  !hasSkinPermission(
    "view"
  )
) {

  if (
    typeof stopSkinSettingsListener ===
    "function"
  ) {

    stopSkinSettingsListener();

    stopSkinSettingsListener =
      null;

  }

  currentSkinSiteId = "";

  hideSkinPageLoading();

  return;

}
  if (stopSkinSettingsListener) {

    stopSkinSettingsListener();

    stopSkinSettingsListener =
      null;

  }


  currentSkinSiteId =
    String(siteId || "");


  if (!currentSkinSiteId) {

    hideSkinPageLoading();

    return;

  }


  stopSkinSettingsListener =
    onValue(

      ref(
        db,
        getSkinSettingsPath(
          currentSkinSiteId
        )
      ),

      snapshot => {

        const data =
          snapshot.val() || {};


        skinEnabled.checked =
          data.enabled !== false;


        headerColor.value =
          data.header?.color ||
          "#352c0e";

        headerTextColor.value =
          data.header?.textColor ||
          "#f8dd76";


        bodyColor.value =
          data.body?.color ||
          "#0a0a0a";

        bodyTextColor.value =
          data.body?.textColor ||
          "#ffffff";


        footerColor.value =
          data.footer?.color ||
          "#0a0a0a";

        footerTextColor.value =
          data.footer?.textColor ||
          "#ffffff";


        headerImageUrl.value =
          data.header?.imageUrl ||
          "";

        bodyImageUrl.value =
          data.body?.imageUrl ||
          "";

        footerImageUrl.value =
          data.footer?.imageUrl ||
          "";


        showSavedImage(
          "headerUploadPreview",
          "headerUploadPreviewImg",
          "headerUploadFileName",
          headerImageUrl.value,
          "Current header image"
        );


        showSavedImage(
          "bodyUploadPreview",
          "bodyUploadPreviewImg",
          "bodyUploadFileName",
          bodyImageUrl.value,
          "Current body image"
        );


        showSavedImage(
          "footerUploadPreview",
          "footerUploadPreviewImg",
          "footerUploadFileName",
          footerImageUrl.value,
          "Current footer image"
        );


        updateActiveText();

        updatePreview();

        hideSkinPageLoading();

      },

      error => {

        console.error(
          "Skin settings load error:",
          error
        );


        window.showToast(
          "Failed to load skin settings.",
          "error",
          5000
        );


        hideSkinPageLoading();

      }

    );

}
 
skinSiteInput.addEventListener(

  const image =
    document.getElementById(
      imageId
    );


  const name =
    document.getElementById(
      nameId
    );


  if (url) {

    image.src =
      url;


    name.textContent =
      label;


    preview.classList.remove(
      "hidden"
    );

  } else {

    image.src =
      "";


    preview.classList.add(
      "hidden"
    );

  }

}

  async function refreshSkinSites() {

  try {

    const sites =
      await getAdminSites();


    skinSites =
      Array.isArray(sites)
        ? sites
        : [];


    const selectedHeaderSites =
      typeof window.getAdminSelectedSites ===
        "function"
        ? window.getAdminSelectedSites()
        : [];


    let allowedSites =
      [...skinSites];


    if (
      selectedHeaderSites.length
    ) {

      allowedSites =
        skinSites.filter(
          site => {

            const siteId =
              String(
                site.value ||
                site.id
              );

            return selectedHeaderSites.includes(
              siteId
            );

          }
        );

    }


    const previousValue =
      String(
        skinSiteInput.value ||
        currentSkinSiteId ||
        ""
      );


    skinSiteInput.innerHTML =
      allowedSites
        .map(
          site => {

            const siteId =
              String(
                site.value ||
                site.id
              );

            const siteName =
              site.label ||
              site.name ||
              siteId;

            return `
              <option value="${siteId}">
                ${siteName}
              </option>
            `;

          }
        )
        .join("");


    let nextSiteId = "";


    if (
      previousValue &&
      allowedSites.some(
        site =>
          String(
            site.value ||
            site.id
          ) === previousValue
      )
    ) {

      nextSiteId =
        previousValue;

    } else {

      nextSiteId =
        String(
          allowedSites[0]?.value ||
          allowedSites[0]?.id ||
          ""
        );

    }


skinSiteInput.value =
  nextSiteId;


if (
  skinSiteInput._sharedDropdown
) {

  skinSiteInput
    ._sharedDropdown
    .refresh();

}


loadSkinSettingsForSite(
  nextSiteId
);

  }
  catch (error) {

    console.error(
      "Skin sites load error:",
      error
    );

    window.showToast(
      "Failed to load sites.",
      "error",
      5000
    );

    hideSkinPageLoading();

  }

}
