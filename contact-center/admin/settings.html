<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Settings</title>

<link
  rel="stylesheet"
  href="./admin.css"
>

</head>

<body>


<nav class="admin-nav">

<div class="admin-nav-inner">

<div class="admin-brand">

<h1>
Support Admin
</h1>

<p id="adminEmail">
Loading...
</p>

</div>


<div class="nav-links">

<a href="./contacts.html">
Contacts
</a>

<a href="./notices.html">
Notices
</a>

<a
  class="active"
  href="./settings.html"
>
Settings
</a>

<a
  href="../index.html"
  target="_blank"
>
Customer
</a>

<a
  href="javascript:void(0)"
  id="logoutBtn"
>
Logout
</a>

</div>

</div>

</nav>



<main class="admin-container">

<div class="page-title">

<div>

<h2>
Website Settings
</h2>

<p>
Control customer page information.
</p>

</div>

</div>


<section
  class="card"
  style="max-width:650px;"
>

<form id="settingsForm">


<div class="form-group">

<label>
Website Name
</label>

<input
  id="siteName"
  placeholder="Official Support Center"
>

</div>


<div class="form-group">

<label>
Subtitle
</label>

<input
  id="subtitle"
  placeholder="Official contacts and announcements"
>

</div>


<div class="form-group">

<label>
Logo URL
</label>

<input
  id="logoUrl"
  placeholder="https://..."
>

<div class="help-text">
Leave empty to use assets/logo.svg
</div>

</div>


<div class="form-group">

<label>
Footer Text
</label>

<textarea
  id="footerText"
  placeholder="Please use our official contacts only."
></textarea>

</div>


<button
  type="submit"
  class="btn btn-green full"
>
SAVE SETTINGS
</button>

</form>

</section>

</main>


<script type="module">

import {

  db,
  requireAdmin,
  setupLogout,

  ref,
  set,
  onValue

} from "./admin.js";


requireAdmin();

setupLogout();


const form =
  document
    .getElementById(
      "settingsForm"
    );


onValue(
  ref(
    db,
    "settings"
  ),
  snapshot => {

    const item =
      snapshot.val() || {};


    document
      .getElementById(
        "siteName"
      )
      .value =
      item.siteName || "";


    document
      .getElementById(
        "subtitle"
      )
      .value =
      item.subtitle || "";


    document
      .getElementById(
        "logoUrl"
      )
      .value =
      item.logoUrl || "";


    document
      .getElementById(
        "footerText"
      )
      .value =
      item.footerText || "";

  }
);


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const data = {

      siteName:
        document
          .getElementById(
            "siteName"
          )
          .value
          .trim(),

      subtitle:
        document
          .getElementById(
            "subtitle"
          )
          .value
          .trim(),

      logoUrl:
        document
          .getElementById(
            "logoUrl"
          )
          .value
          .trim(),

      footerText:
        document
          .getElementById(
            "footerText"
          )
          .value
          .trim(),

      updatedAt:
        Date.now()

    };


    try {

      await set(
        ref(
          db,
          "settings"
        ),
        data
      );


      alert(
        "Settings saved."
      );


    } catch (error) {

      alert(
        "Failed: " +
        error.message
      );

    }

  }
);

</script>

</body>
</html>
