  >

      class="welcome-preview-modal"
    >

      <button
        id="welcomePreviewClose"
        class="welcome-preview-close"
        type="button"
      >
        ×
      </button>

        id="welcomePreviewEmpty"
        class="welcome-preview-empty"

        Upload an image to preview

        id="welcomePreviewImage"
        class="welcome-preview-image hidden"
        src=""
        alt=""

<script src="./shared-ui.js"></script>
<script type="module">

import {

  db,
  ref,
  set,
  onValue,
  requireAdmin,
  setupLogout

} from "./admin.js";


requireAdmin();
setupLogout();
initSharedDropdowns();


/* =========================================================
   CLOUDINARY
========================================================= */

const CLOUDINARY_CLOUD_NAME =
  "dqctvbenv";

const CLOUDINARY_UPLOAD_PRESET =
  "support_center";


async function uploadWelcomeImage(
  file
) {

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    CLOUDINARY_UPLOAD_PRESET
  );


  formData.append(
    "folder",
    "support-center/welcome"
  );


  const response =
    await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      {
        method:
          "POST",

        body:
          formData
      }
    );


  const result =
    await response.json();


  if (
    !response.ok ||
    !result.secure_url
  ) {

    throw new Error(
      result?.error?.message ||
      "Upload failed."
    );

  }


  return result.secure_url;

}



/* =========================================================
   ELEMENTS
========================================================= */

const $ =
  id =>
    document.getElementById(id);


const enabled =
  $("welcomeEnabled");
  
const activeText =
  $("welcomeActiveText");


const imageFileName =
  $("welcomeImageFileName");
  
const imageUrl =
  $("welcomeImageUrl");

const imageFile =
  $("welcomeImageFile");

const uploadBtn =
  $("welcomeUploadBtn");

const uploadStatus =
  $("welcomeUploadStatus");

const imagePreview =
  $("welcomeImagePreview");

const imagePreviewImg =
  $("welcomeImagePreviewImg");

const removeImage =
  $("welcomeRemoveImage");


const desktopWidth =
  $("welcomeDesktopWidth");

const mobileWidth =
  $("welcomeMobileWidth");

const borderColor =
  $("welcomeBorderColor");

const borderWidth =
  $("welcomeBorderWidth");

const backgroundColor =
  $("welcomeBackgroundColor");

const backdropColor =
  $("welcomeBackdropColor");

const backdropOpacity =
  $("welcomeBackdropOpacity");
  const backdropOpacityValue =
  $("welcomeBackdropOpacityValue");

const okText =
  $("welcomeOkText");

const okColor =
  $("welcomeOkColor");

const okTextColor =
  $("welcomeOkTextColor");

const closeColor =
  $("welcomeCloseColor");

const closeIconColor =
  $("welcomeCloseIconColor");

const animation =
  $("welcomeAnimation");

const delay =
  $("welcomeDelay");

const showMode =
  $("welcomeShowMode");

const closeX =
  $("welcomeCloseX");

const closeOk =
  $("welcomeCloseOk");

const closeEsc =
  $("welcomeCloseEsc");

const closeOutside =
  $("welcomeCloseOutside");

const saveBtn =
  $("saveWelcomeBtn");

const saveMessage =
  $("welcomeSaveMessage");


const preview =
  $("welcomeAdminPreview");

const previewModal =
  $("welcomePreviewModal");

const previewClose =
  $("welcomePreviewClose");

const previewImage =
  $("welcomePreviewImage");

const previewEmpty =
  $("welcomePreviewEmpty");

const previewOk =
  $("welcomePreviewOk");



/* =========================================================
   PREVIEW
========================================================= */

function updatePreview() {
    backdropOpacityValue.textContent =
    backdropOpacity.value;

  if (activeText) {

  activeText.textContent =
    enabled.checked
      ? "Active"
      : "Inactive";

}

  preview.style.background =
    hexToRgba(
      backdropColor.value,
      Number(
        backdropOpacity.value || 78
      ) / 100
    );


  previewModal.style.width =
    `${Number(desktopWidth.value) || 520}px`;


  previewModal.style.border =
    `${Number(borderWidth.value) || 0}px solid ${borderColor.value}`;


  previewModal.style.background =
    backgroundColor.value;


  previewOk.textContent =
    okText.value.trim() ||
    "OK";


  previewOk.style.background =
    okColor.value;


  previewOk.style.color =
    okTextColor.value;


  previewClose.style.background =
    closeColor.value;


  previewClose.style.color =
    closeIconColor.value;


  previewClose.style.display =
    closeX.checked
      ? "flex"
      : "none";


  previewOk.style.display =
    closeOk.checked
      ? "block"
      : "none";


  if (imageUrl.value) {

    previewImage.src =
      imageUrl.value;

    previewImage.classList.remove(
      "hidden"
    );

    previewEmpty.classList.add(
      "hidden"
    );

  } else {

    previewImage.classList.add(
      "hidden"
    );

    previewEmpty.classList.remove(
      "hidden"
    );

  }

}



function hexToRgba(
  hex,
  opacity
) {

  let value =
    String(hex || "#000000")
      .replace("#", "");


  if (value.length === 3) {

    value =
      value
        .split("")
        .map(
          char =>
            char + char
        )
        .join("");

  }


  const number =
    parseInt(
      value,
      16
    );


  const r =
    (number >> 16) & 255;

  const g =
    (number >> 8) & 255;

  const b =
    number & 255;


  return `rgba(${r},${g},${b},${opacity})`;

}



/* =========================================================
   UPLOAD
========================================================= */

uploadBtn.addEventListener(
  "click",
  () => {

    imageFile.click();

  }
);


imageFile.addEventListener(
  "change",
  async () => {

    const file =
      imageFile.files?.[0];


    if (!file) {
      return;
    }
   if (imageFileName) {

  imageFileName.textContent =
    file.name;

}

    try {

      uploadBtn.disabled =
        true;

      uploadBtn.textContent =
        "UPLOADING...";

      uploadStatus.textContent =
        "Uploading image...";


      const url =
        await uploadWelcomeImage(
          file
        );


      imageUrl.value =
        url;


      imagePreviewImg.src =
        url;


      imagePreview.classList.remove(
        "hidden"
      );


uploadStatus.textContent =
  "Ready";


      updatePreview();


    } catch (error) {

      console.error(
        error
      );


      uploadStatus.textContent =
        error.message ||
        "Upload failed.";


    } finally {

      uploadBtn.disabled =
        false;

      uploadBtn.textContent =
        "Upload Image";

      imageFile.value =
        "";

    }

  }
);


removeImage.addEventListener(
  "click",
  () => {

    imageUrl.value =
      "";

    imagePreviewImg.src =
      "";
  if (imageFileName) {

  imageFileName.textContent =
    "Welcome image";

}


uploadStatus.textContent =
  "Ready";

    imagePreview.classList.add(
      "hidden"
    );


    updatePreview();

  }
);



/* =========================================================
   LIVE PREVIEW EVENTS
========================================================= */

[
  enabled,
  desktopWidth,
  mobileWidth,
  borderColor,
  borderWidth,
  backgroundColor,
  backdropColor,
  backdropOpacity,
  okText,
  okColor,
  okTextColor,
  closeColor,
  closeIconColor,
  animation,
  delay,
  showMode,
  closeX,
  closeOk,
  closeEsc,
  closeOutside

].forEach(
  element => {

    element.addEventListener(
      "input",
      updatePreview
    );

    element.addEventListener(
      "change",
      updatePreview
    );

  }
);



/* =========================================================
   FIREBASE LOAD
========================================================= */

onValue(

  ref(
    db,
    "welcome_popup"
  ),

  snapshot => {

    const data =
      snapshot.val() || {};


    enabled.checked =
      data.enabled !== false;


    imageUrl.value =
      data.imageUrl || "";


    desktopWidth.value =
      Number(
        data.desktopWidth
      ) || 520;


    mobileWidth.value =
      Number(
        data.mobileWidth
      ) || 340;


    borderColor.value =
      data.borderColor ||
      "#d6a917";


    borderWidth.value =
      Number(
        data.borderWidth
      ) ?? 2;


    backgroundColor.value =
      data.backgroundColor ||
      "#111111";


    backdropColor.value =
      data.backdropColor ||
      "#000000";


    backdropOpacity.value =
      Number(
        data.backdropOpacity
      ) || 78;


    okText.value =
      data.okText ||
      "OK";


    okColor.value =
      data.okColor ||
      "#d6a917";


    okTextColor.value =
      data.okTextColor ||
      "#ffffff";


    closeColor.value =
      data.closeColor ||
      "#0a0a0a";


    closeIconColor.value =
      data.closeIconColor ||
      "#ffd51b";


    animation.value =
      data.animation ||
      "zoom";


    delay.value =
      Number(
        data.delay
      ) || 300;


    showMode.value =
      data.showMode ||
      "refresh";

/*
  Sync Shared Dropdown UI
*/

[
  animation,
  showMode

].forEach(
  select => {

    select.dispatchEvent(
      new Event(
        "change",
        {
          bubbles:true
        }
      )
    );

  }
);
    closeX.checked =
      data.closeX !== false;


    closeOk.checked =
      data.closeOk !== false;


    closeEsc.checked =
      data.closeEsc !== false;


    closeOutside.checked =
      data.closeOutside !== false;


if (imageUrl.value) {

  imagePreviewImg.src =
    imageUrl.value;


  if (imageFileName) {

    try {

      const url =
        new URL(
          imageUrl.value
        );


      imageFileName.textContent =
        decodeURIComponent(
          url.pathname
            .split("/")
            .pop() ||
          "Welcome image"
        );


    } catch {

      imageFileName.textContent =
        "Welcome image";

    }

  }


  uploadStatus.textContent =
    "Ready";


  imagePreview.classList.remove(
    "hidden"
  );


} else {

  if (imageFileName) {

    imageFileName.textContent =
      "Welcome image";

  }


  imagePreview.classList.add(
    "hidden"
  );

}


    updatePreview();

  }

);



/* =========================================================
   SAVE
========================================================= */

saveBtn.addEventListener(
  "click",
  async () => {

    saveMessage.className =
      "welcome-save-message";


    /*
      Safety:
      jangan sampai semua cara close OFF.
    */

    if (
      !closeX.checked &&
      !closeOk.checked &&
      !closeEsc.checked &&
      !closeOutside.checked
    ) {

      closeX.checked =
        true;

    }


    const data = {

      enabled:
        enabled.checked,

      imageUrl:
        imageUrl.value.trim(),

      desktopWidth:
        Number(
          desktopWidth.value
        ) || 520,

      mobileWidth:
        Number(
          mobileWidth.value
        ) || 340,

      borderColor:
        borderColor.value,

      borderWidth:
        Math.max(
          0,
          Number(
            borderWidth.value
          ) || 0
        ),

      backgroundColor:
        backgroundColor.value,

      backdropColor:
        backdropColor.value,

      backdropOpacity:
        Math.max(
          0,
          Math.min(
            100,
            Number(
              backdropOpacity.value
            ) || 0
          )
        ),

      okText:
        okText.value.trim() ||
        "OK",

      okColor:
        okColor.value,

      okTextColor:
        okTextColor.value,

      closeColor:
        closeColor.value,

      closeIconColor:
        closeIconColor.value,

      animation:
        animation.value,

      delay:
        Math.max(
          0,
          Number(
            delay.value
          ) || 0
        ),

      showMode:
        showMode.value,

      closeX:
        closeX.checked,

      closeOk:
        closeOk.checked,

      closeEsc:
        closeEsc.checked,

      closeOutside:
        closeOutside.checked,

      updatedAt:
        Date.now()

    };


    try {

      saveBtn.disabled =
        true;

      saveBtn.textContent =
        "SAVING...";


      await set(
        ref(
          db,
          "welcome_popup"
        ),
        data
      );


      saveMessage.textContent =
        "Welcome settings saved.";

      saveMessage.className =
        "welcome-save-message success";


    } catch (error) {

      console.error(
        error
      );


      saveMessage.textContent =
        "Failed to save settings.";

      saveMessage.className =
        "welcome-save-message error";


    } finally {

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        "SAVE WELCOME";

    }

  }
);


updatePreview();

</script>

</body>
