<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Manage Contacts</title>

<link
  rel="stylesheet"
  href="./admin.css"
>
<link
  rel="stylesheet"
  href="../contact-shared.css"
>
</head>

<body>


<nav class="admin-nav">

  <div class="admin-nav-inner">

    <div class="admin-brand">

      <h1>
        Support Admin
      </h1>

      <p id="adminEmail">
        Loading...
      </p>

    </div>


    <div class="nav-links">

      <a
        class="active"
        href="./contacts.html"
      >
        Contacts
      </a>

      <a href="./notices.html">
        Notices
      </a>

      <a href="./marquee.html">
        Marquee
      </a>
      
  <a href="./floating.html">
    Floating Image
  </a>
<a href="./loading.html">
  Loading
</a>
      <a
        href="../index.html"
        target="_blank"
      >
        Customer
      </a>

      <a
        href="javascript:void(0)"
        id="logoutBtn"
      >
        Logout
      </a>

    </div>

  </div>

</nav>



<main class="admin-container">

  <div class="page-title">

    <div>

      <h2>
        Contacts
      </h2>

      <p>
        Add, edit and manage contact status.
      </p>

    </div>

  </div>


  <div class="admin-grid">


    <!-- FORM -->

    <section class="card">

      <h3 id="formTitle">
        Add Contact
      </h3>


 <form id="contactForm">

  <input
    type="hidden"
    id="editId"
  >


  <!-- ROW 1 -->
  <div class="contact-form-row">

    <div class="form-group">
      <label>Contact Name</label>

      <input
        id="name"
        required
        placeholder="PRIMARY WHATSAPP"
      >
    </div>


    <div class="form-group">
      <label>Type</label>

      <select id="type">

        <option value="whatsapp">
          WhatsApp
        </option>

        <option value="telegram">
          Telegram
        </option>

        <option value="website">
          Website
        </option>

        <option value="facebook">
          Facebook
        </option>

        <option value="instagram">
          Instagram
        </option>

        <option value="other">
          Other
        </option>

      </select>
    </div>

  </div>


  <!-- ROW 2 -->
  <div class="contact-form-row">

    <div class="form-group">

      <label>
        Number / Username / URL
      </label>

      <input
        id="value"
        required
        placeholder="+601162042105"
      >

    </div>


    <div class="form-group">

      <label>
        Custom Link
      </label>

      <input
        id="link"
        placeholder="Optional"
      >

      <div class="help-text">
        WhatsApp dan Telegram tak perlu isi custom link.
      </div>

    </div>

  </div>


  <!-- ROW 3 -->
  <div class="contact-form-row">

    <div class="form-group">

      <label>
        Sort Order
      </label>

      <input
        id="sortOrder"
        type="number"
        min="1"
        value="1"
      >

    </div>


    <div class="form-group">

      <label>
        Status
      </label>

      <select id="status">

        <option value="active">
          🟢 ACTIVE
        </option>

        <option value="problem">
          🟡 PROBLEM
        </option>

        <option value="closed">
          🔴 CLOSED
        </option>

      </select>

    </div>

  </div>


  <!-- DESCRIPTION -->
  <div class="form-group">

    <label>
      Description
    </label>

    <textarea
      id="description"
      placeholder="Main official support..."
    ></textarea>

  </div>


  <!-- CLOUDINARY URL -->
  <input
    type="hidden"
    id="imageUrl"
  >


  <!-- IMAGE UPLOAD -->
  <div class="contact-upload-section">

    <label>
      Contact Image
    </label>


    <input
      type="file"
      id="contactImageFile"
      accept="image/png,image/jpeg,image/webp,image/gif"
      hidden
    >


    <button
      type="button"
      id="uploadContactImageBtn"
      class="contact-upload-btn"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      Upload Image

    </button>


    <div
      id="contactImagePreview"
      class="contact-upload-preview hidden"
    >

      <img
        id="contactImagePreviewImg"
        src=""
        alt="Contact image preview"
      >


      <div class="contact-upload-file-info">

        <strong id="contactImageFileName">
          image.png
        </strong>

        <span>
          Ready
        </span>

      </div>


      <button
        type="button"
        id="removeContactImageBtn"
        class="contact-upload-remove"
        aria-label="Remove image"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M6 7h12M10 11v6M14 11v6M9 7l1-3h4l1 3M8 7l1 13h6l1-13"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </button>

    </div>

  </div>


  <!-- ACTIONS -->
  <div class="contact-form-actions">

    <button
      type="button"
      id="cancelBtn"
      class="btn btn-dark hidden"
    >
      CANCEL EDIT
    </button>


    <button
      type="submit"
      class="btn btn-green"
    >
      SAVE CONTACT
    </button>

  </div>

</form>

    </section>



    <!-- LIST -->

    <section class="card">

      <h3>
        Contact List
      </h3>


<div
  id="contactList"
  class="contact-list"
>

        <div class="empty">
          Loading...
        </div>

      </div>

    </section>

  </div>

</main>



<script type="module">

import {

  db,
  requireAdmin,
  setupLogout,
  safe,

  ref,
  push,
  set,
  update,
  remove,
  onValue

} from "./admin.js";


requireAdmin();

setupLogout();


const form =
  document.getElementById(
    "contactForm"
  );

const editId =
  document.getElementById(
    "editId"
  );

const list =
  document.getElementById(
    "contactList"
  );

const cancel =
  document.getElementById(
    "cancelBtn"
  );
const contactImageFile =
  document.getElementById(
    "contactImageFile"
  );

const uploadContactImageBtn =
  document.getElementById(
    "uploadContactImageBtn"
  );

const contactImagePreview =
  document.getElementById(
    "contactImagePreview"
  );

const contactImagePreviewImg =
  document.getElementById(
    "contactImagePreviewImg"
  );

const contactImageFileName =
  document.getElementById(
    "contactImageFileName"
  );

const removeContactImageBtn =
  document.getElementById(
    "removeContactImageBtn"
  );


let contactPreviewObjectUrl =
  "";

let cache = {};

/* =========================================================
   CLOUDINARY
========================================================= */

const CLOUDINARY_CLOUD_NAME =
  "dqctvbenv";

const CLOUDINARY_UPLOAD_PRESET =
  "support_center";

  async function uploadContactImage(
  file
) {

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    CLOUDINARY_UPLOAD_PRESET
  );


  formData.append(
    "folder",
    "support-center/contacts"
  );


  const response =
    await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      {
        method:
          "POST",

        body:
          formData
      }
    );


  const result =
    await response.json();


  if (
    !response.ok ||
    !result.secure_url
  ) {

    console.error(
      "Cloudinary:",
      result
    );


    throw new Error(
      result?.error?.message ||
      "Image upload failed."
    );

  }


  return result.secure_url;
}
/* =========================================================
   IMAGE PICKER
========================================================= */

uploadContactImageBtn
  .addEventListener(
    "click",
    () => {

      contactImageFile.click();

    }
  );


contactImageFile
  .addEventListener(
    "change",
    () => {

      const file =
        contactImageFile.files[0];


      if (!file) {
        return;
      }


      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        alert(
          "Please select an image."
        );

        contactImageFile.value =
          "";

        return;
      }


      if (
        contactPreviewObjectUrl
      ) {

        URL.revokeObjectURL(
          contactPreviewObjectUrl
        );

      }


      contactPreviewObjectUrl =
        URL.createObjectURL(
          file
        );


      contactImagePreviewImg.src =
        contactPreviewObjectUrl;


      contactImageFileName.textContent =
        file.name;


      contactImagePreview
        .classList
        .remove("hidden");

    }
  );


removeContactImageBtn
  .addEventListener(
    "click",
    () => {

      contactImageFile.value =
        "";


      document
        .getElementById(
          "imageUrl"
        )
        .value =
        "";


      contactImagePreviewImg.src =
        "";


      contactImageFileName.textContent =
        "";


      contactImagePreview
        .classList
        .add("hidden");


      if (
        contactPreviewObjectUrl
      ) {

        URL.revokeObjectURL(
          contactPreviewObjectUrl
        );


        contactPreviewObjectUrl =
          "";

      }

    }
  );
/* =========================================================
   SAVE
========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const submitBtn =
      form.querySelector(
        'button[type="submit"]'
      );


    const oldText =
      submitBtn.textContent;


    submitBtn.disabled =
      true;


    try {

      let imageUrl =
        document
          .getElementById(
            "imageUrl"
          )
          .value
          .trim();


      const selectedFile =
        contactImageFile.files[0];


      if (selectedFile) {

        submitBtn.textContent =
          "UPLOADING IMAGE...";


        imageUrl =
          await uploadContactImage(
            selectedFile
          );


        document
          .getElementById(
            "imageUrl"
          )
          .value =
          imageUrl;

      }


      submitBtn.textContent =
        "SAVING...";


      const data = {

        name:
          document
            .getElementById(
              "name"
            )
            .value
            .trim(),

        type:
          document
            .getElementById(
              "type"
            )
            .value,

        value:
          document
            .getElementById(
              "value"
            )
            .value
            .trim(),

        link:
          document
            .getElementById(
              "link"
            )
            .value
            .trim(),

        status:
          document
            .getElementById(
              "status"
            )
            .value,

        description:
          document
            .getElementById(
              "description"
            )
            .value
            .trim(),

        imageUrl:
          imageUrl,

        sortOrder:
          Number(
            document
              .getElementById(
                "sortOrder"
              )
              .value ||
            999
          ),

        updatedAt:
          Date.now()

      };


      if (
        editId.value
      ) {

        await update(

          ref(
            db,
            "contacts/" +
            editId.value
          ),

          data

        );

      } else {

        const newRef =
          push(
            ref(
              db,
              "contacts"
            )
          );


        await set(
          newRef,
          {
            ...data,

            createdAt:
              Date.now()
          }
        );

      }


      resetForm();


    } catch (error) {

      console.error(
        error
      );


      alert(
        "Failed: " +
        error.message
      );


    } finally {

      submitBtn.disabled =
        false;


      submitBtn.textContent =
        oldText;

    }

  }
);


/* RESET */

function resetForm() {

  form.reset();

  editId.value = "";

  document
    .getElementById(
      "sortOrder"
    )
    .value =
    "1";

  document
    .getElementById(
      "status"
    )
    .value =
    "active";

  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "Add Contact";

  cancel
    .classList
    .add("hidden");

  contactImageFile.value =
  "";


document
  .getElementById(
    "imageUrl"
  )
  .value =
  "";


contactImagePreviewImg.src =
  "";


contactImageFileName.textContent =
  "";


contactImagePreview
  .classList
  .add("hidden");


if (
  contactPreviewObjectUrl
) {

  URL.revokeObjectURL(
    contactPreviewObjectUrl
  );


  contactPreviewObjectUrl =
    "";

}
}

cancel.addEventListener(
  "click",
  resetForm
);


/* EDIT */

window.editContact =
function(id) {

  const item =
    cache[id];

  if (!item)
    return;


  editId.value =
    id;

  document
    .getElementById("name")
    .value =
    item.name || "";

  document
    .getElementById("type")
    .value =
    item.type || "whatsapp";

  document
    .getElementById("value")
    .value =
    item.value || "";

  document
    .getElementById("link")
    .value =
    item.link || "";

  document
    .getElementById("status")
    .value =
    item.status || "active";

  document
    .getElementById("description")
    .value =
    item.description || "";

  document
    .getElementById("imageUrl")
    .value =
    item.imageUrl || "";
  contactImageFile.value =
  "";


if (
  item.imageUrl
) {

  contactImagePreviewImg.src =
    item.imageUrl;


  contactImageFileName.textContent =
    "Current image";


  contactImagePreview
    .classList
    .remove("hidden");

} else {

  contactImagePreviewImg.src =
    "";


  contactImageFileName.textContent =
    "";


  contactImagePreview
    .classList
    .add("hidden");

}

  document
    .getElementById("sortOrder")
    .value =
    item.sortOrder || 1;


  document
    .getElementById("formTitle")
    .textContent =
    "Edit Contact";


  cancel
    .classList
    .remove("hidden");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* DELETE */

window.deleteContact =
async function(id) {

  if (
    !confirm(
      "Delete this contact?"
    )
  ) {
    return;
  }


  await remove(
    ref(
      db,
      "contacts/" + id
    )
  );

};


/* LIST */

onValue(
  ref(
    db,
    "contacts"
  ),
  snapshot => {

    cache =
      snapshot.val() || {};


    const items =
      Object.entries(cache)
        .map(
          ([id,value]) => ({
            id,
            ...value
          })
        )
        .sort(
          (a,b) =>
            Number(
              a.sortOrder || 999
            ) -
            Number(
              b.sortOrder || 999
            )
        );


    list.innerHTML = "";


    if (!items.length) {

      list.innerHTML = `
        <div class="empty">
          No contacts yet.
        </div>
      `;

      return;
    }


items.forEach(item => {

  const status =
    String(
      item.status || "closed"
    )
      .toLowerCase()
      .trim();


  let statusClass =
    "status-closed";


  if (
    status === "active"
  ) {

    statusClass =
      "status-active";

  }


  if (
    status === "problem"
  ) {

    statusClass =
      "status-problem";

  }


  let buttonText =
    "OPEN CONTACT";


  if (
    item.type === "whatsapp"
  ) {

    buttonText =
      "Contact Us";

  }


  if (
    item.type === "telegram"
  ) {

    buttonText =
      "OPEN TELEGRAM";

  }


  if (
    status === "closed"
  ) {

    buttonText =
      "UNAVAILABLE";

  }


  let iconHtml =
    "↗";


  if (
    item.type === "whatsapp"
  ) {

    iconHtml =
      "💬";

  }


  if (
    item.type === "telegram"
  ) {

    iconHtml =
      "✈️";

  }


  if (
    item.type === "facebook"
  ) {

    iconHtml =
      "f";

  }


  if (
    item.type === "instagram"
  ) {

    iconHtml =
      "◎";

  }


  if (
    item.type === "website"
  ) {

    iconHtml =
      "🌐";

  }


  if (
    item.imageUrl
  ) {

    iconHtml =
      `
        <img
          src="${safe(item.imageUrl)}"
          alt="${safe(
            item.name || "Contact"
          )}"
        >
      `;

  }


  list.insertAdjacentHTML(
    "beforeend",
    `

    <article class="contact-card">


      <div class="contact-icon">

        ${iconHtml}

      </div>


      <div class="contact-content">

        <h3>
          ${safe(
            item.name ||
            "Contact"
          )}
        </h3>


        <div class="contact-value-row">

          <div class="contact-value">

            ${safe(
              item.value ||
              ""
            )}

          </div>


          <button
            type="button"
            class="copy-contact-btn"
            data-copy-value="${safe(
              item.value || ""
            )}"
            aria-label="Copy contact"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M9 18q-.825 0-1.412-.587T7 16V4q0-.825.588-1.412T9 2h9q.825 0 1.413.588T20 4v12q0 .825-.587 1.413T18 18zm0-2h9V4H9zm-4 6q-.825 0-1.412-.587T3 20V7q0-.425.288-.712T4 6t.713.288T5 7v13h10q.425 0 .713.288T16 21t-.288.713T15 22zm4-6V4z"
                fill="currentColor"
              />
            </svg>

          </button>

        </div>


        ${
          item.description

            ? `
                <div class="contact-description">

                  ${safe(
                    item.description
                  )}

                </div>
              `

            : ""
        }

      </div>


      <span
        class="
          status-badge
          ${statusClass}
        "
      >

        ● ${safe(
          status.toUpperCase()
        )}

      </span>


      <div
        class="
          contact-open
          ${status === "closed"
            ? "closed"
            : ""}
        "
      >

        ${buttonText}

      </div>


      <div class="admin-contact-actions">

        <button
          type="button"
          class="admin-contact-edit"
          onclick="editContact('${item.id}')"
        >
          EDIT
        </button>


        <button
          type="button"
          class="admin-contact-delete"
          onclick="deleteContact('${item.id}')"
        >
          DELETE
        </button>

      </div>


    </article>

    `
  );

});
  }
);
</script>

</body>
</html>
