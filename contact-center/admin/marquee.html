<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <meta name="viewport"content="width=device-width, initial-scale=1.0">
  <title>Back Office SC 🏢</title>
  <link rel="stylesheet"href="./admin.css">
  <link rel="stylesheet"href="./shared-ui.css">
</head>
    <style>
    .login-loading{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.25);
  z-index:999999;
}

.loading-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  pointer-events:none;
}

.loading-dots{
  width:32px;
  height:32px;
  position:relative;
  margin:0 auto;
  animation:loadingRotate 1s linear infinite;
}

.loading-dots span{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  opacity:.25;
  animation:dotPulse 1s linear infinite;
}

.loading-dots span:nth-child(1){
  top:0;
  left:50%;
  transform:translateX(-50%);
  animation-delay:0s;
}

.loading-dots span:nth-child(2){
  right:0;
  top:50%;
  transform:translateY(-50%);
  animation-delay:.25s;
}

.loading-dots span:nth-child(3){
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  animation-delay:.5s;
}

.loading-dots span:nth-child(4){
  left:0;
  top:50%;
  transform:translateY(-50%);
  animation-delay:.75s;
}

@keyframes dotPulse{
  0%{ opacity:.2; }
  25%{ opacity:1; }
  50%{ opacity:.4; }
  100%{ opacity:.2; }
}

@keyframes loadingRotate{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}

.loading-text{
  color:#fff;
  font-size:14px;
  font-weight:400;
  text-align:center;
}
  </style>
<body>
  <div
  id="marqueePageLoading"
  class="login-loading"
>
  <div class="loading-box">

    <div class="loading-dots">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="loading-text">
      Please wait while fetching...
    </div>

  </div>
</div>
  
<nav class="admin-nav">
  <div class="admin-nav-inner">
  </div>
</nav>


<main class="admin-container">
  <div class="page-title">
    <div>
    </div>
  </div>
  <div class="marquee-admin-layout">


    <!-- SETTINGS -->

<!-- SETTINGS -->

<section class="card">

  <h3>
    Marquee Settings
  </h3>

<div class="form-group">

  <label>
    Site
  </label>

  <select
    id="marqueeSite"
    data-shared-dropdown
    data-placeholder="Select Site"
  >
  </select>

</div>
  <!-- POSITION + DIRECTION -->
  <div class="marquee-form-row">

    <div class="form-group">

      <label>
        Position
      </label>

<select
  id="marqueePosition"
  data-shared-dropdown
  data-placeholder="Select position"
>

  <option value="top">
    Above Container
  </option>

  <option value="bottom">
    Below Container
  </option>

</select>

    </div>


    <div class="form-group">

      <label>
        Direction
      </label>

<select
  id="marqueeDirection"
  data-shared-dropdown
  data-placeholder="Select direction"
>

  <option value="right-to-left">
    Right → Left
  </option>

  <option value="left-to-right">
    Left → Right
  </option>

</select>
    </div>

  </div>


  <!-- RUNNING TEXT -->
  <div class="form-group">

    <label>
      Running Text
    </label>

    <textarea
      id="marqueeText"
      class="shared-textarea"
      placeholder="Enter running announcement..."
    ></textarea>

  </div>


  <!-- SPEED + SIZE + PAUSE -->
  <div class="marquee-form-row marquee-form-row-three">

    <div class="form-group">

      <label>
        Running Speed
      </label>

      <input
        id="marqueeSpeed"
        class="shared-input"
        type="number"
        min="3"
        max="60"
        step="1"
        value="15"
      >

      <div class="help-text">
        Smaller number = faster.
      </div>

    </div>


    <div class="form-group">

      <label>
        Text Size
      </label>

      <input
        id="marqueeFontSize"
        class="shared-input"
        type="number"
        min="8"
        max="40"
        value="13"
      >

    </div>


    <div class="form-group">

      <label>
        Pause When Hover
      </label>

<select
  id="marqueePauseHover"
  data-shared-dropdown
  data-placeholder="Select option"
>

  <option value="true">
    Yes
  </option>

  <option value="false">
    No
  </option>

</select>

    </div>

  </div>


  <!-- COLORS -->
  <div class="marquee-form-row marquee-form-row-three">

    <div class="form-group">

      <label>
        Text Color
      </label>

      <input
        id="marqueeTextColor"
        class="shared-input"
        type="color"
        value="#f8dd76"
      >

    </div>


    <div class="form-group">

      <label>
        Line Color
      </label>

      <input
        id="marqueeLineColor"
        class="shared-input"
        type="color"
        value="#f8dd76"
      >

    </div>


    <div class="form-group">

      <label>
        Background Color
      </label>

      <input
        id="marqueeBackgroundColor"
        class="shared-input"
        type="color"
        value="#181818"
      >

    </div>

  </div>


  <!-- ACTIVE + SAVE -->
  <div class="marquee-form-actions">


    <label class="marquee-active-switch">

      <input
        id="marqueeEnabled"
        type="checkbox"
        checked
      >

      <span class="marquee-active-slider">

        <span
          id="marqueeActiveText"
          class="marquee-active-text"
        >
          Active
        </span>

      </span>

    </label>


    <button
      id="saveMarqueeBtn"
      class="btn btn-primary marquee-save-btn"
      type="button"
    >
      SAVE MARQUEE
    </button>

  </div>

</section>

    <!-- PREVIEW -->

    <section class="card">

      <h3>
        Live Preview
      </h3>


      <div class="marquee-preview-page">

        <div
          id="marqueePreview"
          class="
            marquee-admin-preview
            marquee-admin-rtl
          "
        >

          <div
            id="marqueePreviewTrack"
            class="marquee-admin-preview-track"
          >

            <span
              id="marqueePreviewTextOne"
            >
              Welcome to our Official Support Center
            </span>

            <span
              id="marqueePreviewTextTwo"
            >
              Welcome to our Official Support Center
            </span>

          </div>

        </div>


        <div class="marquee-preview-content">
          CUSTOMER PAGE PREVIEW
        </div>

      </div>

    </section>

  </div>

</main>

<script src="./shared-ui.js"></script>
<script type="module">

import {
  db,
  ref,
  set,
  onValue,
  requireAdmin,
  setupLogout,
  getAdminSites,
  getAdminSitePath
} from "./admin.js";


requireAdmin();

setupLogout();

initSharedDropdowns();
function hasMarqueePermission(
  action
) {

  const profile =
    window.getCurrentAdminProfile?.();

  if (!profile) {
    return false;
  }

  if (
    profile.role ===
    "superadmin"
  ) {
    return true;
  }

  return (
    profile
      ?.permissions
      ?.marquee
      ?.[action] === true
  );

}
/* =====================================================
   MARQUEE PAGE LOADING
===================================================== */

const marqueePageLoading =
  document.getElementById(
    "marqueePageLoading"
  );

function hideMarqueePageLoading() {

  if (!marqueePageLoading) {
    return;
  }

  marqueePageLoading.style.display =
    "none";
}

const enabledInput =
  document.getElementById(
    "marqueeEnabled"
  );
const marqueeActiveText =
  document.getElementById(
    "marqueeActiveText"
  );
const textInput =
  document.getElementById(
    "marqueeText"
  );

const positionInput =
  document.getElementById(
    "marqueePosition"
  );

const directionInput =
  document.getElementById(
    "marqueeDirection"
  );

const speedInput =
  document.getElementById(
    "marqueeSpeed"
  );

const fontSizeInput =
  document.getElementById(
    "marqueeFontSize"
  );

const textColorInput =
  document.getElementById(
    "marqueeTextColor"
  );

const lineColorInput =
  document.getElementById(
    "marqueeLineColor"
  );

const backgroundInput =
  document.getElementById(
    "marqueeBackgroundColor"
  );

const pauseHoverInput =
  document.getElementById(
    "marqueePauseHover"
  );

const saveBtn =
  document.getElementById(
    "saveMarqueeBtn"
  );

const preview =
  document.getElementById(
    "marqueePreview"
  );

const previewTrack =
  document.getElementById(
    "marqueePreviewTrack"
  );

const previewTextOne =
  document.getElementById(
    "marqueePreviewTextOne"
  );

const previewTextTwo =
  document.getElementById(
    "marqueePreviewTextTwo"
  );
const marqueeSiteInput =
  document.getElementById(
    "marqueeSite"
  );
function syncMarqueePermissionUI() {

  const canEdit =
    hasMarqueePermission(
      "edit"
    );

  [
    enabledInput,
    textInput,
    positionInput,
    directionInput,
    speedInput,
    fontSizeInput,
    textColorInput,
    lineColorInput,
    backgroundInput,
    pauseHoverInput
  ].forEach(
    element => {

      if (element) {
        element.disabled =
          !canEdit;
      }

    }
  );

  if (saveBtn) {

    saveBtn.disabled =
      !canEdit;

    saveBtn.style.display =
      canEdit
        ? ""
        : "none";

  }

}

let marqueeSites = [];

let currentMarqueeSiteId = "";

let stopMarqueeListener = null;


function getMarqueePath(siteId) {

  if (!siteId) {
    throw new Error(
      "SITE_REQUIRED"
    );
  }


  return getAdminSitePath(
    siteId,
    "marquee"
  );

}
function updateMarqueeActiveText() {

  marqueeActiveText.textContent =
    enabledInput.checked
      ? "Active"
      : "Inactive";

}


enabledInput.addEventListener(
  "change",
  () => {

    updateMarqueeActiveText();

    updatePreview();

  }
);
function boolValue(value) {

  return (
    value === true ||
    value === "true"
  );

}


function clampNumber(
  value,
  min,
  max,
  fallback
) {

  let number =
    Number(value);

  if (
    !Number.isFinite(number)
  ) {

    number =
      fallback;

  }

  return Math.max(
    min,
    Math.min(
      max,
      number
    )
  );

}


function getMarqueeData() {

  return {

enabled:
  enabledInput.checked,

    text:
      textInput
        .value
        .trim(),

    position:
      positionInput.value,

    direction:
      directionInput.value,

    speed:
      clampNumber(
        speedInput.value,
        3,
        60,
        15
      ),

    font_size:
      clampNumber(
        fontSizeInput.value,
        8,
        40,
        13
      ),

    text_color:
      textColorInput.value,

    line_color:
      lineColorInput.value,

    background_color:
      backgroundInput.value,

    pause_hover:
      boolValue(
        pauseHoverInput.value
      ),

    updatedAt:
      Date.now()

  };

}

function applyMarqueeData(data) {

  if (!data) {

    enabledInput.checked =
      true;

    textInput.value =
      "";

    positionInput.value =
      "top";

    directionInput.value =
      "right-to-left";

    speedInput.value =
      15;

    fontSizeInput.value =
      13;

    textColorInput.value =
      "#f8dd76";

    lineColorInput.value =
      "#f8dd76";

    backgroundInput.value =
      "#181818";

    pauseHoverInput.value =
      "true";

  } else {

    enabledInput.checked =
      data.enabled !== false;


    textInput.value =
      data.text || "";


    positionInput.value =
      data.position ||
      "top";


    directionInput.value =
      data.direction ||
      "right-to-left";


    speedInput.value =
      data.speed ?? 15;


    fontSizeInput.value =
      data.font_size ?? 13;


    textColorInput.value =
      data.text_color ||
      "#f8dd76";


    lineColorInput.value =
      data.line_color ||
      "#f8dd76";


    backgroundInput.value =
      data.background_color ||
      "#181818";


    pauseHoverInput.value =
      String(
        data.pause_hover ??
        true
      );

  }


  updateMarqueeActiveText();


  positionInput.dispatchEvent(
    new Event(
      "change",
      {
        bubbles: true
      }
    )
  );


  directionInput.dispatchEvent(
    new Event(
      "change",
      {
        bubbles: true
      }
    )
  );


  pauseHoverInput.dispatchEvent(
    new Event(
      "change",
      {
        bubbles: true
      }
    )
  );


  updatePreview();

}
function updatePreview() {

  const data =
    getMarqueeData();


  const text =
    data.text ||
    "Welcome to our Official Support Center";


  previewTextOne.textContent =
    text;

  previewTextTwo.textContent =
    text;


  preview.style.setProperty(
    "--admin-marquee-speed",
    `${data.speed}s`
  );


  preview.style.setProperty(
    "--admin-marquee-font-size",
    `${data.font_size}px`
  );


  preview.style.setProperty(
    "--admin-marquee-text-color",
    data.text_color
  );


  preview.style.setProperty(
    "--admin-marquee-line-color",
    data.line_color
  );


  preview.style.setProperty(
    "--admin-marquee-background",
    data.background_color
  );


  preview.classList.remove(
    "marquee-admin-rtl",
    "marquee-admin-ltr"
  );


  preview.classList.add(
    data.direction ===
    "left-to-right"

      ? "marquee-admin-ltr"

      : "marquee-admin-rtl"
  );


  preview.style.opacity =
    data.enabled
      ? "1"
      : ".25";


  previewTrack.style.animation =
    "none";


  void previewTrack.offsetWidth;


  previewTrack.style.animation =
    "";

}


[
  textInput,
  positionInput,
  directionInput,
  speedInput,
  fontSizeInput,
  textColorInput,
  lineColorInput,
  backgroundInput,
  pauseHoverInput

].forEach(
  element => {

    element.addEventListener(
      "input",
      updatePreview
    );

    element.addEventListener(
      "change",
      updatePreview
    );

  }
);

function loadMarqueeForSite(
  siteId
) {
if (
  !hasMarqueePermission(
    "view"
  )
) {

  if (
    typeof stopMarqueeListener ===
    "function"
  ) {

    stopMarqueeListener();

    stopMarqueeListener =
      null;

  }

  currentMarqueeSiteId = "";

  hideMarqueePageLoading();

  return;

}
  if (
    typeof stopMarqueeListener ===
    "function"
  ) {

    stopMarqueeListener();

    stopMarqueeListener =
      null;

  }


  currentMarqueeSiteId =
    String(siteId || "");


  if (!currentMarqueeSiteId) {

    applyMarqueeData(null);

    hideMarqueePageLoading();

    return;

  }


  stopMarqueeListener =
    onValue(

      ref(
        db,
        getMarqueePath(
          currentMarqueeSiteId
        )
      ),

      snapshot => {

        applyMarqueeData(
          snapshot.val()
        );


        hideMarqueePageLoading();

      },

      error => {

        console.error(
          `Marquee load error (${currentMarqueeSiteId}):`,
          error
        );


        window.showToast(
          "Unable to load marquee settings.",
          "error",
          5000
        );


        hideMarqueePageLoading();

      }

    );

}
marqueeSiteInput.addEventListener(
  "change",
  () => {

    loadMarqueeForSite(
      marqueeSiteInput.value
    );

  }
);

saveBtn.addEventListener(
  "click",
  async () => {
if (
  !hasMarqueePermission(
    "edit"
  )
) {

  window.showToast(
    "You do not have permission to edit marquee settings.",
    "error",
    4000
  );

  return;

}
    const data =
      getMarqueeData();


if (
  data.enabled &&
  !data.text
) {

  window.showToast(
    "Please enter marquee text.",
    "warning"
  );

  return;

}


    saveBtn.disabled =
      true;


    saveBtn.textContent =
      "SAVING...";


    try {

const selectedSiteId =
  marqueeSiteInput.value;


if (!selectedSiteId) {

  throw new Error(
    "Please select a site."
  );

}


await set(

  ref(
    db,
    getMarqueePath(
      selectedSiteId
    )
  ),

  data

);


window.showToast(
  "Marquee saved successfully.",
  "success"
);


} catch (error) {

  console.error(
    "Marquee save error:",
    error
  );

  window.showToast(
    error?.message ||
    "Failed to save marquee.",
    "error",
    5000
  );

}


    saveBtn.disabled =
      false;


    saveBtn.textContent =
      "SAVE MARQUEE";

  }
);


updateMarqueeActiveText();

updatePreview();
async function refreshMarqueeSites() {

  marqueeSites =
    (
      await getAdminSites()
    ).filter(
      site =>
        site &&
        (
          site.value ||
          site.id
        )
    );


  const headerSelected =
    typeof window.getAdminSelectedSites ===
    "function"
      ? window.getAdminSelectedSites()
      : [];


  const allowedSites =
    headerSelected.length
      ? marqueeSites.filter(
          site =>
            headerSelected.includes(
              String(
                site.value ||
                site.id
              )
            )
        )
      : marqueeSites;


  const previousValue =
    marqueeSiteInput.value;


  marqueeSiteInput.innerHTML =
    allowedSites
      .map(
        site => {

          const siteId =
            String(
              site.value ||
              site.id
            );


          const siteName =
            site.label ||
            site.name ||
            siteId;


          return `
            <option value="${siteId}">
              ${siteName}
            </option>
          `;

        }
      )
      .join("");


  let nextSiteId = "";


  if (
    previousValue &&
    allowedSites.some(
      site =>
        String(
          site.value ||
          site.id
        ) ===
        previousValue
    )
  ) {

    nextSiteId =
      previousValue;

  } else {

    nextSiteId =
      String(
        allowedSites[0]?.value ||
        allowedSites[0]?.id ||
        ""
      );

  }


  marqueeSiteInput.value =
    nextSiteId;


  if (
    marqueeSiteInput._sharedDropdown
  ) {

    marqueeSiteInput
      ._sharedDropdown
      .refresh();

  }


  loadMarqueeForSite(
    nextSiteId
  );

}
window.addEventListener(
  "admin-profile-ready",
  async () => {

    try {

      syncMarqueePermissionUI();

      if (
        !hasMarqueePermission(
          "view"
        )
      ) {

        hideMarqueePageLoading();

        window.showToast(
          "You do not have permission to view Marquee Text.",
          "error",
          4000
        );

        return;

      }

      await refreshMarqueeSites();

    } catch (error) {

      console.error(
        "Failed to initialize Marquee:",
        error
      );

      window.showToast(
        "Failed to initialize Marquee.",
        "error",
        5000
      );

      hideMarqueePageLoading();

    }

  }
);

window.addEventListener(
  "admin-site-change",
  async () => {

    if (
      !hasMarqueePermission(
        "view"
      )
    ) {
      return;
    }

    try {

      await refreshMarqueeSites();

    } catch (error) {

      console.error(
        "Failed to refresh Marquee sites:",
        error
      );

    }

  }
);
</script>

</body>
</html>
