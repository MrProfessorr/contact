<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="./logo.svg" />
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Back Office SC 🏢</title>

<link
  rel="stylesheet"
  href="./admin.css"
>

</head>
  <style>
    input {
      padding: 4px 11px;
      height:32px;
      font-size:14px;
      outline:none;
      border-radius:6px;
      color:var(--text);
      background:var(--input);
      border:1px solid #303030;
      transition: all 0.2s;
      width:100%;
    }
    .turnstile-wrap {
  width:100%;
  margin:16px 0;
}

.turnstile-wrap .cf-turnstile {
  width:100%;
}
  </style>

<body class="login-page">


<div class="login-card">

  <div class="login-logo">
    ⚡
  </div>

  <div
    id="loginError"
    class="error-box hidden"
  ></div>


  <form id="loginForm">

    <div class="form-group">

      <label>
        Username
      </label>

<input
  type="text"
  id="email"
  required
  placeholder="Username"
  autocomplete="username"
>

    </div>


    <div class="form-group">

      <label>
        Password
      </label>

      <input
        type="password"
        id="password"
        required
        placeholder="Password"
      >

    </div>


    <div class="turnstile-wrap">

      <div
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAFC_Ns5c9Jbe9ZEx"
        data-theme="dark"
        data-size="flexible"
        data-action="admin_login"
      ></div>

    </div>


    <button
      class="btn btn-primary full"
      type="submit"
    >
      Log in
    </button>

  </form>
<form
  id="secondAuthForm"
  class="hidden"
>

  <div class="form-group">

    <label>
      2nd Password
    </label>

    <input
      type="password"
      id="secondPassword"
      required
      placeholder="Enter 2nd Password"
      inputmode="numeric"
      autocomplete="one-time-code"
    >

  </div>


  <button
    class="btn btn-primary full"
    type="submit"
  >
    Verify
  </button>

</form>
</div>

<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"
  async
  defer
></script>
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
  import {
  getDatabase,
  ref,
  get
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDl9m6icGPQ_vPh030_-vwBrYFL9sV1jZ8",

  authDomain:
    "support-pwa.firebaseapp.com",

  databaseURL:
    "https://support-pwa-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "support-pwa",

  storageBucket:
    "support-pwa.firebasestorage.app",

  messagingSenderId:
    "1036053746669",

  appId:
    "1:1036053746669:web:952df405b937cefe6d8de4"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);
  
const db =
  getDatabase(app);

const form =
  document.getElementById("loginForm");

const errorBox =
  document.getElementById("loginError");

const secondAuthForm =
  document.getElementById(
    "secondAuthForm"
  );

const secondPasswordInput =
  document.getElementById(
    "secondPassword"
  );


let pendingUser =
  null;


let verificationPassed =
  sessionStorage.getItem(
    "adminSecondVerified"
  ) === "true";
  
function getLastAdminPage() {

  const lastPage =
    localStorage.getItem(
      "adminWorkspaceActiveTab"
    );


  return (
    lastPage &&
    /^[a-z0-9_-]+\.html$/i.test(lastPage)
  )
    ? lastPage
    : "visitors.html";

}

onAuthStateChanged(
  auth,
  async user => {

    if (!user) {

      pendingUser =
        null;

      verificationPassed =
        false;

      sessionStorage.removeItem(
        "adminSecondVerified"
      );

      return;

    }


    pendingUser =
      user;


    if (verificationPassed) {

      const lastPage =
        getLastAdminPage();


      location.replace(
        `./${lastPage}`
      );


      return;

    }


    try {

      const secondAuthRef =
        ref(
          db,
          `admin_second_auth/${user.uid}`
        );


      const snapshot =
        await get(
          secondAuthRef
        );


      if (!snapshot.exists()) {

        errorBox.textContent =
          "2nd authentication is not configured.";

        errorBox
          .classList
          .remove("hidden");

        return;

      }


      const settings =
        snapshot.val();


      if (settings.enabled !== true) {

        verificationPassed =
          true;

        sessionStorage.setItem(
          "adminSecondVerified",
          "true"
        );


        const lastPage =
          getLastAdminPage();


        location.replace(
          `./${lastPage}`
        );


        return;

      }


      form
        .classList
        .add("hidden");


      secondAuthForm
        .classList
        .remove("hidden");


      secondPasswordInput
        .focus();


    } catch (error) {

      console.error(error);


      errorBox.textContent =
        "Unable to load 2nd authentication.";

      errorBox
        .classList
        .remove("hidden");

    }

  }
);


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    errorBox
      .classList
      .add("hidden");


    let email =
      document
        .getElementById("email")
        .value
        .trim();


    if (!email.includes("@")) {

      email =
        email + "@5g88.local";

    }


    const password =
      document
        .getElementById("password")
        .value;


    try {

      const turnstileToken =
        document.querySelector(
          '[name="cf-turnstile-response"]'
        )?.value;


      if (!turnstileToken) {

        errorBox.textContent =
          "Please complete the security verification.";


        errorBox
          .classList
          .remove("hidden");


        return;

      }


      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    } catch (error) {

      console.error(error);


      errorBox.textContent =
        "Email or password incorrect.";


      errorBox
        .classList
        .remove("hidden");


      window.turnstile
        ?.reset();

    }

  }
);
secondAuthForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    errorBox
      .classList
      .add("hidden");


    if (!pendingUser) {

      errorBox.textContent =
        "Login session not found.";

      errorBox
        .classList
        .remove("hidden");

      return;

    }


    const enteredCode =
      secondPasswordInput
        .value
        .trim();


    try {

      const secondAuthRef =
        ref(
          db,
          `admin_second_auth/${pendingUser.uid}`
        );


      const snapshot =
        await get(
          secondAuthRef
        );


      if (!snapshot.exists()) {

        errorBox.textContent =
          "2nd authentication is not configured.";

        errorBox
          .classList
          .remove("hidden");

        return;

      }


      const settings =
        snapshot.val();


      if (
        String(settings.code) !==
        enteredCode
      ) {

        errorBox.textContent =
          "2nd Password incorrect.";

        errorBox
          .classList
          .remove("hidden");


        secondPasswordInput
          .select();


        return;

      }


      verificationPassed =
        true;


      sessionStorage.setItem(
        "adminSecondVerified",
        "true"
      );


      const lastPage =
        getLastAdminPage();


      location.replace(
        `./${lastPage}`
      );


    } catch (error) {

      console.error(error);


      errorBox.textContent =
        "Unable to verify 2nd Password.";

      errorBox
        .classList
        .remove("hidden");

    }

  }
);
</script>

</body>
</html>
