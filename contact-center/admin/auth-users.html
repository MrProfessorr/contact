<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Authentication Users</title>

  <link rel="stylesheet" href="./shared-ui.css">
  <link rel="stylesheet" href="./admin.css">

  <style>
    * {
      box-sizing: border-box;
    }

.auth-users-page {
  width: 100%;
  height: auto !important;
  min-height: 0 !important;

  display: block !important;
  align-self: flex-start !important;
}

    .auth-users-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

.auth-search-control {
  width: 300px;
  height: 32px;
  flex: 0 0 300px;
  display: flex;
  align-items: stretch;
}


.auth-search-control input {
  width: calc(100% - 34px);
  min-width: 0;
  height: 32px;

  padding: 4px 11px;

  border: 1px solid var(--input-line);
  border-right: none;

  border-radius: 6px 0 0 6px;

  background: var(--input);
  color: var(--text);

  outline: none;
}


.auth-search-control button {
  width: 32px;
  min-width: 32px;
  height: 32px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  border: 1px solid var(--input-line);

  border-radius: 0 6px 6px 0;

  background: var(--input);

  color: var(--text2);

  cursor: pointer;

  transition:
    border-color .2s ease,
    color .2s ease,
    background .2s ease;
}


.auth-search-control:hover input,
.auth-search-control:hover button {
  border-color:
    var(--input-line-hover);
}


.auth-search-control:focus-within input,
.auth-search-control:focus-within button {
  border-color:
    var(--input-line-focus);
}


.auth-search-control button:hover {
  color:
    rgba(255,255,255,.85);
}


.auth-search-icon {
  width: 14px;
  height: 14px;

  display: block;

  transform-origin: center;
}


.auth-search-spinner {
  width: 14px;
  height: 14px;

  display: none;

  transform-origin: center;
}


.auth-search-control.is-syncing
.auth-search-icon {
  display: none;
}


.auth-search-control.is-syncing
.auth-search-spinner {
  display: block;

  animation:
    authSpin .75s linear infinite;
}


@keyframes authSpin {

  from {
    transform:
      rotate(0deg);
  }

  to {
    transform:
      rotate(360deg);
  }

}

    .auth-btn {
      min-height: 32px;
      border: 1px solid #383838;
      border-radius: 7px;
      background: #1d1d1d;
      color: #fff;
      padding: 6px 12px;
      cursor: pointer;
      font: inherit;
    }

    .auth-btn:hover {
      background: #282828;
    }

    .auth-btn-primary {
      background: #1677ff;
      border-color: #1677ff;
    }

    .auth-btn-primary:hover {
      background: #2b84ff;
    }

    .auth-btn-danger {
      color: #ff6b6b;
    }



    .auth-pagination-nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .auth-page-btn {
      min-width: 30px;
      height: 30px;
      border: 1px solid #333;
      background: #181818;
      color: #ccc;
      border-radius: 6px;
      cursor: pointer;
    }

    .auth-page-btn.active {
      background: #1677ff;
      border-color: #1677ff;
      color: #fff;
    }

    .auth-page-btn:disabled {
      opacity: .4;
      cursor: default;
    }

    /* MODAL */

    .auth-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 15px;
    }

    .auth-modal-backdrop.open {
      display: flex;
    }

    .auth-modal {
      width: min(680px, 100%);
      max-height: calc(100vh - 30px);
      overflow-y: auto;
      background: #1f1f1f;
      border: 1px solid transparent;
      border-radius: 8px;
      box-shadow: 0 6px 16px 0 rgba(0, 0, 0, 0.08), 0 3px 6px -4px rgba(0, 0, 0, 0.12), 0 9px 28px 8px rgba(0, 0, 0, 0.05);
    }

    .auth-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 17px;
      border-bottom: 1px solid #303030;
    }

    .auth-modal-head h3 {
      margin: 0;
      font-size: 16px;
    }

    .auth-modal-close {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      font-size: 22px;
    }

    .auth-modal-body {
      padding: 17px;
    }

    .auth-form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .auth-field {
      min-width: 0;
    }

    .auth-field.full {
      grid-column: 1 / -1;
    }

    .auth-field > label {
      display: block;
      margin-bottom: 7px;
      color: #aaa;
      font-size: 12px;
    }

    .auth-input {
      width: 100%;
      height: 36px;
      border: 1px solid #373737;
      border-radius: 7px;
      background: #111;
      color: #fff;
      outline: 0;
      padding: 0 10px;
    }

    .auth-input:focus {
      border-color: #1677ff;
    }

    .auth-help {
      margin-top: 5px;
      color: #777;
      font-size: 11px;
    }

    .auth-modal-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    /* STATUS SWITCH */

    .auth-status-switch {
      display: inline-block;
      position: relative;
      cursor: pointer;
    }

    .auth-status-switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .auth-status-slider {
      position: relative;
      display: flex;
      align-items: center;
      width: 86px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: #444;
      transition: .2s;
    }

    .auth-status-slider::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: .2s;
    }

    .auth-status-text {
      width: 100%;
      padding-left: 18px;
      color: #fff;
      font-size: 10px;
      text-align: center;
    }

    .auth-status-text::before {
      content: "Inactive";
    }

    .auth-status-switch
      input:checked +
      .auth-status-slider {
      background: #1677ff;
    }

    .auth-status-switch
      input:checked +
      .auth-status-slider::before {
      transform: translateX(64px);
    }

    .auth-status-switch
      input:checked +
      .auth-status-slider
      .auth-status-text {
      padding-left: 0;
      padding-right: 18px;
    }

    .auth-status-switch
      input:checked +
      .auth-status-slider
      .auth-status-text::before {
      content: "Active";
    }

    .auth-manage-info {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      background: #111;
      margin-bottom: 15px;
    }

    .auth-manage-row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 10px;
      font-size: 12px;
    }

    .auth-manage-row span:first-child {
      color: #777;
    }

    @media (max-width: 650px) {
      .auth-users-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .auth-search-control {
        width: 100%;
      }

      .auth-form-grid {
        grid-template-columns: 1fr;
      }

      .auth-field.full {
        grid-column: auto;
      }

      .auth-pagination {
        justify-content: center;
      }
    }
    /* =========================
   AUTH USERS TABLE
========================= */

.auth-table-wrap {
  width: 100%;
  max-width: 100%;
  min-width: 0;

  height: auto !important;
  min-height: 0 !important;

  flex: none !important;
  align-self: flex-start !important;

  overflow: visible;

  border: 1px solid var(--tx-border);
  border-radius: 8px;

  background: var(--tx-surface);
}
.auth-table-scroll {
  width: 100%;
  max-width: 100%;
  min-width: 0;

  overflow-x: auto;
  overflow-y: hidden;

  scrollbar-width: thin;
  scrollbar-color:
    rgba(255, 255, 255, .22)
    transparent;
}


.auth-table-wrap::-webkit-scrollbar {
  height: 6px;
}

.auth-table-wrap::-webkit-scrollbar-track {
  background: transparent;
}

.auth-table-wrap::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, .22);
  border-radius: 999px;
}

.auth-table-wrap::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, .35);
}


.auth-table {
  width: 100%;
  min-width: 1050px;

  border-collapse: collapse;
  table-layout: auto;

  background: transparent;
}


.auth-table th,
.auth-table td {
  height: 44px;

  padding: 10px 14px;

  text-align: left;
  vertical-align: middle;

  border-bottom: 1px solid var(--tx-border);

  white-space: nowrap;

  font-size: 12px;
}


.auth-table th {
  height: 42px;

  background: rgba(255, 255, 255, .025);

  color: var(--muted);

  font-size: 11px;
  font-weight: 600;

  letter-spacing: .02em;
}


.auth-table tbody tr {
  transition: background .15s ease;
}


.auth-table tbody tr:hover {
  background: rgba(255, 255, 255, .025);
}


.auth-table tbody tr:last-child td {
  border-bottom: 0;
}


/* Username */

.auth-table td:first-child strong {
  color: var(--text);
  font-weight: 600;
}


/* UID */

.auth-uid {
  display: flex;
  align-items: center;

  gap: 7px;

  min-width: 0;
}


.auth-uid code {
  display: block;

  max-width: 220px;

  overflow: hidden;

  color: var(--text2);

  text-overflow: ellipsis;
  white-space: nowrap;

  font-size: 11px;
}


.auth-copy-btn {
  flex: 0 0 auto;

  padding: 3px 6px;

  border: 0;
  border-radius: 5px;

  background: transparent;

  color: #7eb6ff;

  cursor: pointer;

  font-size: 11px;
}


.auth-copy-btn:hover {
  background: rgba(22, 119, 255, .10);
}


/* STATUS */

.auth-status {
  display: inline-flex;
  align-items: center;

  gap: 6px;

  font-size: 11px;
}


.auth-status::before {
  content: "";

  width: 6px;
  height: 6px;

  flex: 0 0 6px;

  border-radius: 50%;

  background: #777;
}


.auth-status.active {
  color: #68d391;
}


.auth-status.active::before {
  background: #68d391;
}


.auth-status.inactive {
  color: var(--muted);
}


/* ACTION */

.auth-actions {
  display: flex;
  align-items: center;

  gap: 6px;
}


/* EMPTY */

.auth-empty {
  min-height: 180px;

  display: grid;
  place-items: center;
}
.auth-empty[hidden] {
  display: none !important;
}
.auth-initial-loading {
  display: grid;
  place-items: center;
  gap: 8px;

  color: var(--muted);
  font-size: 13px;
}

.auth-initial-loading-icon {
  display: grid;
  place-items: center;
}

.auth-initial-loading-icon svg {
  display: block;
  width: 64px;
  height: 41px;
}
/* =========================
   AUTH USERS PAGINATION
========================= */

.auth-pagination {
  width: 100%;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;

  gap: 8px;

  padding: 10px;

  border-top: 1px solid var(--tx-border);
}


.auth-pagination-info {
  color: var(--text);
  font-size: 14px;
  white-space: nowrap;
  margin-right: 3px;
}


.auth-pagination-center {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
}


.auth-page-numbers {
  display: flex;
  align-items: center;

  gap: 4px;
}


/* NUMBER BUTTON */

.auth-page-number {
  min-width: 30px;
  height: 30px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 0 7px;

  border: 1px solid transparent;
  border-radius: 6px;

  background: transparent;

  color: var(--text2);

  cursor: pointer;

  font: inherit;
  font-size: 12px;

  transition:
    background .15s ease,
    border-color .15s ease,
    color .15s ease;
}


.auth-page-number:hover {
  background: rgba(255, 255, 255, .06);

  color: var(--text);
}


.auth-page-number.active {
  border-color: #1677ff;

  background: #1677ff;

  color: #fff;
}


/* PREVIOUS / NEXT */

.auth-page-nav {
  width: 30px;
  height: 30px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  border: 1px solid transparent;
  border-radius: 6px;

  background: transparent;

  color: var(--text2);

  cursor: pointer;
}


.auth-page-nav:hover:not(:disabled) {
  background: rgba(255, 255, 255, .06);

  color: var(--text);
}


.auth-page-nav:disabled {
  opacity: .3;

  cursor: default;
}


.auth-page-nav-icon {
  width: 12px;
  height: 12px;

  fill: currentColor;
}


/* ELLIPSIS */

.auth-page-dots {
  min-width: 28px;
  height: 30px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border: 0;

  background: transparent;

  color: var(--muted);

  cursor: pointer;

  font-size: 12px;
}


.auth-page-dots:hover {
  color: var(--text);
}


/* =========================
   PAGE SIZE
========================= */

.auth-page-size {
  width: 105px;
  flex: 0 0 105px;
}
.auth-page-size {
  position: relative;
}

.auth-page-size-control {
  width: 105px;
  height: 30px;

  display: flex;
  align-items: center;

  border: 1px solid var(--tx-border);
  border-radius: 6px;

  background: var(--tx-surface-soft);

  overflow: hidden;
}

.auth-page-size-control:hover,
.auth-page-size-control.open {
  border-color: #1677ff;
}

.auth-page-size-input {
  width: 72px;
  height: 28px;

  padding: 0 0 0 10px;

  border: 0;
  outline: 0;

  background: transparent;
  color: var(--text);

  font: inherit;
  font-size: 12px;
}

.auth-page-size-input[readonly] {
  cursor: pointer;
}

.auth-page-size-arrow-btn {
  width: 31px;
  height: 28px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;

  border: 0;

  background: transparent;
  color: var(--muted);

  cursor: pointer;
}

.auth-page-size-arrow-btn:hover {
  color: var(--text);
}

.auth-page-size-arrow-btn svg {
  width: 10px;
  height: 10px;

  fill: currentColor;

  transition: transform .15s ease;
}

.auth-page-size-control.open
.auth-page-size-arrow-btn svg {
  transform: rotate(180deg);
}

.auth-page-size-menu {
  position: absolute;

  right: 0;
  bottom: calc(100% + 3px);

  z-index: 100;

  width: 105px;
max-height: 128px;
overflow-y: auto;

scrollbar-width: none;
-ms-overflow-style: none;

  padding: 4px;

  border: 1px solid var(--tx-border);
  border-radius: 6px;

  background: var(--tx-surface);

  box-shadow:
    0 8px 24px rgba(0, 0, 0, .35);
}

.auth-page-size-menu[hidden] {
  display: none;
}

.auth-page-size-menu button {
  width: 100%;
  height: 30px;

  display: flex;
  align-items: center;

  padding: 0 8px;

  border: 0;
  border-radius: 4px;

  background: transparent;
  color: var(--text2);

  cursor: pointer;

  font: inherit;
  font-size: 12px;
  text-align: left;
}

.auth-page-size-menu button:hover {
  background: rgba(255,255,255,.07);
  color: var(--text);
}

.auth-page-size-menu button.active {
  background: rgba(22,119,255,.14);
  color: #1677ff;
}
@media (max-width: 760px) {

  .auth-table {
    min-width: 900px;
  }

  .auth-pagination {
    justify-content: flex-end;
  }

}
  </style>
</head>

<body>

<nav class="admin-nav">
  <div class="admin-nav-inner">
  </div>
</nav>

<main class="admin-container">

  <div class="auth-users-page">

          <div class="auth-users-toolbar">

            <div
              class="auth-search-control"
              id="authSearchControl"
            >
              <input
                id="authSearch"
                type="search"
                placeholder="Search username or UID..."
                autocomplete="off"
              >

              <button
                id="authSearchBtn"
                type="button"
                aria-label="Search"
              >
                <svg
                  class="auth-search-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="m20 20-3.5-3.5"></path>
                </svg>

                <svg
                  class="auth-search-spinner"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle
                    cx="12"
                    cy="12"
                    r="9"
                    opacity=".25"
                  ></circle>
                  <path d="M21 12a9 9 0 0 0-9-9"></path>
                </svg>
              </button>
            </div>

            <button
              id="createAuthUserBtn"
              class="auth-btn auth-btn-primary"
              type="button"
            >
              + Create Username
            </button>

          </div>

<div class="auth-table-wrap">

  <div class="auth-table-scroll">

    <table class="auth-table">

              <thead>
                <tr>
                  <th>Username</th>
                  <th>Firebase UID</th>
                  <th>Status</th>
                  <th>Date Created</th>
                  <th>Last Edited</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="authTableBody"></tbody>

            </table>

<div
  id="authEmpty"
  class="auth-empty"
>
<div class="auth-initial-loading">

  <div class="auth-initial-loading-icon">

    <svg
      viewBox="0 0 64 41"
      aria-hidden="true"
    >
      <g
        transform="translate(0 1)"
        fill="none"
        fill-rule="evenodd"
      >

        <ellipse
          fill="#272727"
          cx="32"
          cy="33"
          rx="32"
          ry="7"
        ></ellipse>

        <g
          fill-rule="nonzero"
          stroke="#3e3e3e"
        >

          <path
            d="M55 12.76L44.854 1.258C44.367.474 43.656 0 42.907 0H21.093c-.749 0-1.46.474-1.947 1.257L9 12.761V22h46v-9.24z"
          ></path>

          <path
            d="M41.613 15.931c0-1.605.994-2.93 2.227-2.931H55v18.137C55 33.26 53.68 35 52.05 35h-40.1C10.32 35 9 33.259 9 31.137V13h11.16c1.233 0 2.227 1.323 2.227 2.928v.022c0 1.605 1.005 2.901 2.237 2.901h14.752c1.232 0 2.237-1.308 2.237-2.913v-.007z"
            fill="#1d1d1d"
          ></path>

        </g>

      </g>
    </svg>

  </div>

  <div class="auth-initial-loading-text">
    Loading...
  </div>

</div>
</div>
</div>
<div class="auth-pagination">

  <div
    id="authPageInfo"
    class="auth-pagination-info"
  >
    0-0 of 0 items
  </div>


  <div class="auth-pagination-center">

    <button
      id="authPrevPage"
      class="auth-page-nav"
      type="button"
      aria-label="Previous page"
    >
      <svg
        class="auth-page-nav-icon"
        viewBox="0 0 1024 1024"
        aria-hidden="true"
      >
        <path
          d="M724 218.3V141c0-6.7-7.7-10.4-12.9-6.3L260.3 486.8a31.86 31.86 0 000 50.3l450.8 352.1c5.3 4.1 12.9.4 12.9-6.3v-77.3c0-4.9-2.3-9.6-6.1-12.6l-360-281 360-281.1c3.8-3 6.1-7.7 6.1-12.6z"
        />
      </svg>
    </button>


<div
  id="authPageNumbers"
  class="auth-page-numbers"
>
  <button
    type="button"
    class="auth-page-number active"
    disabled
  >
    1
  </button>
</div>


    <button
      id="authNextPage"
      class="auth-page-nav"
      type="button"
      aria-label="Next page"
    >
      <svg
        class="auth-page-nav-icon"
        viewBox="0 0 1024 1024"
        aria-hidden="true"
      >
        <path
          d="M765.7 486.8L314.9 134.7A7.97 7.97 0 00302 141v77.3c0 4.9 2.3 9.6 6.1 12.6l360 281.1-360 281.1c-3.9 3-6.1 7.7-6.1 12.6V883c0 6.7 7.7 10.4 12.9 6.3l450.8-352.1a31.96 31.96 0 000-50.3z"
        />
      </svg>
    </button>

  </div>
<div
  id="authPageSizeControl"
  class="auth-page-size"
>
  <div class="auth-page-size-control">

    <input
      id="authPageSizeInput"
      class="auth-page-size-input"
      type="text"
      value="10 / page"
      autocomplete="off"
      readonly
    >

    <button
      id="authPageSizeToggle"
      class="auth-page-size-arrow-btn"
      type="button"
      aria-label="Select page size"

    function formatDate(value) {

      if (!value) {
        return "-";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "-";
      }

      return date.toLocaleString(
        "en-MY",
        {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      );
    }

              .includes(keyword) ||

              .toLowerCase()
              .includes(keyword)

    }

  function getPaginationPages(current, total) {

  if (total <= 6) {
    return Array.from(
      { length: total },
      (_, index) => index + 1
    );
  }

  // Page 1 - 5
  if (current <= 4) {
    return [
      1,
      2,
      3,
      4,
      5,
      "next-dots",
      total
    ];
  }

  // Dekat page terakhir
  if (current >= total - 3) {
    return [
      1,
      "prev-dots",
      total - 4,
      total - 3,
      total - 2,
      total - 1,
      total
    ];
  }

  // Tengah
  return [
    1,
    "prev-dots",
    current - 1,
    current,
    current + 1,
    "next-dots",
    total
  ];
}

const paginationPages =

paginationPages.forEach(item => {

function closePageSizeMenu() {

function openPageSizeMenu() {

  authPageSizeInput.value = "";

  authPageSizeInput.focus();

}


function syncPageSizeMenu() {

  authPageSizeMenu
    ?.querySelectorAll(
      "[data-page-size]"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        Number(
          button.dataset.pageSize
        ) === pageSize
      );

    });
}


function applyPageSize(value) {

  let nextSize =
    Number(value);

  if (
    !Number.isFinite(nextSize) ||
    nextSize < 1
  ) {
    closePageSizeMenu();
    return;
  }

  nextSize =
    Math.min(
      10000,
      Math.floor(nextSize)
    );

  pageSize = nextSize;

  currentPage = 1;

  syncPageSizeMenu();

  renderUsers();

  closePageSizeMenu();
}


function setupPageSize() {

  if (
    !authPageSizeControl ||
    !authPageSizeInput ||
    !authPageSizeToggle ||
    !authPageSizeMenu
  ) {
    return;
  }

  authPageSizeInput.value =
    `${pageSize} / page`;

  syncPageSizeMenu();


  authPageSizeToggle.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      if (authPageSizeMenu.hidden) {
        openPageSizeMenu();
      }
      else {
        closePageSizeMenu();
      }

    }
  );


  authPageSizeInput.addEventListener(
    "click",
    event => {

      event.stopPropagation();

      if (authPageSizeMenu.hidden) {
        openPageSizeMenu();
      }

    }
  );


  authPageSizeMenu.addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          "[data-page-size]"
        );

      if (!button) {
        return;
      }

      applyPageSize(
        button.dataset.pageSize
      );

    }
  );


  authPageSizeInput.addEventListener(
    "input",
    () => {

      authPageSizeInput.value =
        authPageSizeInput.value.replace(
          /\D/g,
          ""
        );

    }
  );


  authPageSizeInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        event.preventDefault();

        applyPageSize(
          authPageSizeInput.value
        );

        return;
      }

      if (event.key === "Escape") {

        event.preventDefault();

        closePageSizeMenu();

      }

    }
  );


  document.addEventListener(
    "click",
    event => {

      if (
        authPageSizeControl.contains(
          event.target
        )
      ) {
        return;
      }

      if (!authPageSizeMenu.hidden) {

        const value =
          authPageSizeInput.value.trim();

        if (value) {
          applyPageSize(value);
        }
        else {
          closePageSizeMenu();
        }

      }

    }
  );

}

const AUTH_API_BASE =
  "https://fiveg88-admin-backend.onrender.com";


async function callAuthBackend(
  path,
  options = {}
) {

  const user =
    auth.currentUser;

  if (!user) {
    throw new Error(
      "NO_AUTH_USER"
    );
  }


  /*
    Ambil Firebase ID Token
    daripada superadmin yang
    sedang login.
  */

  const idToken =
    await user.getIdToken();


  const response =
    await fetch(
      `${AUTH_API_BASE}${path}`,
      {
        ...options,

        headers: {
          "Content-Type":
            "application/json",

          Authorization:
            `Bearer ${idToken}`,

          ...(options.headers || {})
        }
      }
    );


  let result = null;

  try {
    result =
      await response.json();
  } catch {
    result = null;
  }


  if (!response.ok) {

    throw new Error(
      result?.message ||
      `HTTP_${response.status}`
    );

  }


  return result;
}

async function loadAuthUsers() {
renderLoadingState();
  try {

    const result =
      await callAuthBackend(
        "/api/admin-users",
        {
          method: "GET"
        }
      );


allAuthUsers =
  Array.isArray(result?.users)
    ? result.users
    : [];


   renderUsers();

  } catch (error) {

    console.error(
      "Load auth users failed:",
      error
    );


   allAuthUsers = [];

    renderUsers();


    window.showToast?.(
      error?.message ||
      "Failed to load usernames.",
      "error",
      5000
    );

  }

}

          ) {

            currentPage++;

            renderUsers();

          }

        }
      );


/*
  CREATE AUTH USER
*/

document
  .getElementById(
    "submitCreateAuth"
  )
  .addEventListener(
    "click",
    async () => {

      const submitBtn =
        document.getElementById(
          "submitCreateAuth"
        );

      const username =
        document
          .getElementById(
            "createUsername"
          )
          .value
          .trim()
          .toLowerCase();

      const password =
        document
          .getElementById(
            "createPassword"
          )
          .value;

      const secondPassword =
        document
          .getElementById(
            "createSecondPassword"
          )
          .value
          .trim();

      const enabled =
        document
          .getElementById(
            "createEnabled"
          )
          .checked;


      if (!username) {

        window.showToast?.(
          "Please enter username.",
          "warning",
          3000
        );

        return;
      }


      if (
        !/^[a-z0-9._-]{3,40}$/
          .test(username)
      ) {

        window.showToast?.(
          "Username must be 3-40 characters and only use letters, numbers, dot, underscore or dash.",
          "warning",
          5000
        );

        return;
      }


      if (
        password.length < 6
      ) {

        window.showToast?.(
          "Password must be at least 6 characters.",
          "warning",
          4000
        );

        return;
      }


      if (
        !/^\d{6}$/
          .test(secondPassword)
      ) {

        window.showToast?.(
          "2nd Password must be exactly 6 digits.",
          "warning",
          4000
        );

        return;
      }


      const oldText =
        submitBtn.textContent;

      submitBtn.disabled = true;
      submitBtn.textContent =
        "Creating...";


      try {

        const result =
          await callAuthBackend(
            "/api/admin-users",
            {
              method: "POST",

              body: JSON.stringify({
                username,
                password,
                secondPassword,
                enabled
              })
            }
          );


        closeModal(
          createAuthModal
        );


        window.showToast?.(
          `Username ${result?.username || username} created successfully.`,
          "success",
          4000
        );


        currentPage = 1;

        await loadAuthUsers();

      }
      catch (error) {

        console.error(
          "Create auth user failed:",
          error
        );


        window.showToast?.(
          error?.message ||
          "Failed to create username.",
          "error",
          5000
        );

      }
      finally {

        submitBtn.disabled = false;
        submitBtn.textContent =
          oldText;

      }

    }
  );


/*
  MANAGE AUTH USER
*/

document
  .getElementById(
    "saveManageAuth"
  )
  .addEventListener(
    "click",
    async () => {

      if (!selectedAuthUser?.uid) {

        window.showToast?.(
          "No username selected.",
          "warning",
          3000
        );

        return;
      }


      const saveBtn =
        document.getElementById(
          "saveManageAuth"
        );


      const password =
        document
          .getElementById(
            "managePassword"
          )
          .value;


      const secondPassword =
        document
          .getElementById(
            "manageSecondPassword"
          )
          .value
          .trim();


      const enabled =
        document
          .getElementById(
            "manageEnabled"
          )
          .checked;


      /*
        Validate Firebase password
        hanya jika diisi.
      */

      if (
        password &&
        password.length < 6
      ) {

        window.showToast?.(
          "New Password must be at least 6 characters.",
          "warning",
          4000
        );

        return;
      }


      /*
        Validate 2nd Password
        hanya jika diisi.
      */

      if (
        secondPassword &&
        !/^\d{6}$/.test(
          secondPassword
        )
      ) {

        window.showToast?.(
          "New 2nd Password must be exactly 6 digits.",
          "warning",
          4000
        );

        return;
      }


      const payload = {
        enabled
      };


      if (password) {
        payload.password =
          password;
      }


      if (secondPassword) {
        payload.secondPassword =
          secondPassword;
      }


      const oldText =
        saveBtn.textContent;


      saveBtn.disabled = true;

      saveBtn.textContent =
        "Saving...";


      try {

        await callAuthBackend(
          `/api/admin-users/${
            encodeURIComponent(
              selectedAuthUser.uid
            )
          }`,
          {
            method: "PATCH",

            body: JSON.stringify(
              payload
            )
          }
        );


        closeModal(
          manageAuthModal
        );


        window.showToast?.(
          `Username ${
            selectedAuthUser.username ||
            ""
          } updated successfully.`,
          "success",
          4000
        );


        selectedAuthUser = null;


        await loadAuthUsers();

      }
      catch (error) {

        console.error(
          "Update auth user failed:",
          error
        );


        window.showToast?.(
          error?.message ||
          "Failed to update username.",
          "error",
          5000
        );

      }
      finally {

        saveBtn.disabled =
          false;

        saveBtn.textContent =
          oldText;

      }

    }
  );


setupPageSize();

    window.addEventListener(
      "admin-profile-ready",
      async () => {

        if (
          !isSuperAdmin()
        ) {

          window.showToast?.(
            "Superadmin access required.",
            "error",
            1500
          );

          await forceAdminLogout();

          return;
        }


        await loadAuthUsers();

      }
    );

  </script>

</body>
</html>
