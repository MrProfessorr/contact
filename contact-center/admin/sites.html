<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Site Management</title>

<link
  rel="stylesheet"
  href="./admin.css"
>

<link
  rel="stylesheet"
  href="./shared-ui.css"
>

  <style>

body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background: var(--tx-bg);
  color: var(--text);
}

.site-page {
  width: auto;
  max-width: 100%;
  min-width: 0;
  margin: 14px 12px 24px;
}
.site-header {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 15px;
}

    .site-header h1 {
      margin: 0;
      font-size: 22px;
    }

.site-actions {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.site-search-control {
  width: 300px;
  height: 32px;
  flex: 0 0 300px;
  display: flex;
  align-items: stretch;
}

.site-search-input {
  width: calc(100% - 32px);
  min-width: 0;
  height: 32px;
  box-sizing: border-box;
  padding: 4px 11px;

  border: 1px solid var(--input-line);
  border-radius: 6px 0 0 6px;

  background: var(--input);
  color: var(--text);

  outline: none;
}

.site-search-button {
  width: 32px;
  min-width: 32px;
  height: 32px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0;
  margin-left: -1px;

  border: 1px solid var(--input-line);
  border-radius: 0 6px 6px 0;

  background: var(--input);
  color: var(--muted);

  cursor: pointer;
  outline: none;

  position: relative;
  z-index: 1;
}

.site-search-input:hover {
  border-color: var(--input-line-hover);
  z-index: 2;
}

.site-search-input:focus {
  border-color: var(--input-line-focus);
  z-index: 3;
}

.site-search-button:hover {
  border-color: var(--input-line-hover);
  color: var(--input-line-hover);
}

.site-search-button:focus {
  border-color: var(--input-line-focus);
  color: var(--input-line-focus);
}

.site-search-icon {
  width: 14px;
  height: 14px;
  display: block;
  fill: currentColor;
  transform-origin: center;
}


/* =========================
   SITE SEARCH SPINNER
========================= */

.site-sync-icon {
  width: 14px;
  height: 14px;
  display: none;
  transform-origin: center;
}

.site-sync-track {
  fill: none;
  stroke: rgba(255,255,255,.18);
  stroke-width: 5;
}

.site-sync-spinner {
  fill: none;
  stroke: currentColor;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 80 120;
  transform-origin: center;
}

.site-search-control.is-syncing
.site-search-icon {
  display: none;
}

.site-search-control.is-syncing
.site-sync-icon {
  display: block;
  animation:
    siteSyncRotate
    .75s linear infinite;
}

@keyframes siteSyncRotate {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}

    .site-btn {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
    }

    .site-btn-primary {
      background: #1677ff;
      color: #fff;
    }

.site-table-wrap {
  overflow-x: auto;
  overflow-y: hidden;

  border: 1px solid #333;
  border-radius: 8px;

  /* Firefox */
  scrollbar-width: thin;
  scrollbar-color:
    rgba(255,255,255,.22)
    transparent;
}


/* Chrome / Edge / Safari */

.site-table-wrap::-webkit-scrollbar {
  height: 6px;
}


.site-table-wrap::-webkit-scrollbar-track {
  background: transparent;
}


.site-table-wrap::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.22);
  border-radius: 999px;
}


.site-table-wrap::-webkit-scrollbar-thumb:hover {
  background: rgba(255,255,255,.35);
}

    .site-table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
    }

    .site-table th,
    .site-table td {
      padding: 13px 14px;
      text-align: left;
      border-bottom: 1px solid #292929;
    }

    .site-status {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .site-status.active {
      background: rgba(82,196,26,.15);
      color: #73d13d;
    }

    .site-status.disabled {
      background: rgba(255,77,79,.15);
      color: #ff7875;
    }

    .site-row-actions {
      display: flex;
      gap: 8px;
    }

    .site-row-actions button {
      border: 1px solid #444;
      background: transparent;
      color: inherit;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }



    .site-modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.6);
      z-index: 999999;
    }

    .site-modal-backdrop.open {
      display: flex;
    }

    .site-modal {
      width: 420px;
      max-width: 100%;
      padding: 20px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #181818;
    }

    .site-modal h2 {
      margin-top: 0;
    }

    .site-field {
      margin-bottom: 15px;
    }

    .site-field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
    }

    .site-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #111;
      color: #fff;
    }

    .site-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
.site-row-actions .site-delete-btn {
  color: #ff4d4f;
  border-color: rgba(255, 77, 79, .55);
}

.site-row-actions .site-delete-btn:hover {
  color: #ff7875;
  border-color: #ff4d4f;
  background: rgba(255, 77, 79, .08);
}
  </style>

</head>

<body>

  <!-- =====================================================
       ADMIN NAV
  ===================================================== -->

  <nav class="admin-nav">
    <div class="admin-nav-inner">
    </div>
  </nav>


  <!-- =====================================================
       SITE MANAGEMENT PAGE
  ===================================================== -->

  <main class="site-page">

    <div class="site-header">

      <div class="site-actions">

<div class="site-search-control">

  <input
    id="siteSearch"
    class="site-search-input"
    type="search"
    placeholder="Search"
    autocomplete="off"
  >

  <button
    id="siteSearchBtn"
    class="site-search-button"
    type="button"
    aria-label="Search"
  >

    <svg
      class="site-search-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        d="M9.5 3a6.5 6.5 0 1 0 3.98 11.64L19.85 21 21 19.85l-6.36-6.37A6.5 6.5 0 0 0 9.5 3Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"
      />
    </svg>
<svg
  class="site-sync-icon"
  viewBox="0 0 50 50"
  aria-hidden="true"
>
  <circle
    class="site-sync-track"
    cx="25"
    cy="25"
    r="19"
  ></circle>

  <circle
    class="site-sync-spinner"
    cx="25"
    cy="25"
    r="19"
  ></circle>
</svg>
  </button>

</div>

        <button
          id="addSiteBtn"
          class="site-btn site-btn-primary"
          type="button"
        >
          + Add Site
        </button>

      </div>

    </div>


    <div class="site-table-wrap">

      <table class="site-table">

        <thead>
          <tr>
<th>Site Name</th>
<th>Site ID</th>
<th>Status</th>
<th>Order</th>
<th>Date Created</th>
<th>Last Edited</th>
<th>Action</th>
          </tr>
        </thead>

        <tbody id="siteTableBody"></tbody>

      </table>

<div
  id="siteEmpty"
  hidden
></div>

    </div>

  </main>


  <!-- ADD / EDIT SITE MODAL -->

  <div
    id="siteModal"
    class="site-modal-backdrop"
  >

    <div class="site-modal">

      <h2 id="siteModalTitle">
        Add Site
      </h2>

      <div class="site-field">

        <label for="siteName">
          Site Name
        </label>

        <input
          id="siteName"
          type="text"
          placeholder="Example: 5G88"
        >

      </div>


      <div class="site-field">

        <label for="siteId">
          Site ID
        </label>

        <input
          id="siteId"
          type="text"
          placeholder="Example: 5g88"
        >

      </div>


      <div class="site-modal-actions">

        <button
          id="cancelSiteBtn"
          class="site-btn"
          type="button"
        >
          Cancel
        </button>

        <button
          id="saveSiteBtn"
          class="site-btn site-btn-primary"
          type="button"
        >
          Create Site
        </button>

      </div>

    </div>

  </div>


  <script type="module">

import {
  requireAdmin,
  setupLogout,
  getAdminSites,
  createAdminSite,
  updateAdminSite,
  setAdminSiteEnabled,
  deleteAdminSite,
  isSuperAdmin,
  safe
} from "./admin.js";


    requireAdmin();
    setupLogout();


    const siteTableBody =
      document.getElementById(
        "siteTableBody"
      );

    const siteEmpty =
      document.getElementById(
        "siteEmpty"
      );

    const siteSearch =
      document.getElementById(
        "siteSearch"
      );
const siteSearchBtn =
  document.getElementById(
    "siteSearchBtn"
  );
  const siteSearchControl =
  siteSearch
    ?.closest(
      ".site-search-control"
    );
    const addSiteBtn =
      document.getElementById(
        "addSiteBtn"
      );

    const siteModal =
      document.getElementById(
        "siteModal"
      );

    const siteModalTitle =
      document.getElementById(
        "siteModalTitle"
      );

    const siteName =
      document.getElementById(
        "siteName"
      );

    const siteId =
      document.getElementById(
        "siteId"
      );

    const saveSiteBtn =
      document.getElementById(
        "saveSiteBtn"
      );

    const cancelSiteBtn =
      document.getElementById(
        "cancelSiteBtn"
      );


    let allSites = [];

    let editingSiteId =
      null;
  let siteSearchSyncTimer =
  null;

let siteSearchSyncStartedAt =
  0;

const SITE_SEARCH_SYNC_DURATION =
  900;


function startSiteSearchSync() {

  clearTimeout(
    siteSearchSyncTimer
  );


  siteSearchSyncStartedAt =
    Date.now();


  siteSearchControl
    ?.classList
    .remove(
      "is-syncing"
    );


  /*
    Force reflow supaya animation
    restart setiap kali ditekan.
  */

  if (
    siteSearchControl
  ) {

    void siteSearchControl.offsetWidth;

  }


  siteSearchControl
    ?.classList
    .add(
      "is-syncing"
    );

}


function stopSiteSearchSync() {

  clearTimeout(
    siteSearchSyncTimer
  );


  const elapsed =
    Date.now() -
    siteSearchSyncStartedAt;


  const remaining =
    Math.max(
      0,
      SITE_SEARCH_SYNC_DURATION -
      elapsed
    );


  siteSearchSyncTimer =
    setTimeout(
      () => {

        siteSearchControl
          ?.classList
          .remove(
            "is-syncing"
          );

      },
      remaining
    );

}
  function formatSiteDate(
  timestamp
) {

  const value =
    Number(
      timestamp || 0
    );


  if (!value) {
    return "—";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "—";
  }


  return new Intl.DateTimeFormat(
    "en-MY",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      hour12: true
    }
  ).format(date);

}
function notifySiteRegistryChanged() {

  /*
    Notify page ini sendiri.
  */

  window.dispatchEvent(
    new CustomEvent(
      "admin-sites-changed"
    )
  );


if (
  window.parent &&
  window.parent !== window
) {

  window.parent.postMessage(
    {
      type:
        "admin-sites-changed"
    },
    window.location.origin
  );

}

localStorage.setItem(
  "adminSitesRegistryChanged",
  String(Date.now())
);

}

    function openAddSiteModal() {

      editingSiteId =
        null;

      siteModalTitle.textContent =
        "Add Site";

      saveSiteBtn.textContent =
        "Create Site";

      siteName.value =
        "";

      siteId.value =
        "";

      siteId.disabled =
        false;

      siteModal.classList.add(
        "open"
      );

      siteName.focus();

    }


    function openEditSiteModal(
      site
    ) {

      editingSiteId =
        site.id;

      siteModalTitle.textContent =
        "Edit Site";

      saveSiteBtn.textContent =
        "Save Changes";

      siteName.value =
        site.name;

      siteId.value =
        site.id;

      /*
        Site ID tidak boleh ditukar
        selepas site dibuat.
      */

      siteId.disabled =
        true;

      siteModal.classList.add(
        "open"
      );

    }


    function closeSiteModal() {

      siteModal.classList.remove(
        "open"
      );

      editingSiteId =
        null;

    }


    function renderSites() {

      const keyword =
        siteSearch.value
          .trim()
          .toLowerCase();


      const filtered =
        allSites.filter(
          site => {

            return (
              site.name
                .toLowerCase()
                .includes(keyword) ||

              site.id
                .toLowerCase()
                .includes(keyword)
            );

          }
        );


      siteTableBody.innerHTML =
        "";


if (
  filtered.length === 0
) {

  siteEmpty.hidden =
    false;

  if (
    window.showEmptyState
  ) {

    window.showEmptyState(
      siteEmpty,
      "No data",
      "",
      "center"
    );

  }
  else {

    siteEmpty.textContent =
      "No data";

  }

}
else {

  siteEmpty.hidden =
    true;

  siteEmpty.innerHTML =
    "";

}


filtered.forEach(
        site => {

          const tr =
            document.createElement(
              "tr"
            );


          tr.innerHTML = `
            <td>
              ${safe(site.name)}
            </td>

            <td>
              ${safe(site.id)}
            </td>

            <td>
              <span
                class="
                  site-status
                  ${
                    site.enabled
                      ? "active"
                      : "disabled"
                  }
                "
              >
                ${
                  site.enabled
                    ? "Active"
                    : "Disabled"
                }
              </span>
            </td>

<td>
  ${safe(site.order)}
</td>

<td>
  ${safe(
    formatSiteDate(
      site.createdAt
    )
  )}
</td>

<td>
  ${safe(
    formatSiteDate(
      site.updatedAt
    )
  )}
</td>

<td>

  <div
    class="site-row-actions"
              >

                <button
                  type="button"
                  data-action="edit"
                  data-site="${safe(site.id)}"
                >
                  Edit
                </button>

                <button
                  type="button"
                  data-action="toggle"
                  data-site="${safe(site.id)}"
                >
                  ${
                    site.enabled
                      ? "Disable"
                      : "Enable"
                  }
                </button>
<button
  type="button"
  data-action="delete"
  data-site="${safe(site.id)}"
  class="site-delete-btn"
>
  Delete
</button>
              </div>

            </td>
          `;


          siteTableBody.appendChild(
            tr
          );

        }
      );

    }


    async function loadSites() {

      try {

        allSites =
          await getAdminSites(
            true
          );


        renderSites();

      }
      catch (error) {

        console.error(
          error
        );


        window.showToast?.(
          "Failed to load sites.",
          "error",
          5000
        );

      }

    }

    window.addEventListener(
      "admin-profile-ready",
      async () => {

if (
  !isSuperAdmin()
) {

  window.showToast?.(
    "Superadmin access required.",
    "error",
    3000
  );


  setTimeout(
    () => {

      window.location.replace(
        "./visitors.html"
      );

    },
    500
  );


  return;

}


        await loadSites();

      }
    );


    addSiteBtn.addEventListener(
      "click",
      () => {

        if (
          !isSuperAdmin()
        ) {
          return;
        }


        openAddSiteModal();

      }
    );


    cancelSiteBtn.addEventListener(
      "click",
      closeSiteModal
    );


    siteModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          siteModal
        ) {

          closeSiteModal();

        }

      }
    );


    siteSearch.addEventListener(
      "input",
      renderSites
    );

siteSearchBtn.addEventListener(
  "click",
  () => {

    siteSearch.focus();

    startSiteSearchSync();

    renderSites();

    stopSiteSearchSync();

  }
);
    saveSiteBtn.addEventListener(
      "click",
      async () => {

        const name =
          siteName.value.trim();

        const id =
          siteId.value.trim();


        if (!name) {

          window.showToast?.(
            "Please enter site name.",
            "warning",
            4000
          );

          siteName.focus();

          return;

        }


        if (
          !editingSiteId &&
          !id
        ) {

          window.showToast?.(
            "Please enter site ID.",
            "warning",
            4000
          );

          siteId.focus();

          return;

        }


        saveSiteBtn.disabled =
          true;


        try {

          if (
            editingSiteId
          ) {

            await updateAdminSite(
              editingSiteId,
              {
                name
              }
            );


            window.showToast?.(
              "Site updated successfully.",
              "success",
              4000
            );

          }
          else {

            await createAdminSite({
              siteId:
                id,

              name
            });


            window.showToast?.(
              "Site created successfully.",
              "success",
              4000
            );

          }


closeSiteModal();

await loadSites();

notifySiteRegistryChanged();

        }
        catch (error) {

          console.error(
            error
          );


          const messages = {

            SITE_ALREADY_EXISTS:
              "Site ID already exists.",

            SITE_ID_REQUIRED:
              "Site ID is required.",

            SITE_NAME_REQUIRED:
              "Site name is required.",

            SUPERADMIN_REQUIRED:
              "Superadmin access required."

          };


          window.showToast?.(
            messages[
              error?.message
            ] ||
            error?.message ||
            "Failed to save site.",
            "error",
            5000
          );

        }
        finally {

          saveSiteBtn.disabled =
            false;

        }

      }
    );


    siteTableBody.addEventListener(
      "click",
      async event => {

        const button =
          event.target.closest(
            "button[data-action]"
          );


        if (!button) {
          return;
        }


        const id =
          button.dataset.site;

        const action =
          button.dataset.action;


        const site =
          allSites.find(
            item =>
              item.id === id
          );


        if (!site) {
          return;
        }


        if (
          action === "edit"
        ) {

          openEditSiteModal(
            site
          );

          return;

        }
if (
  action === "delete"
) {

  if (!isSuperAdmin()) {
    return;
  }


  const confirmed =
    confirm(
      `Delete ${site.name} (${site.id}) permanently?\n\n` +
      `This will delete all site data and remove this site from assigned admins.\n\n` +
      `This action cannot be undone.`
    );


  if (!confirmed) {
    return;
  }


  const typedSiteId =
    prompt(
      `Type "${site.id}" to confirm permanent deletion:`
    );


  if (
    typedSiteId !== site.id
  ) {

    window.showToast?.(
      "Site ID does not match. Delete cancelled.",
      "warning",
      4000
    );

    return;

  }


  button.disabled =
    true;


  try {

    await deleteAdminSite(
      site.id
    );


    window.showToast?.(
      `${site.name} deleted permanently.`,
      "success",
      4000
    );


    await loadSites();

    notifySiteRegistryChanged();

  }
  catch (error) {

    console.error(
      error
    );


    const messages = {

      SITE_NOT_FOUND:
        "Site not found.",

      SITE_ID_REQUIRED:
        "Site ID is required.",

      SUPERADMIN_REQUIRED:
        "Superadmin access required."

    };


    window.showToast?.(
      messages[
        error?.message
      ] ||
      error?.message ||
      "Failed to delete site.",
      "error",
      5000
    );

  }
  finally {

    button.disabled =
      false;

  }


  return;

}

        if (
          action === "toggle"
        ) {

          const nextEnabled =
            !site.enabled;


          const confirmed =
            confirm(
              nextEnabled
                ? `Enable ${site.name}?`
                : `Disable ${site.name}?`
            );


          if (!confirmed) {
            return;
          }


          button.disabled =
            true;


          try {

            await setAdminSiteEnabled(
              site.id,
              nextEnabled
            );


window.showToast?.(
  nextEnabled
    ? "Site enabled."
    : "Site disabled.",
  "success",
  4000
);


await loadSites();

notifySiteRegistryChanged();

          }
          catch (error) {

            console.error(
              error
            );


            window.showToast?.(
              error?.message ||
              "Failed to update site.",
              "error",
              5000
            );

          }
          finally {

            button.disabled =
              false;

          }

        }

      }
    );


    window.addEventListener(
      "admin-sites-changed",
      loadSites
    );

  </script>


  <script src="./shared-ui.js"></script>

</body>
</html>
