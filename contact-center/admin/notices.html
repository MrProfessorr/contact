<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage Notices</title>
<link rel="stylesheet" href="./admin.css">
<link rel="stylesheet" href="../notice-shared.css">
</head>

<body>

<nav class="admin-nav">
<div class="admin-nav-inner">
<div class="admin-brand">
<h1>Support Admin</h1>

<p id="adminEmail">
Loading...
</p>

</div>


<div class="nav-links">

<a href="./contacts.html">
Contacts
</a>

<a
  href="./notices.html"
  class="active"
>
Notices
</a>
<a href="./marquee.html">
  Marquee
</a>
  <a href="./floating.html">
    Floating Image
  </a>
<a href="./loading.html">
  Loading
</a>
<a
  href="../index.html"
  target="_blank"
>
Customer
</a>
  
<a
  href="javascript:void(0)"
  id="logoutBtn"
>
Logout
</a>

</div>

</div>

</nav>



<main class="admin-container">

<div class="page-title">

<div>

<h2>
Notices
</h2>

<p>
Manage customer announcements.
</p>

</div>

</div>


<div class="admin-grid">


<section class="card">

<h3 id="formTitle">
Add Notice
</h3>


<form id="noticeForm">

<input
  id="editId"
  type="hidden"
>


<div class="form-group">

<label>
Title
</label>

<input
  id="title"
  required
  placeholder="IMPORTANT NOTICE"
>

</div>


<div class="form-group">

<label>
Message
</label>

<textarea
  id="message"
  required
  placeholder="Write notice..."
></textarea>

</div>


<div class="form-group">

<label>
Image URL
</label>

<input
  id="imageUrl"
  placeholder="https://..."
>

</div>


<div class="form-group">

<label>
Visibility
</label>

<select id="active">

<option value="true">
ACTIVE
</option>

<option value="false">
HIDDEN
</option>

</select>

</div>


<div class="form-group">

<label>
Pinned
</label>

<select id="pinned">

<option value="false">
Normal
</option>

<option value="true">
📌 PIN NOTICE
</option>

</select>

</div>


<button
  type="submit"
  class="btn btn-green full"
>
SAVE NOTICE
</button>


<button
  id="cancelBtn"
  type="button"
  class="btn btn-dark full hidden"
  style="margin-top:8px;"
>
CANCEL EDIT
</button>

</form>

</section>



<section class="card notice-admin-list-card">

  <h3>
    Notice List
  </h3>


  <div class="notice-admin-scroll">

    <div
      id="noticeList"
      class="notice-list"
    >

      <div class="empty">
        Loading...
      </div>

    </div>

  </div>

</section>

</div>

</main>


<script type="module">

import {

  db,
  requireAdmin,
  setupLogout,
  safe,

  ref,
  push,
  set,
  update,
  remove,
  onValue

} from "./admin.js";


requireAdmin();

setupLogout();


const form =
  document
    .getElementById(
      "noticeForm"
    );

const list =
  document
    .getElementById(
      "noticeList"
    );

const editId =
  document
    .getElementById(
      "editId"
    );

const cancel =
  document
    .getElementById(
      "cancelBtn"
    );


let cache = {};


/* SAVE */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const data = {

      title:
        document
          .getElementById(
            "title"
          )
          .value
          .trim(),

      message:
        document
          .getElementById(
            "message"
          )
          .value
          .trim(),

      imageUrl:
        document
          .getElementById(
            "imageUrl"
          )
          .value
          .trim(),

      active:
        document
          .getElementById(
            "active"
          )
          .value ===
          "true",

      pinned:
        document
          .getElementById(
            "pinned"
          )
          .value ===
          "true",

      updatedAt:
        Date.now()

    };


    if (editId.value) {

      await update(

        ref(
          db,
          "notices/" +
          editId.value
        ),

        data
      );

    } else {

      const newRef =
        push(
          ref(
            db,
            "notices"
          )
        );


      await set(
        newRef,
        {
          ...data,
          createdAt:
            Date.now()
        }
      );

    }


    resetForm();

  }
);


/* RESET */

function resetForm() {

  form.reset();

  editId.value =
    "";

  document
    .getElementById(
      "active"
    )
    .value =
    "true";

  document
    .getElementById(
      "pinned"
    )
    .value =
    "false";

  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "Add Notice";

  cancel
    .classList
    .add("hidden");
}


cancel.addEventListener(
  "click",
  resetForm
);


/* EDIT */

window.editNotice =
function(id) {

  const item =
    cache[id];

  if (!item)
    return;


  editId.value =
    id;

  document
    .getElementById("title")
    .value =
    item.title || "";

  document
    .getElementById("message")
    .value =
    item.message || "";

  document
    .getElementById("imageUrl")
    .value =
    item.imageUrl || "";

  document
    .getElementById("active")
    .value =
    String(
      item.active !== false
    );

  document
    .getElementById("pinned")
    .value =
    String(
      item.pinned === true
    );


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "Edit Notice";


  cancel
    .classList
    .remove("hidden");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* DELETE */

window.deleteNotice =
async function(id) {

  if (
    !confirm(
      "Delete this notice?"
    )
  ) {
    return;
  }


  await remove(
    ref(
      db,
      "notices/" + id
    )
  );

};


/* LIST */

onValue(
  ref(
    db,
    "notices"
  ),
  snapshot => {

    cache =
      snapshot.val() || {};


    const items =
      Object.entries(cache)
        .map(
          ([id,value]) => ({
            id,
            ...value
          })
        )
        .sort(
          (a,b) =>
            Number(
              b.createdAt || 0
            ) -
            Number(
              a.createdAt || 0
            )
        );


    list.innerHTML = "";


    if (!items.length) {

      list.innerHTML = `
        <div class="empty">
          No notices.
        </div>
      `;

      return;
    }


items.forEach(item => {

  const timestamp =
    Number(
      item.updatedAt ||
      item.createdAt ||
      0
    );


  let dateText =
    "";


  if (timestamp > 0) {

    try {

      dateText =
        new Date(timestamp)
          .toLocaleString(
            undefined,
            {
              dateStyle:
                "medium",

              timeStyle:
                "short"
            }
          );

    } catch {

      dateText =
        new Date(
          timestamp
        )
          .toLocaleString();

    }

  }


  let imageHtml =
    "";


  if (item.imageUrl) {

    imageHtml =
      `
        <div class="notice-image-wrap">

          <img
            class="notice-img"
            src="${safe(item.imageUrl)}"
            alt="${safe(item.title || "Notice")}"
            loading="lazy"
          >

          <div class="preview-button">
            ⛶ Preview
          </div>

        </div>
      `;

  }


  list.insertAdjacentHTML(
    "beforeend",
    `

    <article class="notice-card">

      ${imageHtml}


      <div class="notice-body">


        <div class="notice-meta">

          <span class="notice-tag">
            NOTICE
          </span>


          ${
            item.pinned === true

              ? `
                  <span class="pinned-tag">
                    📌 PINNED
                  </span>
                `

              : ""
          }


          ${
            item.active !== false

              ? `
                  <span class="admin-notice-active">
                    ● ACTIVE
                  </span>
                `

              : `
                  <span class="admin-notice-hidden">
                    ● HIDDEN
                  </span>
                `
          }

        </div>


        <h3>
          ${safe(
            item.title ||
            "Notice"
          )}
        </h3>


        <div class="notice-message">

          ${
            item.message
              ? safe(item.message)
              : "No caption."
          }

        </div>


        <div class="notice-footer">

          <div class="notice-date">

            ${
              dateText
                ? "Updated " +
                  safe(dateText)
                : ""
            }

          </div>


          <div class="admin-notice-actions">

            <button
              type="button"
              class="admin-notice-edit"
              onclick="editNotice('${item.id}')"
            >
              EDIT
            </button>


            <button
              type="button"
              class="admin-notice-delete"
              onclick="deleteNotice('${item.id}')"
            >
              DELETE
            </button>

          </div>

        </div>


      </div>

    </article>

    `
  );

});

  }
);

</script>

</body>
</html>
