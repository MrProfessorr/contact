<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manage Notices</title>
<link rel="stylesheet" href="./admin.css">
<link rel="stylesheet" href="../notice-shared.css">
</head>

<body>

<nav class="admin-nav">
<div class="admin-nav-inner">
<div class="admin-brand">
<h1>Support Admin</h1>

<p id="adminEmail">
Loading...
</p>

</div>


<div class="nav-links">

<a href="./contacts.html">
Contacts

>

</a>
<a href="./marquee.html">
  Marquee
</a>
  <a href="./floating.html">
    Floating Image
  </a>
<a href="./loading.html">
  Loading
</a>
<a
  href="../index.html"
  target="_blank"
>
Customer
</a>
  
<a
  href="javascript:void(0)"
  id="logoutBtn"
>
Logout
</a>

</div>

</div>

</nav>



<main class="admin-container">

<div class="page-title">

<div>

<h2>
Notices
</h2>

<p>
Manage customer announcements.
</p>

</div>

</div>


<div class="admin-grid">


<section class="card">

<h3 id="formTitle">
Add Notice
</h3>


<form id="noticeForm">

  <input
    id="editId"
    type="hidden"
  >


  <!-- TITLE + PINNED -->
  <div class="notice-form-row">

    <div class="form-group">

      <label>
        Title
      </label>

      <input
        id="title"
        required
        placeholder="IMPORTANT NOTICE"
      >

    </div>


    <div class="form-group">

      <label>
        Pinned
      </label>

      <select id="pinned">

        <option value="false">
          Normal
        </option>

        <option value="true">
          📌 PIN NOTICE
        </option>

      </select>

    </div>

  </div>


  <!-- MESSAGE -->
  <div class="form-group">

    <label>
      Message
    </label>

    <textarea
      id="message"
      required
      placeholder="Write notice..."
    ></textarea>

  </div>


  <!-- CLOUDINARY URL - HIDDEN -->
  <input
    id="imageUrl"
    type="hidden"
  >


  <!-- UPLOAD IMAGE -->
  <div class="notice-upload-section">

    <label>
      Notice Image
    </label>


    <input
      id="noticeImageFile"
      type="file"
      accept="image/png,image/jpeg,image/webp,image/gif"
      hidden
    >


    <button
      id="uploadNoticeImageBtn"
      type="button"
      class="notice-upload-btn"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M12 16V4m0 0L7 9m5-5 5 5M5 15v4h14v-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      Upload Image

    </button>


    <!-- SMALL IMAGE PREVIEW -->
    <div
      id="noticeImagePreview"
      class="notice-upload-preview hidden"
    >

      <img
        id="noticeImagePreviewImg"
        src=""
        alt="Notice image preview"
      >


      <div class="notice-upload-file-info">

        <strong id="noticeImageFileName">
          image.webp
        </strong>

        <span>
          Ready
        </span>

      </div>


      <button
        id="removeNoticeImageBtn"
        type="button"
        class="notice-upload-remove"
        aria-label="Remove image"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M6 7h12M10 11v6M14 11v6M9 7l1-3h4l1 3M8 7l1 13h6l1-13"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>

      </button>

    </div>

  </div>


  <!-- ACTIVE + SAVE -->
  <div class="notice-form-actions">


<label class="notice-active-switch">

  <input
    id="active"
    type="checkbox"
    checked
  >

  <span class="notice-active-slider">

    <span
      id="noticeActiveText"
      class="notice-active-text"
    >
      Active Notice
    </span>

  </span>

</label>


    <div class="notice-save-actions">

      <button
        id="cancelBtn"
        type="button"
        class="btn btn-dark hidden"
      >
        CANCEL EDIT
      </button>


      <button
        type="submit"
        class="btn btn-green"
      >
        SAVE NOTICE
      </button>

    </div>

  </div>

</form>

</section>



<section class="card notice-admin-list-card">

  <h3>
    Notice List
  </h3>


  <div class="notice-admin-scroll">

    <div
      id="noticeList"
      class="notice-list"
    >

      <div class="empty">
        Loading...
      </div>

    </div>

  </div>

</section>

</div>

</main>


<script type="module">

import {

  db,
  requireAdmin,
  setupLogout,
  safe,

  ref,
  push,
  set,
  update,
  remove,
  onValue

} from "./admin.js";


requireAdmin();

setupLogout();


const form =
  document
    .getElementById(
      "noticeForm"
    );

const list =
  document
    .getElementById(
      "noticeList"
    );

const editId =
  document
    .getElementById(
      "editId"
    );

const cancel =
  document
    .getElementById(
      "cancelBtn"
    );

const noticeActiveInput =
  document.getElementById(
    "active"
  );

const noticeActiveText =
  document.getElementById(
    "noticeActiveText"
  );


const noticeImageFile =
  document.getElementById(
    "noticeImageFile"
  );

const uploadNoticeImageBtn =
  document.getElementById(
    "uploadNoticeImageBtn"
  );

const noticeImagePreview =
  document.getElementById(
    "noticeImagePreview"
  );

const noticeImagePreviewImg =
  document.getElementById(
    "noticeImagePreviewImg"
  );

const noticeImageFileName =
  document.getElementById(
    "noticeImageFileName"
  );

const removeNoticeImageBtn =
  document.getElementById(
    "removeNoticeImageBtn"
  );


let noticePreviewObjectUrl =
  "";
let cache = {};
/* =========================================================
   CLOUDINARY
========================================================= */

const CLOUDINARY_CLOUD_NAME =
  "dqctvbenv";

const CLOUDINARY_UPLOAD_PRESET =
  "support_center";


async function uploadNoticeImage(
  file
) {

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    CLOUDINARY_UPLOAD_PRESET
  );


  formData.append(
    "folder",
    "support-center/notices"
  );


  const response =
    await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      {
        method:
          "POST",

        body:
          formData
      }
    );


  const result =
    await response.json();


  if (
    !response.ok ||
    !result.secure_url
  ) {

    console.error(
      "Cloudinary:",
      result
    );


    throw new Error(
      result?.error?.message ||
      "Image upload failed."
    );

  }


  return result.secure_url;
}
/* =========================================================
   ACTIVE TOGGLE
========================================================= */

function updateNoticeActiveText() {

  noticeActiveText.textContent =
    noticeActiveInput.checked
      ? "Active Notice"
      : "Inactive Notice";

}


noticeActiveInput
  .addEventListener(
    "change",
    updateNoticeActiveText
  );


/* =========================================================
   IMAGE PICKER
========================================================= */

uploadNoticeImageBtn
  .addEventListener(
    "click",
    () => {

      noticeImageFile.click();

    }
  );


noticeImageFile
  .addEventListener(
    "change",
    () => {

      const file =
        noticeImageFile.files[0];


      if (!file) {
        return;
      }


      if (
        !file.type.startsWith(
          "image/"
        )
      ) {

        alert(
          "Please select an image."
        );

        noticeImageFile.value =
          "";

        return;
      }


      if (
        noticePreviewObjectUrl
      ) {

        URL.revokeObjectURL(
          noticePreviewObjectUrl
        );

      }


      noticePreviewObjectUrl =
        URL.createObjectURL(
          file
        );


      noticeImagePreviewImg.src =
        noticePreviewObjectUrl;


      noticeImageFileName.textContent =
        file.name;


      noticeImagePreview
        .classList
        .remove("hidden");

    }
  );


removeNoticeImageBtn
  .addEventListener(
    "click",
    () => {

      noticeImageFile.value =
        "";


      document
        .getElementById(
          "imageUrl"
        )
        .value =
        "";


      noticeImagePreviewImg.src =
        "";


      noticeImageFileName.textContent =
        "";


      noticeImagePreview
        .classList
        .add("hidden");


      if (
        noticePreviewObjectUrl
      ) {

        URL.revokeObjectURL(
          noticePreviewObjectUrl
        );


        noticePreviewObjectUrl =
          "";

      }

    }
  );
/* =========================================================
   SAVE
========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const submitBtn =
      form.querySelector(
        'button[type="submit"]'
      );


    const oldText =
      submitBtn.textContent;


    submitBtn.disabled =
      true;


    try {

      let imageUrl =
        document
          .getElementById(
            "imageUrl"
          )
          .value
          .trim();


      const selectedFile =
        noticeImageFile.files[0];


      if (selectedFile) {

        submitBtn.textContent =
          "UPLOADING IMAGE...";


        imageUrl =
          await uploadNoticeImage(
            selectedFile
          );


        document
          .getElementById(
            "imageUrl"
          )
          .value =
          imageUrl;

      }


      submitBtn.textContent =
        "SAVING...";


      const data = {

        title:
          document
            .getElementById(
              "title"
            )
            .value
            .trim(),

        message:
          document
            .getElementById(
              "message"
            )
            .value
            .trim(),

        imageUrl:
          imageUrl,

        active:
          noticeActiveInput
            .checked,

        pinned:
          document
            .getElementById(
              "pinned"
            )
            .value ===
            "true",

        updatedAt:
          Date.now()

      };


      if (
        editId.value
      ) {

        await update(

          ref(
            db,
            "notices/" +
            editId.value
          ),

          data

        );

      } else {

        const newRef =
          push(
            ref(
              db,
              "notices"
            )
          );


        await set(
          newRef,
          {
            ...data,

            createdAt:
              Date.now()
          }
        );

      }


      resetForm();


    } catch (error) {

      console.error(
        error
      );


      alert(
        "Failed: " +
        error.message
      );


    } finally {

      submitBtn.disabled =
        false;


      submitBtn.textContent =
        oldText;

    }

  }
);


/* RESET */

function resetForm() {

  form.reset();


  editId.value =
    "";


  noticeActiveInput.checked =
    true;


  updateNoticeActiveText();


  document
    .getElementById(
      "pinned"
    )
    .value =
    "false";


  document
    .getElementById(
      "imageUrl"
    )
    .value =
    "";


  noticeImageFile.value =
    "";


  noticeImagePreviewImg.src =
    "";


  noticeImageFileName.textContent =
    "";


  noticeImagePreview
    .classList
    .add("hidden");


  if (
    noticePreviewObjectUrl
  ) {

    URL.revokeObjectURL(
      noticePreviewObjectUrl
    );


    noticePreviewObjectUrl =
      "";

  }


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "Add Notice";


  cancel
    .classList
    .add("hidden");

}


cancel.addEventListener(
  "click",
  resetForm
);


/* EDIT */

window.editNotice =
function(id) {

  const item =
    cache[id];

  if (!item)
    return;


  editId.value =
    id;

  document
    .getElementById("title")
    .value =
    item.title || "";

  document
    .getElementById("message")
    .value =
    item.message || "";

  document
    .getElementById("imageUrl")
    .value =
    item.imageUrl || "";
noticeImageFile.value =
  "";


if (
  item.imageUrl
) {

  noticeImagePreviewImg.src =
    item.imageUrl;


  noticeImageFileName.textContent =
    "Current image";


  noticeImagePreview
    .classList
    .remove("hidden");

} else {

  noticeImagePreviewImg.src =
    "";


  noticeImageFileName.textContent =
    "";


  noticeImagePreview
    .classList
    .add("hidden");

}
noticeActiveInput.checked =
  item.active !== false;


updateNoticeActiveText();

  document
    .getElementById("pinned")
    .value =
    String(
      item.pinned === true
    );


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "Edit Notice";


  cancel
    .classList
    .remove("hidden");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* DELETE */

window.deleteNotice =
async function(id) {

  if (
    !confirm(
      "Delete this notice?"
    )
  ) {
    return;
  }


  await remove(
    ref(
      db,
      "notices/" + id
    )
  );

};


/* LIST */

onValue(
  ref(
    db,
    "notices"
  ),
  snapshot => {

    cache =
      snapshot.val() || {};


    const items =
      Object.entries(cache)
        .map(
          ([id,value]) => ({
            id,
            ...value
          })
        )
        .sort(
          (a,b) =>
            Number(
              b.createdAt || 0
            ) -
            Number(
              a.createdAt || 0
            )
        );


    list.innerHTML = "";


    if (!items.length) {

      list.innerHTML = `
        <div class="empty">
          No notices.
        </div>
      `;

      return;
    }


items.forEach(item => {

  const timestamp =
    Number(
      item.updatedAt ||
      item.createdAt ||
      0
    );


  let dateText =
    "";


  if (timestamp > 0) {

    try {

      dateText =
        new Date(timestamp)
          .toLocaleString(
            undefined,
            {
              dateStyle:
                "medium",

              timeStyle:
                "short"
            }
          );

    } catch {

      dateText =
        new Date(
          timestamp
        )
          .toLocaleString();

    }

  }


  let imageHtml =
    "";


  if (item.imageUrl) {

    imageHtml =
      `
        <div class="notice-image-wrap">

          <img
            class="notice-img"
            src="${safe(item.imageUrl)}"
            alt="${safe(item.title || "Notice")}"
            loading="lazy"
          >

          <div class="preview-button">
            ⛶ Preview
          </div>

        </div>
      `;

  }


  list.insertAdjacentHTML(
    "beforeend",
    `

    <article class="notice-card">

      ${imageHtml}


      <div class="notice-body">


        <div class="notice-meta">

          <span class="notice-tag">
            NOTICE
          </span>


          ${
            item.pinned === true

              ? `
                  <span class="pinned-tag">
                    📌 PINNED
                  </span>
                `

              : ""
          }


          ${
            item.active !== false

              ? `
                  <span class="admin-notice-active">
                    ● ACTIVE
                  </span>
                `

              : `
                  <span class="admin-notice-hidden">
                    ● HIDDEN
                  </span>
                `
          }

        </div>


        <h3>
          ${safe(
            item.title ||
            "Notice"
          )}
        </h3>


        <div class="notice-message">

          ${
            item.message
              ? safe(item.message)
              : "No caption."
          }

        </div>


        <div class="notice-footer">

          <div class="notice-date">

            ${
              dateText
                ? "Updated " +
                  safe(dateText)
                : ""
            }

          </div>


          <div class="admin-notice-actions">

            <button
              type="button"
              class="admin-notice-edit"
              onclick="editNotice('${item.id}')"
            >
              EDIT
            </button>


            <button
              type="button"
              class="admin-notice-delete"
              onclick="deleteNotice('${item.id}')"
            >
              DELETE
            </button>

          </div>

        </div>


      </div>

    </article>

    `
  );

});

  }
);

</script>

</body>
</html>
