  <style>
    .login-loading{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.25);
  z-index:999999;
}

.loading-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  pointer-events:none;
}

.loading-dots{
  width:32px;
  height:32px;
  position:relative;
  margin:0 auto;
  animation:loadingRotate 1s linear infinite;
}

.loading-dots span{
  position:absolute;
  width:10px;
  height:10px;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  opacity:.25;
  animation:dotPulse 1s linear infinite;
}

.loading-dots span:nth-child(1){
  top:0;
  left:50%;
  transform:translateX(-50%);
  animation-delay:0s;
}

.loading-dots span:nth-child(2){
  right:0;
  top:50%;
  transform:translateY(-50%);
  animation-delay:.25s;
}

.loading-dots span:nth-child(3){
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  animation-delay:.5s;
}

.loading-dots span:nth-child(4){
  left:0;
  top:50%;
  transform:translateY(-50%);
  animation-delay:.75s;
}

@keyframes dotPulse{
  0%{ opacity:.2; }
  25%{ opacity:1; }
  50%{ opacity:.4; }
  100%{ opacity:.2; }
}

@keyframes loadingRotate{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}

.loading-text{
  color:#fff;
  font-size:14px;
  font-weight:400;
  text-align:center;
}
  </style>

 <form id="contactForm">

<script src="./shared-ui.js"></script>
<script type="module">

import {

  db,
  requireAdmin,
  setupLogout,
  isSuperAdmin,
  safe,
  getAdminSites,
  getAdminSitePath,
  ref,
  push,
  set,
  update,
  remove,
  onValue
} from "./admin.js";

requireAdmin();
setupLogout();
initSharedDropdowns();
function hasContactPermission(
  action
) {

  if (isSuperAdmin()) {
    return true;
  }

  const profile =
    window.getCurrentAdminProfile?.();

  return (
    profile?.role === "site_admin" &&
    profile?.permissions?.contacts?.[action] === true
  );

}
/* =========================================================
   CONTACT PAGE LOADING
========================================================= */

const contactPageLoading =
  document.getElementById(
    "contactPageLoading"
  );

function hideContactPageLoading() {

  if (!contactPageLoading) {
    return;
  }

  contactPageLoading.style.display =
    "none";
}

const form =
  document.getElementById(
    "contactForm"
  );

const editId =
  document.getElementById(
    "editId"
  );

const list =
  document.getElementById(
    "contactList"
  );

const cancel =
  document.getElementById(
    "cancelBtn"
  );
const contactImageFile =
  document.getElementById(
    "contactImageFile"
  );

const uploadContactImageBtn =
  document.getElementById(
    "uploadContactImageBtn"
  );

const contactImagePreview =
  document.getElementById(
    "contactImagePreview"
  );

const contactImagePreviewImg =
  document.getElementById(
    "contactImagePreviewImg"
  );

const contactImageFileName =
  document.getElementById(
    "contactImageFileName"
  );

const removeContactImageBtn =
  document.getElementById(
    "removeContactImageBtn"
  );


let contactPreviewObjectUrl =
  "";

let cache = {};
let contactSites = [];

let contactListeners = [];

let siteContactCache = {};

let editingSiteId = "";

function getSelectedContactSiteIds() {

  const selected =
    typeof window.getAdminSelectedSites === "function"
      ? window.getAdminSelectedSites()
      : [];


  if (
    Array.isArray(selected) &&
    selected.length
  ) {

    return selected.map(
      siteId => String(siteId)
    );

  }


return contactSites
  .map(
    site =>
      String(
        site.value ||
        site.id ||
        ""
      )
  )
  .filter(Boolean);

}


/*
  Firebase Contacts path.
*/

function getContactsPath(
  siteId
) {

  if (!siteId) {

    throw new Error(
      "SITE_REQUIRED"
    );

  }


  return getAdminSitePath(
    siteId,
    "contacts"
  );

}
function refreshContactSiteDropdown(
  preferredSiteId = ""
) {

  const select =
    document.getElementById(
      "contactSite"
    );


  if (!select) {
    return;
  }


  const selectedSiteIds =
    getSelectedContactSiteIds();


  const availableSites =
    contactSites.filter(
      site => {

        const siteId =
          String(
            site.value ||
            site.id ||
            ""
          );


        return (
          siteId &&
          selectedSiteIds.includes(
            siteId
          )
        );

      }
    );


  select.innerHTML =
    availableSites
      .map(
        site => {

          const siteId =
            String(
              site.value ||
              site.id ||
              ""
            );

          const siteName =
            site.label ||
            site.name ||
            siteId;


          return `
            <option value="${safe(siteId)}">
              ${safe(siteName)}
            </option>
          `;

        }
      )
      .join("");


  const target =
    preferredSiteId &&
    availableSites.some(
      site =>
        String(
          site.value ||
          site.id ||
          ""
        ) ===
        String(preferredSiteId)
    )
      ? String(preferredSiteId)
      : String(
          availableSites[0]?.value ||
          availableSites[0]?.id ||
          ""
        );


  select.value =
    target;


  if (
    select._sharedDropdown
  ) {

    select
      ._sharedDropdown
      .refresh();

  }

}
/* =========================================================
   CLOUDINARY
========================================================= */

const CLOUDINARY_CLOUD_NAME =
  "dqctvbenv";

const CLOUDINARY_UPLOAD_PRESET =
  "support_center";

  async function uploadContactImage(
  file
) {

  const formData =
    new FormData();


  formData.append(
    "file",
    file
  );


  formData.append(
    "upload_preset",
    CLOUDINARY_UPLOAD_PRESET
  );


  formData.append(
    "folder",
    "support-center/contacts"
  );


  const response =
    await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      {
        method:
          "POST",

        body:
          formData
      }
    );


  const result =
    await response.json();


  if (
    !response.ok ||
    !result.secure_url
  ) {

    console.error(
      "Cloudinary:",
      result
    );


    throw new Error(
      result?.error?.message ||
      "Image upload failed."
    );

  }


  return result.secure_url;
}
/* =========================================================
   IMAGE PICKER
========================================================= */

uploadContactImageBtn
  .addEventListener(
    "click",
    () => {

      contactImageFile.click();

    }
  );


contactImageFile
  .addEventListener(
    "change",
    () => {

      const file =
        contactImageFile.files[0];


      if (!file) {
        return;
      }


if (
  !file.type.startsWith(
    "image/"
  )
) {

  window.showToast(
    "Please select a valid image.",
    "warning"
  );

  contactImageFile.value =
    "";

  return;
}


      if (
        contactPreviewObjectUrl
      ) {

        URL.revokeObjectURL(
          contactPreviewObjectUrl
        );

      }


      contactPreviewObjectUrl =
        URL.createObjectURL(
          file
        );


      contactImagePreviewImg.src =
        contactPreviewObjectUrl;


      contactImageFileName.textContent =
        file.name;


      contactImagePreview
        .classList
        .remove("hidden");

    }
  );


removeContactImageBtn
  .addEventListener(
    "click",
    () => {

      contactImageFile.value =
        "";


      document
        .getElementById(
          "imageUrl"
        )
        .value =
        "";


      contactImagePreviewImg.src =
        "";


      contactImageFileName.textContent =
        "";


      contactImagePreview
        .classList
        .add("hidden");


      if (
        contactPreviewObjectUrl
      ) {

        URL.revokeObjectURL(
          contactPreviewObjectUrl
        );


        contactPreviewObjectUrl =
          "";

      }

    }
  );
/* =========================================================
   SAVE
========================================================= */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();
    const requiredPermission =
      editId.value
        ? "edit"
        : "create";


    if (
      !hasContactPermission(
        requiredPermission
      )
    ) {

      window.showToast?.(
        `You do not have permission to ${requiredPermission} contacts.`,
        "error",
        4000
      );

      return;
    }

    const submitBtn =
      form.querySelector(
        'button[type="submit"]'
      );


    const oldText =
      submitBtn.textContent;


    submitBtn.disabled =
      true;


    try {

      let imageUrl =
        document
          .getElementById(
            "imageUrl"
          )
          .value
          .trim();


      const selectedFile =
        contactImageFile.files[0];


      if (selectedFile) {

        submitBtn.textContent =
          "UPLOADING IMAGE...";


        imageUrl =
          await uploadContactImage(
            selectedFile
          );


        document
          .getElementById(
            "imageUrl"
          )
          .value =
          imageUrl;

      }


      submitBtn.textContent =
        "SAVING...";


      const data = {

        name:
          document
            .getElementById(
              "name"
            )
            .value
            .trim(),

        type:
          document
            .getElementById(
              "type"
            )
            .value,

        value:
          document
            .getElementById(
              "value"
            )
            .value
            .trim(),

        link:
          document
            .getElementById(
              "link"
            )
            .value
            .trim(),

        status:
          document
            .getElementById(
              "status"
            )
            .value,

        description:
          document
            .getElementById(
              "description"
            )
            .value
            .trim(),

        imageUrl:
          imageUrl,

        sortOrder:
          Number(
            document
              .getElementById(
                "sortOrder"
              )
              .value ||
            999
          ),

        updatedAt:
          Date.now()

      };


if (
  editId.value
) {

const targetSiteId =
  editingSiteId ||
  document
    .getElementById(
      "contactSite"
    )
    .value;


if (!targetSiteId) {

  throw new Error(
    "Please select a site."
  );

}


await update(

  ref(
    db,
    getContactsPath(
      targetSiteId
    ) +
    "/" +
    editId.value
  ),

  data

);


  window.showToast(
    "Contact updated successfully.",
    "success"
  );

} else {

const targetSiteId =
  document
    .getElementById(
      "contactSite"
    )
    .value;


if (!targetSiteId) {

  throw new Error(
    "Please select a site."
  );

}


const newRef =
  push(
    ref(
      db,
      getContactsPath(
        targetSiteId
      )
    )
  );


  await set(
    newRef,
    {
      ...data,

      createdAt:
        Date.now()
    }
  );


  window.showToast(
    "Contact added successfully.",
    "success"
  );

}


resetForm();


} catch (error) {

  console.error(
    error
  );


  window.showToast(
    "Failed to save contact: " +
      (
        error?.message ||
        "Unknown error"
      ),
    "error",
    5000
  );


} finally {

      submitBtn.disabled =
        false;


      submitBtn.textContent =
        oldText;

    }

  }
);


/* RESET */

function resetForm() {

  form.reset();

  editId.value = "";
editingSiteId = "";

document
  .getElementById(
    "editSiteId"
  )
  .value =
  "";

refreshContactSiteDropdown();
  document
    .getElementById(
      "sortOrder"
    )
    .value =
    "1";

  document.getElementById("status")
    .value =
    "active";
  document
  .getElementById("type")
  ._sharedDropdown
  ?.refresh();


document
  .getElementById("status")
  ._sharedDropdown
  ?.refresh();

  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "Add Contact";

  cancel
    .classList
    .add("hidden");

  contactImageFile.value =
  "";


document
  .getElementById(
    "imageUrl"
  )
  .value =
  "";


contactImagePreviewImg.src =
  "";


contactImageFileName.textContent =
  "";


contactImagePreview
  .classList
  .add("hidden");


if (
  contactPreviewObjectUrl
) {

  URL.revokeObjectURL(
    contactPreviewObjectUrl
  );


  contactPreviewObjectUrl =
    "";

}
}

cancel.addEventListener(
  "click",
  resetForm
);


/* EDIT */

window.editContact =
function(siteId, id) {
  if (
    !hasContactPermission("edit")
  ) {

    window.showToast?.(
      "You do not have permission to edit contacts.",
      "error",
      4000
    );

    return;
  }
  const cacheKey =
    `${siteId}:${id}`;


  const item =
    cache[cacheKey];


  if (!item) {
    return;
  }


  editingSiteId =
    siteId;


  document
    .getElementById(
      "editSiteId"
    )
    .value =
    siteId;


  refreshContactSiteDropdown(
    siteId
  );


  editId.value =
    id;

  document
    .getElementById("name")
    .value =
    item.name || "";

  document
    .getElementById("type")
    .value =
    item.type || "whatsapp";

  document
    .getElementById("value")
    .value =
    item.value || "";

  document
    .getElementById("link")
    .value =
    item.link || "";

  document
    .getElementById("status")
    .value =
    item.status || "active";
  
document
  .getElementById("type")
  ._sharedDropdown
  ?.refresh();


document
  .getElementById("status")
  ._sharedDropdown
  ?.refresh();
  
  document
    .getElementById("description")
    .value =
    item.description || "";

  document
    .getElementById("imageUrl")
    .value =
    item.imageUrl || "";
  contactImageFile.value =
  "";


if (
  item.imageUrl
) {

  contactImagePreviewImg.src =
    item.imageUrl;


  contactImageFileName.textContent =
    "Current image";


  contactImagePreview
    .classList
    .remove("hidden");

} else {

  contactImagePreviewImg.src =
    "";


  contactImageFileName.textContent =
    "";


  contactImagePreview
    .classList
    .add("hidden");

}

  document
    .getElementById("sortOrder")
    .value =
    item.sortOrder || 1;


  document
    .getElementById("formTitle")
    .textContent =
    "Edit Contact";


  cancel
    .classList
    .remove("hidden");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* DELETE */

window.deleteContact =
async function(siteId, id) {
  if (
    !hasContactPermission("delete")
  ) {

    window.showToast?.(
      "You do not have permission to delete contacts.",
      "error",
      4000
    );

    return;
  }
  if (
    !confirm(
      "Delete this contact?"
    )
  ) {
    return;
  }


  try {

await remove(
  ref(
    db,
    getContactsPath(
      siteId
    ) +
    "/" +
    id
  )
);


    window.showToast(
      "Contact deleted successfully.",
      "success"
    );


  } catch (error) {

    console.error(
      "Delete contact error:",
      error
    );


    window.showToast(
      "Failed to delete contact.",
      "error"
    );

  }

};


/* =========================================================
   MULTI SITE CONTACT LISTENER
========================================================= */

function stopAllContactListeners() {

  contactListeners.forEach(
    unsubscribe => {

      try {

        unsubscribe();

      } catch (error) {

        console.error(
          "Stop contact listener:",
          error
        );

      }

    }
  );


  contactListeners = [];

}


function rebuildContactCache() {

  cache = {};


  Object
    .entries(siteContactCache)
    .forEach(
      ([siteId, contacts]) => {

        Object
          .entries(
            contacts || {}
          )
          .forEach(
            ([id, value]) => {

              cache[
                `${siteId}:${id}`
              ] = {

                id,
                siteId,
                ...value

              };

            }
          );

      }
    );

}


function renderContacts() {

  rebuildContactCache();


  const items =
    Object
      .values(cache)
      .sort(
        (a, b) => {

          const siteCompare =
            String(a.siteId)
              .localeCompare(
                String(b.siteId)
              );


          if (siteCompare !== 0) {

            return siteCompare;

          }


          return (
            Number(
              a.sortOrder || 999
            ) -
            Number(
              b.sortOrder || 999
            )
          );

        }
      );


  list.innerHTML =
    "";


  if (!items.length) {

    list.innerHTML = `
      <div class="empty">
        No contacts yet.
      </div>
    `;

    hideContactPageLoading();

    return;

  }


  items.forEach(
    item => {

      const status =
        String(
          item.status ||
          "closed"
        )
          .toLowerCase()
          .trim();


      let statusClass =
        "status-closed";


      if (
        status === "active"
      ) {

        statusClass =
          "status-active";

      }


      if (
        status === "problem"
      ) {

        statusClass =
          "status-problem";

      }


      let buttonText =
        "OPEN CONTACT";


      if (
        item.type ===
        "whatsapp"
      ) {

        buttonText =
          "Contact Us";

      }


      if (
        item.type ===
        "telegram"
      ) {

        buttonText =
          "OPEN TELEGRAM";

      }


      if (
        status ===
        "closed"
      ) {

        buttonText =
          "UNAVAILABLE";

      }


      let iconHtml =
        "↗";


      if (
        item.type ===
        "whatsapp"
      ) {

        iconHtml =
          "💬";

      }


      if (
        item.type ===
        "telegram"
      ) {

        iconHtml =
          "✈️";

      }


      if (
        item.type ===
        "facebook"
      ) {

        iconHtml =
          "f";

      }


      if (
        item.type ===
        "instagram"
      ) {

        iconHtml =
          "◎";

      }


      if (
        item.type ===
        "website"
      ) {

        iconHtml =
          "🌐";

      }


      if (
        item.imageUrl
      ) {

        iconHtml = `
          <img
            src="${safe(item.imageUrl)}"
            alt="${safe(
              item.name ||
              "Contact"
            )}"
          >
        `;

      }


const site =
  contactSites.find(
    currentSite =>
      String(
        currentSite.value ||
        currentSite.id ||
        ""
      ) ===
      String(
        item.siteId
      )
  );


const siteName =
  site?.label ||
  site?.name ||
  item.siteId;


      list.insertAdjacentHTML(
        "beforeend",
        `

        <article class="contact-card">

          <div class="contact-icon">
            ${iconHtml}
          </div>


          <div class="contact-content">

            <div
              style="
                display:inline-flex;
                align-items:center;
                margin-bottom:6px;
                padding:3px 8px;
                border-radius:999px;
                font-size:11px;
                font-weight:700;
                background:rgba(255,255,255,.08);
              "
            >
              ${safe(siteName)}
            </div>

            <h3>
              ${safe(
                item.name ||
                "Contact"
              )}
            </h3>


            <div class="contact-value-row">

              <div class="contact-value">

                ${safe(
                  item.value ||
                  ""
                )}

              </div>


              <button
                type="button"
                class="copy-contact-btn"
                data-copy-value="${safe(
                  item.value ||
                  ""
                )}"
                aria-label="Copy contact"
              >

                <svg
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                >
                  <path
                    d="M9 18q-.825 0-1.412-.587T7 16V4q0-.825.588-1.412T9 2h9q.825 0 1.413.588T20 4v12q0 .825-.587 1.413T18 18zm0-2h9V4H9zm-4 6q-.825 0-1.412-.587T3 20V7q0-.425.288-.712T4 6t.713.288T5 7v13h10q.425 0 .713.288T16 21t-.288.713T15 22zm4-6V4z"
                    fill="currentColor"
                  />
                </svg>

              </button>

            </div>


            ${
              item.description
                ? `
                    <div class="contact-description">
                      ${safe(
                        item.description
                      )}
                    </div>
                  `
                : ""
            }

          </div>


          <span
            class="
              status-badge
              ${statusClass}
            "
          >
            ● ${safe(
              status.toUpperCase()
            )}
          </span>


          <div
            class="
              contact-open
              ${
                status === "closed"
                  ? "closed"
                  : ""
              }
            "
          >
            ${buttonText}
          </div>


<div class="admin-contact-actions">

  ${
    hasContactPermission("edit")
      ? `
          <button
            type="button"
            class="admin-contact-edit"
            onclick="editContact(
              '${safe(item.siteId)}',
              '${safe(item.id)}'
            )"
          >
            EDIT
          </button>
        `
      : ""
  }


  ${
    hasContactPermission("delete")
      ? `
          <button
            type="button"
            class="admin-contact-delete"
            onclick="deleteContact(
              '${safe(item.siteId)}',
              '${safe(item.id)}'
            )"
          >
            DELETE
          </button>
        `
      : ""
  }

</div>

        </article>

        `
      );

    }
  );


  hideContactPageLoading();

}


function startContactsListeners() {

  stopAllContactListeners();


  siteContactCache =
    {};


  const selectedSiteIds =
    getSelectedContactSiteIds();


  refreshContactSiteDropdown();


  if (
    !selectedSiteIds.length
  ) {

    cache = {};

    list.innerHTML = `
      <div class="empty">
        No sites available.
      </div>
    `;

    hideContactPageLoading();

    return;

  }


  let loadedCount =
    0;


  selectedSiteIds.forEach(
    siteId => {

      const unsubscribe =
        onValue(

          ref(
            db,
            getContactsPath(
              siteId
            )
          ),

          snapshot => {

            siteContactCache[
              siteId
            ] =
              snapshot.val() ||
              {};


            loadedCount++;


            renderContacts();


            if (
              loadedCount >=
              selectedSiteIds.length
            ) {

              hideContactPageLoading();

            }

          },

          error => {

            console.error(
              `Contacts load error (${siteId}):`,
              error
            );


            siteContactCache[
              siteId
            ] =
              {};


            loadedCount++;


            renderContacts();

          }

        );


      contactListeners.push(
        unsubscribe
      );

    }
  );

}


/* =========================================================
   ADMIN READY
========================================================= */

window.addEventListener(
  "admin-profile-ready",
  async () => {

      if (
      !hasContactPermission("view")
    ) {

      hideContactPageLoading();

      window.showToast?.(
        "You do not have permission to view Contacts.",
        "error",
        3000
      );

      setTimeout(
        () => {
          window.location.replace(
            "./visitors.html"
          );
        },
        300
      );

      return;
    }
    try {

contactSites =
  (
    await getAdminSites()
  ).filter(
    site =>
      site &&
      (
        site.value ||
        site.id
      )
  );


      refreshContactSiteDropdown();

      startContactsListeners();

    } catch (error) {

      console.error(
        "Failed to initialize contacts:",
        error
      );


      list.innerHTML = `
        <div class="empty">
          Failed to initialize contacts.
        </div>
      `;


      hideContactPageLoading();

    }

  }
);

/* =========================================================
   HEADER SITE CHANGED
========================================================= */

window.addEventListener(
  "admin-site-change",
  () => {

    resetForm();

    startContactsListeners();

  }
);
</script>
