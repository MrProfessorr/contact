<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="./logo.svg" />
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Back Office SC 🏢</title>

<link
  rel="stylesheet"
  href="./admin.css"
>

</head>
  <style>
    input {
      padding: 4px 11px;
      height:32px;
      font-size:14px;
      outline:none;
      border-radius:6px;
      color:var(--text);
      background:var(--input);
      border:1px solid #303030;
      transition: all 0.2s;
      width:100%;
    }
    .turnstile-wrap {
  width:100%;
  margin:16px 0;
}

.turnstile-wrap .cf-turnstile {
  width:100%;
}
.second-auth-title {
  margin-bottom:6px;
  color:var(--text);
  font-size:20px;
  font-weight:700;
  text-align:center;
}

.second-auth-subtitle {
  margin-bottom:20px;
  color:#9ca3af;
  font-size:13px;
  text-align:center;
}

.second-auth-user {
  margin-bottom:20px;
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border:1px solid #303030;
  border-radius:8px;
  background:var(--input);
}

.second-auth-user-label {
  margin-bottom:4px;
  color:#9ca3af;
  font-size:11px;
}

#secondAuthUsername {
  display:block;
  color:var(--text);
  font-size:14px;
}

.second-auth-change {
  padding:0;
  border:0;
  background:transparent;
  color:#3b82f6;
  font-size:12px;
  cursor:pointer;
}

.second-auth-label {
  display:block;
  margin-bottom:10px;
}

.otp-container {
  width:100%;
  margin-bottom:18px;
  display:flex;
  justify-content:center;
  gap:7px;
}

.otp-input {
  width:40px !important;
  min-width:0;
  height:46px !important;
  padding:0 !important;
  border:1px solid #303030 !important;
  border-radius:7px !important;
  background:var(--input) !important;
  color:var(--text) !important;
  font-size:20px !important;
  font-weight:700;
  text-align:center;
}

.otp-input:focus {
  border-color:#1677ff !important;
  box-shadow:
    0 0 0 2px rgba(22,119,255,.15);
}

.otp-input.filled {
  border-color:#1677ff !important;
}

@media(max-width:420px) {

  .otp-container {
    gap:5px;
  }

  .otp-input {
    width:36px !important;
    height:44px !important;
  }

}
  </style>

<body class="login-page">


<div class="login-card">

  <div class="login-logo">
    ⚡
  </div>

  <div
    id="loginError"
    class="error-box hidden"
  ></div>


  <form id="loginForm">

    <div class="form-group">

      <label>
        Username
      </label>

<input
  type="text"
  id="email"
  required
  placeholder="Username"
  autocomplete="username"
>

    </div>


    <div class="form-group">

      <label>
        Password
      </label>

      <input
        type="password"
        id="password"
        required
        placeholder="Password"
      >

    </div>


    <div class="turnstile-wrap">

      <div
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAFC_Ns5c9Jbe9ZEx"
        data-theme="dark"
        data-size="flexible"
        data-action="admin_login"
      ></div>

    </div>


    <button
      class="btn btn-primary full"
      type="submit"
    >
      Log in
    </button>

  </form>
<form
  id="secondAuthForm"
  class="hidden"
  autocomplete="off"
>

  <div class="second-auth-title">
    Two-Factor Authentication
  </div>

  <div class="second-auth-subtitle">
    Enter your second password to continue.
  </div>


  <div class="second-auth-user">

    <div>
      <div class="second-auth-user-label">
        Signing in as
      </div>

      <strong id="secondAuthUsername">
        -
      </strong>
    </div>

    <button
      type="button"
      id="changeAccountBtn"
      class="second-auth-change"
    >
      ← Change
    </button>

  </div>


  <label class="second-auth-label">
    Verification Code
  </label>


  <div
    id="otpContainer"
    class="otp-container"
  >

    <input
      class="otp-input"
      type="password"
      inputmode="numeric"
      maxlength="1"
      autocomplete="one-time-code"
      aria-label="Digit 1"
    >

    <input
      class="otp-input"
      type="password"
      inputmode="numeric"
      maxlength="1"
      aria-label="Digit 2"
    >

    <input
      class="otp-input"
      type="password"
      inputmode="numeric"
      maxlength="1"
      aria-label="Digit 3"
    >

    <input
      class="otp-input"
      type="password"
      inputmode="numeric"
      maxlength="1"
      aria-label="Digit 4"
    >

    <input
      class="otp-input"
      type="password"
      inputmode="numeric"
      maxlength="1"
      aria-label="Digit 5"
    >

    <input
      class="otp-input"
      type="password"
      inputmode="numeric"
      maxlength="1"
      aria-label="Digit 6"
    >

  </div>


  <button
    class="btn btn-primary full"
    type="submit"
  >
    Verify
  </button>

</form>
</div>

<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"
  async
  defer
></script>
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
  getDatabase,
  ref,
  get,
  set
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDl9m6icGPQ_vPh030_-vwBrYFL9sV1jZ8",

  authDomain:
    "support-pwa.firebaseapp.com",

  databaseURL:
    "https://support-pwa-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "support-pwa",

  storageBucket:
    "support-pwa.firebasestorage.app",

  messagingSenderId:
    "1036053746669",

  appId:
    "1:1036053746669:web:952df405b937cefe6d8de4"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);
  
const db =
  getDatabase(app);

const form =
  document.getElementById("loginForm");

const errorBox =
  document.getElementById("loginError");

const secondAuthForm =
  document.getElementById(
    "secondAuthForm"
  );

const secondAuthUsername =
  document.getElementById(
    "secondAuthUsername"
  );


const changeAccountBtn =
  document.getElementById(
    "changeAccountBtn"
  );


const otpContainer =
  document.getElementById(
    "otpContainer"
  );


const otpInputs =
  Array.from(
    document.querySelectorAll(
      ".otp-input"
    )
  );


let pendingUser =
  null;


let verificationPassed =
  false;
function getOtpCode() {

  return otpInputs
    .map(
      input =>
        input.value
          .replace(/\D/g, "")
    )
    .join("");

}


function clearOtp() {

  otpInputs.forEach(
    input => {

      input.value = "";

      input.classList.remove(
        "filled"
      );

    }
  );

}


otpInputs.forEach(
  (input, index) => {

    input.addEventListener(
      "input",
      () => {

        input.value =
          input.value
            .replace(/\D/g, "")
            .slice(0, 1);


        input.classList.toggle(
          "filled",
          input.value !== ""
        );


        if (
          input.value &&
          index <
            otpInputs.length - 1
        ) {

          otpInputs[
            index + 1
          ].focus();

        }

      }
    );


    input.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
            "Backspace" &&
          !input.value &&
          index > 0
        ) {

          otpInputs[
            index - 1
          ].focus();

        }

      }
    );


    input.addEventListener(
      "paste",
      event => {

        event.preventDefault();


        const digits =
          event.clipboardData
            .getData("text")
            .replace(/\D/g, "")
            .slice(0, 6);


        if (!digits) {
          return;
        }


        otpInputs.forEach(
          (otpInput, otpIndex) => {

            otpInput.value =
              digits[otpIndex] || "";

            otpInput
              .classList
              .toggle(
                "filled",
                otpInput.value !== ""
              );

          }
        );

changeAccountBtn
  ?.addEventListener(
    "click",
    async () => {

      sessionStorage.removeItem(
        "adminSecondVerifiedUid"
      );


      verificationPassed =
        false;


      pendingUser =
        null;


      await auth.signOut();


      clearOtp();


      errorBox
        .classList
        .add("hidden");


      secondAuthForm
        .classList
        .add("hidden");


      form
        .classList
        .remove("hidden");


      document
        .getElementById("email")
        ?.focus();


      window.turnstile
        ?.reset();

    }
  );
        const focusIndex =
          Math.min(
            digits.length,
            otpInputs.length
          ) - 1;


        if (focusIndex >= 0) {

          otpInputs[
            focusIndex
          ].focus();

        }

      }
    );

  }
);
function getLastAdminPage() {

  const lastPage =
    localStorage.getItem(
      "adminWorkspaceActiveTab"
    );


  return (
    lastPage &&
    /^[a-z0-9_-]+\.html$/i.test(lastPage)
  )
    ? lastPage
    : "visitors.html";

}

onAuthStateChanged(
  auth,
  async user => {

if (!user) {

  pendingUser =
    null;


  verificationPassed =
    false;


  sessionStorage.removeItem(
    "adminSecondVerifiedUid"
  );


  return;

}


    pendingUser =
      user;


    verificationPassed =
      sessionStorage.getItem(
        "adminSecondVerifiedUid"
      ) === user.uid;


    if (verificationPassed) {

      const lastPage =
        getLastAdminPage();


      location.replace(
        `./${lastPage}`
      );


      return;

    }


    try {

      const secondAuthRef =
        ref(
          db,
          `admin_second_auth/${user.uid}`
        );


      const snapshot =
        await get(
          secondAuthRef
        );


if (!snapshot.exists()) {

  const username =
    user.email
      ?.replace(
        /@5g88\.local$/i,
        ""
      ) || "Unknown";


  await set(
    secondAuthRef,
    {
      username:
        username,

      enabled:
        false,

      code:
        ""
    }
  );


  form
    .classList
    .add("hidden");


  secondAuthForm
    .classList
    .add("hidden");


  errorBox.innerHTML = `
    2nd Password is not activated.<br>
    Please contact Admin.<br><br>

    Username:
    <strong>${username}</strong><br>

    Reference:
    <strong>${user.uid}</strong>
  `;


  errorBox
    .classList
    .remove("hidden");


  return;

}


      const settings =
        snapshot.val();


      /*
        Ada record tetapi Admin
        belum enable.
      */
      if (settings.enabled !== true) {

        form
          .classList
          .add("hidden");


        secondAuthForm
          .classList
          .add("hidden");


        errorBox.textContent =
          "2nd Password is disabled. Please contact Admin.";


        errorBox
          .classList
          .remove("hidden");


        return;

      }


      /*
        Enabled tetapi Admin
        belum masukkan code.
      */
      if (
        !settings.code ||
        String(settings.code)
          .trim() === ""
      ) {

        form
          .classList
          .add("hidden");


        secondAuthForm
          .classList
          .add("hidden");


        errorBox.textContent =
          "2nd Password has not been set. Please contact Admin.";


        errorBox
          .classList
          .remove("hidden");


        return;

      }


      /*
        Semua OK.
        Tampilkan 2nd Password.
      */
form
  .classList
  .add("hidden");


secondAuthUsername.textContent =
  settings.username ||
  user.email ||
  "Admin";


clearOtp();


secondAuthForm
  .classList
  .remove("hidden");


otpInputs[0]
  ?.focus();


    } catch (error) {

      console.error(error);


      errorBox.textContent =
        "Unable to load 2nd authentication.";


      errorBox
        .classList
        .remove("hidden");

    }

  }
);


form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    errorBox
      .classList
      .add("hidden");


    let email =
      document
        .getElementById("email")
        .value
        .trim();


    if (!email.includes("@")) {

      email =
        email + "@5g88.local";

    }


    const password =
      document
        .getElementById("password")
        .value;


    try {

      const turnstileToken =
        document.querySelector(
          '[name="cf-turnstile-response"]'
        )?.value;


      if (!turnstileToken) {

        errorBox.textContent =
          "Please complete the security verification.";


        errorBox
          .classList
          .remove("hidden");


        return;

      }


      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    } catch (error) {

      console.error(error);


      errorBox.textContent =
        "Email or password incorrect.";


      errorBox
        .classList
        .remove("hidden");


      window.turnstile
        ?.reset();

    }

  }
);
secondAuthForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    errorBox
      .classList
      .add("hidden");


    if (!pendingUser) {

      errorBox.textContent =
        "Login session not found.";


      errorBox
        .classList
        .remove("hidden");


      return;

    }


const enteredCode =
  getOtpCode();


if (enteredCode.length !== 6) {

  errorBox.textContent =
    "Please enter the complete 6-digit 2nd Password.";


  errorBox
    .classList
    .remove("hidden");


  return;

}


    try {

      const secondAuthRef =
        ref(
          db,
          `admin_second_auth/${pendingUser.uid}`
        );


      const snapshot =
        await get(
          secondAuthRef
        );


      /*
        Admin belum configure.
      */
      if (!snapshot.exists()) {

        errorBox.textContent =
          "2nd Password is not activated. Please contact Admin.";


        errorBox
          .classList
          .remove("hidden");


        return;

      }


      const settings =
        snapshot.val();


      /*
        Admin disable.
      */
      if (settings.enabled !== true) {

        errorBox.textContent =
          "2nd Password is disabled. Please contact Admin.";


        errorBox
          .classList
          .remove("hidden");


        return;

      }


      /*
        Tiada code.
      */
      if (
        !settings.code ||
        String(settings.code)
          .trim() === ""
      ) {

        errorBox.textContent =
          "2nd Password has not been set. Please contact Admin.";


        errorBox
          .classList
          .remove("hidden");


        return;

      }


      /*
        Code salah.
      */
      if (
        String(settings.code) !==
        enteredCode
      ) {

        errorBox.textContent =
          "2nd Password incorrect.";


        errorBox
          .classList
          .remove("hidden");


        clearOtp();


otpInputs[0]
  ?.focus();


        return;

      }


      /*
        Verification berjaya.
      */
      verificationPassed =
        true;


      sessionStorage.setItem(
        "adminSecondVerifiedUid",
        pendingUser.uid
      );


      const lastPage =
        getLastAdminPage();


      location.replace(
        `./${lastPage}`
      );


    } catch (error) {

      console.error(error);


      errorBox.textContent =
        "Unable to verify 2nd Password.";


      errorBox
        .classList
        .remove("hidden");

    }

  }
);
</script>

</body>
</html>
