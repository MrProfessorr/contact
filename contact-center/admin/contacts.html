<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Manage Contacts</title>

<link
  rel="stylesheet"
  href="./admin.css"
>
<link
  rel="stylesheet"
  href="../contact-shared.css"
>
</head>

<body>


<nav class="admin-nav">

  <div class="admin-nav-inner">

    <div class="admin-brand">

      <h1>
        Support Admin
      </h1>

      <p id="adminEmail">
        Loading...
      </p>

    </div>


    <div class="nav-links">

      <a
        class="active"
        href="./contacts.html"
      >
        Contacts
      </a>

      <a href="./notices.html">
        Notices
      </a>

      <a href="./marquee.html">
        Marquee
      </a>
      
  <a href="./floating.html">
    Floating Image
  </a>
<a href="./loading.html">
  Loading
</a>
      <a
        href="../index.html"
        target="_blank"
      >
        Customer
      </a>

      <a
        href="javascript:void(0)"
        id="logoutBtn"
      >
        Logout
      </a>

    </div>

  </div>

</nav>



<main class="admin-container">

  <div class="page-title">

    <div>

      <h2>
        Contacts
      </h2>

      <p>
        Add, edit and manage contact status.
      </p>

    </div>

  </div>


  <div class="admin-grid">


    <!-- FORM -->

    <section class="card">

      <h3 id="formTitle">
        Add Contact
      </h3>


      <form id="contactForm">


        <input
          type="hidden"
          id="editId"
        >


        <div class="form-group">

          <label>
            Contact Name
          </label>

          <input
            id="name"
            required
            placeholder="PRIMARY WHATSAPP"
          >

        </div>


        <div class="form-group">

          <label>
            Type
          </label>

          <select id="type">

            <option value="whatsapp">
              WhatsApp
            </option>

            <option value="telegram">
              Telegram
            </option>

            <option value="website">
              Website
            </option>

            <option value="facebook">
              Facebook
            </option>

            <option value="instagram">
              Instagram
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <div class="form-group">

          <label>
            Number / Username / URL
          </label>

          <input
            id="value"
            required
            placeholder="+601162042105"
          >

        </div>


        <div class="form-group">

          <label>
            Custom Link
          </label>

          <input
            id="link"
            placeholder="Optional"
          >

          <div class="help-text">
            WhatsApp dan Telegram tak perlu isi
            custom link.
          </div>

        </div>


        <div class="form-group">

          <label>
            Status
          </label>

          <select id="status">

            <option value="active">
              🟢 ACTIVE
            </option>

            <option value="problem">
              🟡 PROBLEM
            </option>

            <option value="closed">
              🔴 CLOSED
            </option>

          </select>

        </div>


        <div class="form-group">

          <label>
            Description
          </label>

          <textarea
            id="description"
            placeholder="Main official support..."
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Image URL
          </label>

          <input
            id="imageUrl"
            placeholder="https://..."
          >

        </div>


        <div class="form-group">

          <label>
            Sort Order
          </label>

          <input
            id="sortOrder"
            type="number"
            min="1"
            value="1"
          >

        </div>


        <button
          type="submit"
          class="btn btn-green full"
        >
          SAVE CONTACT
        </button>


        <button
          type="button"
          id="cancelBtn"
          class="btn btn-dark full hidden"
          style="margin-top:8px;"
        >
          CANCEL EDIT
        </button>

      </form>

    </section>



    <!-- LIST -->

    <section class="card">

      <h3>
        Contact List
      </h3>


<div
  id="contactList"
  class="contact-list"
>

        <div class="empty">
          Loading...
        </div>

      </div>

    </section>

  </div>

</main>



<script type="module">

import {

  db,
  requireAdmin,
  setupLogout,
  safe,

  ref,
  push,
  set,
  update,
  remove,
  onValue

} from "./admin.js";


requireAdmin();

setupLogout();


const form =
  document.getElementById(
    "contactForm"
  );

const editId =
  document.getElementById(
    "editId"
  );

const list =
  document.getElementById(
    "contactList"
  );

const cancel =
  document.getElementById(
    "cancelBtn"
  );


let cache = {};


/* SAVE */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const data = {

      name:
        document
          .getElementById("name")
          .value
          .trim(),

      type:
        document
          .getElementById("type")
          .value,

      value:
        document
          .getElementById("value")
          .value
          .trim(),

      link:
        document
          .getElementById("link")
          .value
          .trim(),

      status:
        document
          .getElementById("status")
          .value,

      description:
        document
          .getElementById(
            "description"
          )
          .value
          .trim(),

      imageUrl:
        document
          .getElementById(
            "imageUrl"
          )
          .value
          .trim(),

      sortOrder:
        Number(
          document
            .getElementById(
              "sortOrder"
            )
            .value || 999
        ),

      updatedAt:
        Date.now()

    };


    try {

      if (editId.value) {

        await update(

          ref(
            db,
            "contacts/" +
            editId.value
          ),

          data
        );

      } else {

        const newRef =
          push(
            ref(
              db,
              "contacts"
            )
          );


        await set(
          newRef,
          {
            ...data,
            createdAt:
              Date.now()
          }
        );

      }


      resetForm();


    } catch (error) {

      console.error(error);

      alert(
        "Failed: " +
        error.message
      );

    }

  }
);


/* RESET */

function resetForm() {

  form.reset();

  editId.value = "";

  document
    .getElementById(
      "sortOrder"
    )
    .value =
    "1";

  document
    .getElementById(
      "status"
    )
    .value =
    "active";

  document
    .getElementById(
      "formTitle"
    )
    .textContent =
    "Add Contact";

  cancel
    .classList
    .add("hidden");
}


cancel.addEventListener(
  "click",
  resetForm
);


/* EDIT */

window.editContact =
function(id) {

  const item =
    cache[id];

  if (!item)
    return;


  editId.value =
    id;

  document
    .getElementById("name")
    .value =
    item.name || "";

  document
    .getElementById("type")
    .value =
    item.type || "whatsapp";

  document
    .getElementById("value")
    .value =
    item.value || "";

  document
    .getElementById("link")
    .value =
    item.link || "";

  document
    .getElementById("status")
    .value =
    item.status || "active";

  document
    .getElementById("description")
    .value =
    item.description || "";

  document
    .getElementById("imageUrl")
    .value =
    item.imageUrl || "";

  document
    .getElementById("sortOrder")
    .value =
    item.sortOrder || 1;


  document
    .getElementById("formTitle")
    .textContent =
    "Edit Contact";


  cancel
    .classList
    .remove("hidden");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};


/* DELETE */

window.deleteContact =
async function(id) {

  if (
    !confirm(
      "Delete this contact?"
    )
  ) {
    return;
  }


  await remove(
    ref(
      db,
      "contacts/" + id
    )
  );

};


/* LIST */

onValue(
  ref(
    db,
    "contacts"
  ),
  snapshot => {

    cache =
      snapshot.val() || {};


    const items =
      Object.entries(cache)
        .map(
          ([id,value]) => ({
            id,
            ...value
          })
        )
        .sort(
          (a,b) =>
            Number(
              a.sortOrder || 999
            ) -
            Number(
              b.sortOrder || 999
            )
        );


    list.innerHTML = "";


    if (!items.length) {

      list.innerHTML = `
        <div class="empty">
          No contacts yet.
        </div>
      `;

      return;
    }


items.forEach(item => {

  const status =
    String(
      item.status || "closed"
    )
      .toLowerCase()
      .trim();


  let statusClass =
    "status-closed";


  if (
    status === "active"
  ) {

    statusClass =
      "status-active";

  }


  if (
    status === "problem"
  ) {

    statusClass =
      "status-problem";

  }


  let buttonText =
    "OPEN CONTACT";


  if (
    item.type === "whatsapp"
  ) {

    buttonText =
      "Contact Us";

  }


  if (
    item.type === "telegram"
  ) {

    buttonText =
      "OPEN TELEGRAM";

  }


  if (
    status === "closed"
  ) {

    buttonText =
      "UNAVAILABLE";

  }


  let iconHtml =
    "↗";


  if (
    item.type === "whatsapp"
  ) {

    iconHtml =
      "💬";

  }


  if (
    item.type === "telegram"
  ) {

    iconHtml =
      "✈️";

  }


  if (
    item.type === "facebook"
  ) {

    iconHtml =
      "f";

  }


  if (
    item.type === "instagram"
  ) {

    iconHtml =
      "◎";

  }


  if (
    item.type === "website"
  ) {

    iconHtml =
      "🌐";

  }


  if (
    item.imageUrl
  ) {

    iconHtml =
      `
        <img
          src="${safe(item.imageUrl)}"
          alt="${safe(
            item.name || "Contact"
          )}"
        >
      `;

  }


  list.insertAdjacentHTML(
    "beforeend",
    `

    <article class="contact-card">


      <div class="contact-icon">

        ${iconHtml}

      </div>


      <div class="contact-content">

        <h3>
          ${safe(
            item.name ||
            "Contact"
          )}
        </h3>


        <div class="contact-value-row">

          <div class="contact-value">

            ${safe(
              item.value ||
              ""
            )}

          </div>


          <button
            type="button"
            class="copy-contact-btn"
            data-copy-value="${safe(
              item.value || ""
            )}"
            aria-label="Copy contact"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M9 18q-.825 0-1.412-.587T7 16V4q0-.825.588-1.412T9 2h9q.825 0 1.413.588T20 4v12q0 .825-.587 1.413T18 18zm0-2h9V4H9zm-4 6q-.825 0-1.412-.587T3 20V7q0-.425.288-.712T4 6t.713.288T5 7v13h10q.425 0 .713.288T16 21t-.288.713T15 22zm4-6V4z"
                fill="currentColor"
              />
            </svg>

          </button>

        </div>


        ${
          item.description

            ? `
                <div class="contact-description">

                  ${safe(
                    item.description
                  )}

                </div>
              `

            : ""
        }

      </div>


      <span
        class="
          status-badge
          ${statusClass}
        "
      >

        ● ${safe(
          status.toUpperCase()
        )}

      </span>


      <div
        class="
          contact-open
          ${status === "closed"
            ? "closed"
            : ""}
        "
      >

        ${buttonText}

      </div>


      <div class="admin-contact-actions">

        <button
          type="button"
          class="admin-contact-edit"
          onclick="editContact('${item.id}')"
        >
          EDIT
        </button>


        <button
          type="button"
          class="admin-contact-delete"
          onclick="deleteContact('${item.id}')"
        >
          DELETE
        </button>

      </div>


    </article>

    `
  );

});
  }
);
</script>

</body>
</html>
